<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A live task list built with Firestore against Nimbus." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M18 46V18h8l12 17V18h8v28h-8L26 29v17z' fill='white'/%3E%3C/svg%3E" />
    <title>Firestore Tasks</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Firebase / Firestore</p>
        <h1>Tasks, live from Firestore.</h1>
        <p class="lede">
          Stock Firestore calls handle every write, while <code>onSnapshot</code>
          keeps every open view in sync without polling.
        </p>
        <div class="connection">
          <span id="connection-dot"></span>
          <span id="connection-status">Connecting…</span>
        </div>
      </header>

      <section class="task-panel" aria-labelledby="tasks-heading">
        <form id="task-form">
          <label class="sr-only" for="task-text">Task description</label>
          <input
            id="task-text"
            name="task"
            type="text"
            required
            autocomplete="off"
            placeholder="What needs doing?"
          />
          <button type="submit">Add task</button>
        </form>
        <div class="list-heading">
          <h2 id="tasks-heading">Your tasks</h2>
          <span id="task-count">0 tasks</span>
        </div>
        <ul id="task-list" aria-live="polite"></ul>
        <p id="empty-state">Nothing here yet. Add the first task.</p>
      </section>

      <p id="error-message" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
