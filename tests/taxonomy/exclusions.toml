# Ledger of PR-tier exclusions and #[ignore] family documentation.
# scope = "filter": row enters the generated ci-pr default-filter (excludes tests
#   that would otherwise RUN on PR) — requires measured per-test evidence.
# scope = "ignored": row documents an #[ignore] family for the ignored-without-
#   ledger gate ONLY; it never enters the generated filter, so PR default-include
#   stays exact. All B1 rows are scope=ignored; keep family granularity until the
#   B2 inventory audit refines them.

[[exclusions]]
pattern = "test(/verification_harness_required_/)"
scope = "ignored"
reason = "heavy-resource"
evidence = "Harness wrappers are #[ignore] corpus drivers; verified with cargo nextest list -p nimbus-storage/-p nimbus-server --run-ignored all -E 'test(/verification_harness_required_/)' on 2026-07-05."
