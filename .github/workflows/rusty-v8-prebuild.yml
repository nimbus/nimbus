name: Rusty V8 Prebuild

on:
  workflow_dispatch:
    inputs:
      rusty_v8_ref:
        description: "rusty_v8 tag to publish, for example v149.4.0-nimbus.10"
        required: true
        type: string
      rusty_v8_sha:
        description: "Expected 40-hex commit for rusty_v8_ref (moved-tag guard)"
        required: true
        type: string
      deno_ref:
        description: "Deno ref recorded in manifest provenance"
        required: true
        type: string
      deno_sha:
        description: "Expected 40-hex commit for deno_ref (provenance record)"
        required: true
        type: string
      target:
        description: "Rust target triple to build"
        required: true
        type: choice
        default: x86_64-unknown-linux-gnu
        options:
          - x86_64-unknown-linux-gnu

# Permissions are per-job: the build jobs (which execute the fork's untrusted
# build scripts) get read-only; only the publish job — a FRESH runner that
# never ran untrusted code — gets contents:write. A single job would let a
# compromised build capture the token when a later step receives it.
permissions: {}

concurrency:
  group: rusty-v8-prebuild-${{ github.event.inputs.rusty_v8_ref }}
  cancel-in-progress: false

jobs:
  build:
    # One variant per job: a single V8 source build measures ~80 minutes on a
    # standard runner (run 28732025183), so two sequential variants cannot fit
    # any sane job budget — and one runner cannot comfortably hold two full
    # gn_out trees (C9). The matrix gives each variant its own runner, its own
    # 110-minute budget, and its own disk envelope.
    name: Build rusty_v8 prebuild (${{ matrix.variant }}, unprivileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            cargo_features: simdutf
            binding_features: _simdutf
            archive_suffix: release
          - variant: ptrcomp
            cargo_features: v8_enable_pointer_compression,simdutf
            binding_features: _ptrcomp_simdutf
            archive_suffix: release_ptrcomp

    env:
      DENO_REF: ${{ inputs.deno_ref }}
      EXPECTED_DENO_SHA: ${{ inputs.deno_sha }}
      EXPECTED_RUSTY_V8_SHA: ${{ inputs.rusty_v8_sha }}
      RUSTY_V8_REF: ${{ inputs.rusty_v8_ref }}
      TARGET: ${{ inputs.target }}
      VARIANT: ${{ matrix.variant }}
      CARGO_FEATURES: ${{ matrix.cargo_features }}

    steps:
      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Check out rusty_v8 fork
        uses: actions/checkout@v6
        with:
          repository: nimbus/rusty_v8
          ref: ${{ inputs.rusty_v8_ref }}
          path: rusty_v8
          fetch-depth: 1
          submodules: false
          # SECURITY: this job executes the fork's build scripts (build.rs,
          # GN/ninja, chromium tooling), so it is read-only AND runs
          # credential-free — never persist any token into the fork checkout.
          # Publishing happens in the separate fresh-runner job below.
          # (Both repos are public; fetches need no token.)
          persist-credentials: false

      - name: Configure googlesource credentials
        shell: bash
        env:
          GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLESOURCE_COOKIE}" ]]; then
            echo "GOOGLESOURCE_COOKIE is empty; continuing with public googlesource URLs."
            exit 0
          fi
          touch ~/.gitcookies && chmod 0600 ~/.gitcookies
          git config --global http.cookiefile ~/.gitcookies
          printf '.googlesource.com\tTRUE\t/\tTRUE\t2147483647\to\t%s\n' "${GOOGLESOURCE_COOKIE}" >> ~/.gitcookies
          git config --global url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"

      - name: Initialize fork submodules
        shell: bash
        working-directory: rusty_v8
        run: |
          set -euo pipefail
          # Intentionally non-recursive: initialize only the fork's declared
          # top-level Chromium dependency layout, not nested Chromium submodules.
          git submodule sync
          git submodule update --init --depth 1 --jobs 4
          git submodule status

      - name: Install build dependencies
        shell: bash
        working-directory: rusty_v8
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            libclang-19-dev \
            libglib2.0-dev \
            pkg-config \
            python3
          rustup toolchain install 1.91.0 --profile minimal --target "${TARGET}"
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "${GITHUB_ENV}"
          rustc --version
          cargo --version

      - name: Resolve build context
        shell: bash
        working-directory: rusty_v8
        run: |
          set -euo pipefail
          case "${RUSTY_V8_REF}" in
            v[0-9]*)
              ;;
            *)
              echo "::error::rusty_v8_ref must be a tag like v149.4.0-nimbus.10"
              exit 64
              ;;
          esac
          case "${TARGET}" in
            x86_64-unknown-linux-gnu)
              ;;
            *)
              echo "::error::unsupported target: ${TARGET}"
              exit 64
              ;;
          esac

          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host}" != "${TARGET}" ]]; then
            echo "::error::this workflow currently publishes host-target builds only; host=${host}, target=${TARGET}"
            exit 64
          fi

          # Moved-tag guard (§4 provenance): the checked-out HEAD must equal the
          # dispatcher-supplied expected commit.
          for sha_var in EXPECTED_RUSTY_V8_SHA EXPECTED_DENO_SHA; do
            if ! [[ "${!sha_var}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${sha_var} must be a 40-hex commit, got: ${!sha_var}"
              exit 64
            fi
          done
          head_sha="$(git rev-parse HEAD)"
          if [[ "${head_sha}" != "${EXPECTED_RUSTY_V8_SHA}" ]]; then
            echo "::error::rusty_v8_ref resolved to ${head_sha}, expected ${EXPECTED_RUSTY_V8_SHA} (moved tag?)"
            exit 1
          fi

          # Enforced disk headroom before the build (C9: legible, not a SIGBUS).
          free_gb="$(df --output=avail -BG / | tail -1 | tr -dc 0-9)"
          if [[ "${free_gb}" -lt 25 ]]; then
            echo "::error::only ${free_gb}G free before the ${VARIANT} build (need >= 25G)"
            exit 28
          fi

          asset_dir="${RUNNER_TEMP}/rusty-v8-prebuild-assets"
          mkdir -p "${asset_dir}"
          {
            echo "ASSET_DIR=${asset_dir}"
            echo "BUILD_TARGET_DIR=${RUNNER_TEMP}/rusty-v8-target-${VARIANT}"
            echo "ARCHIVE_NAME=librusty_v8_${{ matrix.archive_suffix }}_${TARGET}.a"
            echo "BINDING_NAME=src_binding${{ matrix.binding_features }}_release_${TARGET}.rs"
            echo "RUNNER_IMAGE=${ImageOS:-ubuntu24}-${ImageVersion:-unknown}"
          } >> "${GITHUB_ENV}"

      # FEATURE ALIGNMENT (orchestrator review): the nimbus workspace resolves the
      # v8 crate with features {default(use_custom_libcxx), simdutf} — verified via
      # `cargo tree -p nimbus-runtime -e features -i v8` — and the ptrcomp lane adds
      # v8_enable_pointer_compression. Both matrix variants therefore build with
      # simdutf enabled, and the published binding filenames carry the composed
      # features string (_simdutf / _ptrcomp_simdutf per build.rs:556-567) so the
      # consumer's derived name matches. sandbox is NOT enabled anywhere (verified 0
      # hits in the feature tree). The fork pins rustc 1.91.0 in its own
      # rust-toolchain.toml, matching the explicit install above.
      # rusty_v8 build.rs mechanics, verified from the cached Nimbus fork:
      # - V8_FROM_SOURCE chooses build_v8()+build_binding(), bypassing downloads
      #   (build.rs:103-124).
      # - build_dir() resolves Cargo OUT_DIR back to target/<profile>
      #   (build.rs:617-635). The source build's GN output is
      #   <target-dir>/<profile>/gn_out and link search is gn_out/obj
      #   (build.rs:1152-1173), with the Linux static library named
      #   librusty_v8.a (build.rs:570-575).
      # - build_binding() writes the generated binding to
      #   <target-dir>/<profile>/gn_out/src_binding.rs (build.rs:240-247).
      # - Prebuilt binding names are src_binding{features}_{profile}_{target}.rs
      #   (build.rs:887-900). The features string is composed, in order, from
      #   _ptrcomp, _sandbox, and _simdutf when the matching Cargo feature env is
      #   present; default features are the empty string (build.rs:556-567).
      # - Prebuilt profile selection is release unless V8_FORCE_DEBUG=true on a
      #   non-Windows target (build.rs:545-553). Source GN debug/release follows
      #   Cargo PROFILE (build.rs:267-273 and 1070-1080).
      - name: Build variant artifact
        shell: bash
        working-directory: rusty_v8
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          V8_FROM_SOURCE: "1"
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${BUILD_TARGET_DIR}"
          cargo build --release --locked --features "${CARGO_FEATURES}"

          archive_path="${BUILD_TARGET_DIR}/release/gn_out/obj/librusty_v8.a"
          binding_path="${BUILD_TARGET_DIR}/release/gn_out/src_binding.rs"
          test -s "${archive_path}"
          test -s "${binding_path}"

          cp "${archive_path}" "${ASSET_DIR}/${ARCHIVE_NAME}"
          cp "${binding_path}" "${ASSET_DIR}/${BINDING_NAME}"
          (
            cd "${ASSET_DIR}"
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            sha256sum "${BINDING_NAME}" > "${BINDING_NAME}.sha256"
          )
          df -h /

      - name: Write variant fragment
        shell: bash
        run: |
          set -euo pipefail
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export BUILT_AT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          asset_dir = Path(os.environ["ASSET_DIR"])

          def digest(filename: str) -> str:
              return (asset_dir / f"{filename}.sha256").read_text().split()[0]

          archive = os.environ["ARCHIVE_NAME"]
          binding = os.environ["BINDING_NAME"]
          fragment = {
              "variant": os.environ["VARIANT"],
              "rusty_v8_sha": os.environ["EXPECTED_RUSTY_V8_SHA"],
              "built_at": os.environ["BUILT_AT"],
              "runner_image": os.environ["RUNNER_IMAGE"],
              "archive": {"filename": archive, "sha256": digest(archive)},
              "src_binding": {"filename": binding, "sha256": digest(binding)},
          }
          (asset_dir / f"fragment-{os.environ['VARIANT']}.json").write_text(
              json.dumps(fragment, indent=2, sort_keys=True) + "\n"
          )
          PY
          ls -lh "${ASSET_DIR}"

      - name: Upload variant assets for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: rusty-v8-prebuild-${{ matrix.variant }}
          path: ${{ runner.temp }}/rusty-v8-prebuild-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish rusty_v8 prebuild (fresh runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: rusty-v8-${{ inputs.rusty_v8_ref }}
      RUSTY_V8_REF: ${{ inputs.rusty_v8_ref }}
      EXPECTED_RUSTY_V8_SHA: ${{ inputs.rusty_v8_sha }}
      DENO_REF: ${{ inputs.deno_ref }}
      EXPECTED_DENO_SHA: ${{ inputs.deno_sha }}
      TARGET: ${{ inputs.target }}

    steps:
      - name: Download release variant assets
        uses: actions/download-artifact@v8
        with:
          name: rusty-v8-prebuild-release
          path: ${{ runner.temp }}/rusty-v8-prebuild-assets

      - name: Download ptrcomp variant assets
        uses: actions/download-artifact@v8
        with:
          name: rusty-v8-prebuild-ptrcomp
          path: ${{ runner.temp }}/rusty-v8-prebuild-assets

      - name: Validate fragments and compose manifest
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/rusty-v8-prebuild-assets"

          # SECURITY: everything under asset_dir is UNTRUSTED (produced by jobs
          # that ran third-party build scripts). The manifest is therefore
          # composed HERE, on the trusted runner, exclusively from trusted
          # dispatch inputs plus fragment fields that pass strict validation:
          # 40-hex shape, equality with the expected SHA, exact filename
          # equality with trusted-derived names, and recomputed file digests.
          # Nothing untrusted reaches GITHUB_ENV or shell interpolation.
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export BUILT_AT ASSET_DIR="${asset_dir}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          asset_dir = Path(os.environ["ASSET_DIR"])
          target = os.environ["TARGET"]
          expected_sha = os.environ["EXPECTED_RUSTY_V8_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("expected rusty_v8 sha is not 40-hex")

          expected_names = {
              "release": (
                  f"librusty_v8_release_{target}.a",
                  f"src_binding_simdutf_release_{target}.rs",
              ),
              "ptrcomp": (
                  f"librusty_v8_release_ptrcomp_{target}.a",
                  f"src_binding_ptrcomp_simdutf_release_{target}.rs",
              ),
          }

          def recomputed(path: Path) -> str:
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          variants = []
          for variant, (want_archive, want_binding) in sorted(expected_names.items()):
              fragment = json.loads((asset_dir / f"fragment-{variant}.json").read_text())
              if fragment.get("rusty_v8_sha") != expected_sha:
                  raise SystemExit(f"{variant}: fragment sha mismatch")
              archive = fragment["archive"]["filename"]
              binding = fragment["src_binding"]["filename"]
              if archive != want_archive or binding != want_binding:
                  raise SystemExit(
                      f"{variant}: fragment filenames {archive!r}/{binding!r} do not "
                      f"match trusted-derived names {want_archive!r}/{want_binding!r}"
                  )
              for filename, claimed in (
                  (archive, fragment["archive"]["sha256"]),
                  (binding, fragment["src_binding"]["sha256"]),
              ):
                  actual = recomputed(asset_dir / filename)
                  if actual != claimed:
                      raise SystemExit(f"{variant}: digest mismatch for {filename}")
              variants.append(
                  {
                      "name": variant,
                      "profile": "release",
                      "features": "_simdutf" if variant == "release" else "_ptrcomp_simdutf",
                      "archive": fragment["archive"],
                      "src_binding": fragment["src_binding"],
                      "built_at": str(fragment.get("built_at", "")),
                      "runner_image": str(fragment.get("runner_image", "")),
                  }
              )

          manifest = {
              "rusty_v8_ref": os.environ["RUSTY_V8_REF"],
              "rusty_v8_sha": expected_sha,
              "deno_ref": os.environ["DENO_REF"],
              "deno_sha": os.environ["EXPECTED_DENO_SHA"],
              "target": target,
              "built_at": os.environ["BUILT_AT"],
              "variants": variants,
          }
          (asset_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
          (
            cd "${asset_dir}"
            rm -f fragment-release.json fragment-ptrcomp.json
            sha256sum manifest.json > manifest.json.sha256
            ls -lh
          )
          echo "ASSET_DIR=${asset_dir}" >> "${GITHUB_ENV}"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/rusty-v8-release-notes.md"
          cat > "${notes}" <<EOF
          Nimbus rusty_v8 prebuild for ${RUSTY_V8_REF}

          rusty_v8_sha: ${EXPECTED_RUSTY_V8_SHA}
          deno_ref: ${DENO_REF}
          deno_sha: ${EXPECTED_DENO_SHA}
          target: ${TARGET}
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file "${notes}" \
              --title "${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --notes-file "${notes}" \
              --title "${RELEASE_TAG}"
          fi

          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${ASSET_DIR}"/*

      - name: Attest build provenance for published assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/rusty-v8-prebuild-assets/librusty_v8_*.a
            ${{ runner.temp }}/rusty-v8-prebuild-assets/src_binding_*.rs
            ${{ runner.temp }}/rusty-v8-prebuild-assets/manifest.json

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_dir="${RUNNER_TEMP}/rusty-v8-prebuild-verify"
          rm -rf "${verify_dir}"
          mkdir -p "${verify_dir}"

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${verify_dir}" \
            --pattern '*'

          cd "${verify_dir}"
          # Expected set derives from TRUSTED inputs only. Blanket
          # `sha256sum -c` is NOT sufficient: it verifies whatever filename a
          # sidecar happens to name, so a corrupt/hostile sidecar could verify
          # a different file while the required payload goes unchecked. Verify
          # each required payload EXPLICITLY: recompute its digest, require its
          # sidecar to name exactly that payload and carry the same digest, and
          # cross-check the four variant payloads against the trusted-composed
          # manifest's digest claims.
          python3 - "${TARGET}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          target = sys.argv[1]

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          required = [
              f"librusty_v8_release_{target}.a",
              f"librusty_v8_release_ptrcomp_{target}.a",
              f"src_binding_simdutf_release_{target}.rs",
              f"src_binding_ptrcomp_simdutf_release_{target}.rs",
              "manifest.json",
          ]
          computed = {}
          for name in required:
              payload = Path(name)
              sidecar = Path(f"{name}.sha256")
              if not payload.is_file():
                  raise SystemExit(f"missing published asset {name}")
              if not sidecar.is_file():
                  raise SystemExit(f"missing checksum sidecar {name}.sha256")
              fields = sidecar.read_text().split()
              if len(fields) < 2 or fields[1].lstrip("*") != name:
                  raise SystemExit(f"sidecar {name}.sha256 does not name {name}: {fields!r}")
              actual = digest(payload)
              if actual != fields[0]:
                  raise SystemExit(f"digest mismatch for {name}: sidecar {fields[0]}, actual {actual}")
              computed[name] = actual

          manifest = json.loads(Path("manifest.json").read_text())
          for variant in manifest["variants"]:
              for key in ("archive", "src_binding"):
                  fname = variant[key]["filename"]
                  claimed = variant[key]["sha256"]
                  if fname not in computed:
                      raise SystemExit(f"manifest references unexpected asset {fname}")
                  if computed[fname] != claimed:
                      raise SystemExit(
                          f"manifest digest for {fname} ({claimed}) != recomputed ({computed[fname]})"
                      )
          print("verified: all payloads digest-checked against sidecars and manifest")
          PY
