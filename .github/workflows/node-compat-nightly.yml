name: Node Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CC2: sccache requires CARGO_INCREMENTAL=0 and routes rustc through sccache.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  rust-corpus:
    name: Rust Node Compatibility Corpus (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: node-compat-rust-corpus-ubuntu-stable-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}
          # CC10: this slot does not save. GitHub applies a 10 GiB
          # least-recently-used cap to the whole repository. Measured on
          # 2026-09-16, the pool held 10.84 GiB in 3,865 entries: this slot at
          # 4.54 GiB and the coverage slot at 4.26 GiB together held 81% of the
          # budget, which left 1.84 GiB for 3,862 sccache objects. sccache then
          # thrashed (207 of 207 write errors and a 0% hit rate on the coverage
          # reducer), so the two largest slots were starving every other lane.
          #
          # This workflow runs only on a schedule and on manual dispatch, so its
          # wall-clock time is off the pull-request critical path, and a schedule
          # runs on refs/heads/main, which is exactly when "auto" saves. It is
          # the correct slot to give up. The lane keeps sccache through
          # RUSTC_WRAPPER and gains a working sccache pool, so it does not fall
          # back to a fully cold build. Recent runs take 48 to 58 minutes against
          # the 120-minute timeout above.
          #
          # Caching contract: docs/private/operating/ci-caching.md.
          save-cache: never

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: nextest@0.9.143
          fallback: none

      # NCT2: each fixture appends one JSON object here. nextest runs every
      # test in its own process, so an in-memory buffer would not survive. The
      # shards merge in the corpus-baseline-reconciliation job.
      - name: Run Rust Node compatibility corpus
        env:
          NIMBUS_NODE_COMPAT_OBSERVED_RESULTS: target/node-compat/observed/partition-${{ strategy.job-index }}.jsonl
        run: >
          cargo nextest run -p nimbus-runtime --lib
          runtime::tests::node_compat::
          --partition hash:${{ matrix.partition }}
          --test-threads 1
          --no-fail-fast
          --failure-output immediate-final
          --success-output never
          --final-status-level slow

      # NCT5: the 150 cataloged watchpoints are #[ignore]d because they are
      # expected to fail, so the run above never executes them and the
      # unexpected-pass check had nothing to read. Measure them here.
      #
      # A test result is data for this step, not its verdict: the gate is
      # `watchpoints.py validate --observed-results` in the next job, which
      # fails when a cataloged watchpoint passes. nextest returns 0 when every
      # test passed and 100 when at least one failed, and both are valid
      # measurements. Any other exit code is a build or harness failure, and it
      # still stops the job.
      - name: Measure the ignored watchpoints
        if: always()
        env:
          NIMBUS_NODE_COMPAT_OBSERVED_RESULTS: target/node-compat/observed/watchpoints-${{ strategy.job-index }}.jsonl
        run: |
          set +e
          cargo nextest run -p nimbus-runtime --lib \
            runtime::tests::node_compat:: \
            --run-ignored only \
            --partition hash:${{ matrix.partition }} \
            --test-threads 1 \
            --no-fail-fast \
            --success-output never \
            --failure-output never
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then
            echo "::error::nextest exited $status, which is not a test result" >&2
            exit "$status"
          fi
          echo "watchpoint measurement finished with nextest status $status"

      # The corpus lane can fail, and its measurement is exactly what the next
      # job needs in that case. Uploading on failure is not a way to ignore the
      # failure: the job still reports its own status.
      - name: Upload observed corpus results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-compat-observed-${{ strategy.job-index }}
          path: target/node-compat/observed
          if-no-files-found: warn

  # NCT5: this job turns the corpus measurement into a reconciliation report.
  #
  # `watchpoints.py validate --observed-results` has always known how to detect
  # an unexpected pass: a cataloged #[ignore] watchpoint that now passes. No
  # producer of that file existed, so the check ran blind against 150 cataloged
  # entries. The corpus lane now produces one, so the loop closes.
  #
  # The job depends on the corpus lane but runs even when it fails, because a
  # failing corpus is the case that most needs the reconciliation report.
  corpus-baseline-reconciliation:
    name: Node Compatibility Corpus Reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: rust-corpus
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download observed corpus results
        uses: actions/download-artifact@v8
        with:
          pattern: node-compat-observed-*
          path: target/node-compat/observed-shards
          merge-multiple: true

      - name: Merge the partition shards
        run: |
          make node-compat-baseline-aggregate \
            OBSERVED_SHARDS=target/node-compat/observed-shards \
            OBSERVED_RESULTS=target/node-compat/observed-results.json

      - name: Guard the recorded baseline
        run: make node-compat-baseline-verify

      - name: Reconcile ignored watchpoints against the measurement
        run: |
          make node-compat-validate-watchpoints \
            OBSERVED_RESULTS=target/node-compat/observed-results.json

      # Seeding and refreshing the baseline both read this artifact.
      - name: Upload merged observed results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-compat-observed-results
          path: target/node-compat/observed-results.json
          if-no-files-found: error

  # NCT1: this job owns one question: is the vendored Node inventory correct
  # and current? It is separate from measurement on purpose.
  #
  # "probe-live" compares the live Node dist index with the checked-in lane
  # registry and exits non-zero on any difference. Node publishes patch
  # releases continuously, so this check goes red on upstream's schedule, not
  # on ours. It used to run as step 4 of 11 inside the evidence job. On
  # 2026-09-16 it reported node24 v24.21.0 against registry v24.20.0 and
  # node26 v26.8.2 against registry v26.8.1, and the seven measurement steps
  # after it never ran. A routine upstream patch release discarded the whole
  # night's compatibility evidence.
  #
  # Splitting the probe keeps the drift signal red and actionable while the
  # dashboard, the trends, and the artifact still get produced. The job needs
  # only git and python3, so it does not restore the Rust cache.
  #
  # Contract: docs/private/operating/node-compat-nightly.md.
  release-train-freshness:
    name: Node Release Train Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify vendored fixtures against their pinned upstream tags
        run: make node-compat-verify-fixture-upstream ALLOW_FETCH=1

      - name: Probe the live Node release train for drift
        run: python3 scripts/runtime/node/release_train.py probe-live

  node-compat-evidence:
    name: Node Compatibility Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: node-compat-nightly-ubuntu-stable-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js 22 for seeded slices and canaries
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/runtime/node/convex-canaries/package-lock.json
            tests/runtime/node/host-heavy-canaries/package-lock.json
            tests/runtime/node/networking-canaries/package-lock.json
            tests/runtime/node/sdk-canaries/package-lock.json
            tests/runtime/node/tooling-canaries/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # NCT1: every command here is local and deterministic. It validates the
      # checked-in metadata that the dashboard reads. The two commands that
      # reach upstream moved to the release-train-freshness job, so upstream
      # publishing a patch release can no longer discard this job's evidence.
      - name: Verify release-train metadata and docs
        run: |
          bash scripts/verify-node-lts-docs.sh
          bash scripts/verify-node-latest-suite-tags.sh
          NIMBUS_ENFORCE_CURRENT_NODE_CORPORA=1 bash scripts/verify-node-latest-suite-tags.sh
          bash scripts/verify-node-release-train.sh
          make node-compat-validate-fixtures
          make node-compat-validate-watchpoints

      - name: Emit seeded slice reports
        run: |
          make node-compat-report FAMILY=core-semantics SLICE=assert-and-buffer-foundation CAPTURE_LIVE=1
          make node-compat-report FAMILY=process-and-timing SLICE=process-foundation CAPTURE_LIVE=1
          make node-compat-report FAMILY=streams-and-local-io SLICE=os-tty-readline-foundation CAPTURE_LIVE=1
          make node-compat-report FAMILY=networking SLICE=dns-net-foundation CAPTURE_LIVE=1
          make node-compat-report FAMILY=loader-context SLICE=module-and-async-foundation CAPTURE_LIVE=1

      - name: Run application and tooling canaries
        run: |
          make node-compat-canaries-bootstrap PRESET=application
          make node-compat-canaries-bootstrap PRESET=tooling
          make node-compat-validate-claims
          make node-compat-canaries PRESET=application
          make node-compat-canaries PRESET=tooling

      - name: Set up Node.js 20 for oracle sample
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run representative Node20 oracle sample
        run: |
          make node-compat-oracle LANE=node20 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Set up Node.js 22 for oracle sample
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run representative Node22 oracle sample
        run: |
          make node-compat-oracle LANE=node22 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Set up Node.js 24 for oracle sample
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run representative Node24 oracle sample
        run: |
          make node-compat-oracle LANE=node24 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Set up Node.js 26 for current-line oracle sample
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Run representative Node26 current-line oracle sample
        run: |
          make node-compat-oracle LANE=node26 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Build dashboard summary
        run: |
          make node-compat-status
          make node-compat-dashboard
          make node-compat-trends
          make node-compat-publish-evidence PUBLISH_ROOT=target/node-compat/published

      - name: Upload node-compat artifacts
        uses: actions/upload-artifact@v7
        with:
          name: node-compat-evidence
          path: target/node-compat
          if-no-files-found: error
