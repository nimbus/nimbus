name: Bun/JSC Adapter Artifacts

on:
  workflow_dispatch:
    inputs:
      nimbus_version:
        description: "Nimbus release version or tag to embed in the adapter manifest"
        required: false
        default: ""
      release_tag:
        description: "GitHub release tag to upload assets to when publish_release_assets is true"
        required: false
        default: ""
      bun_repository:
        description: "Bun fork repository"
        required: true
        default: "nimbus/bun"
      bun_source_ref:
        description: "Bun source ref or tag"
        required: true
        default: "codex/bun-v1.4.0-release-readiness"
      bun_source_revision:
        description: "Expected Bun source commit"
        required: true
        default: "d82396603b54ba683b82368ce42030d006edbd00"
      install_bun_with_npm:
        description: "Install a pinned Bun CLI with npm before building; keep enabled for self-sufficient hosted runner dispatches"
        required: true
        type: boolean
        default: true
      bun_bootstrap_version:
        description: "Bun npm package version used only when install_bun_with_npm is true"
        required: true
        default: "1.4.0"
      publish_release_assets:
        description: "Upload verified adapter archives and adapter checksum file to the GitHub Release"
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.bun_source_ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build-adapter:
    name: Build Bun/JSC adapter (${{ matrix.platform_arch }})
    runs-on: ${{ matrix.runner }}
    # 360 (max) not 240: the namespaced adapter builds WebKit/JSC from source
    # (--webkit=local). A cold JSC/WTF build dominates the first (cache-miss)
    # dispatch; the WebKit-build cache below makes subsequent runs fast.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_arch: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - platform_arch: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6

      - name: Check out Bun source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.bun_repository }}
          ref: ${{ inputs.bun_source_ref }}
          path: bun

      - name: Free macOS runner disk for WebKit build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # The adapter lane does not use the Android toolchain. The hosted
          # arm64 image includes several SDK, platform, emulator, and NDK
          # versions whose disk would otherwise be exhausted by the cold
          # WebKit/JSC source build.
          sudo rm -rf /Users/runner/Library/Android/sdk
          brew cleanup --prune=all
          df -h /

      - name: Install Bun native build toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Bun's build (scripts/build/tools.ts, LLVM_VERSION 21.1.x) requires a
          # matching clang/lld and Bun 1.4 requires NASM. Neither hosted image
          # provides the complete set, so install it explicitly. Bun discovers
          # LLVM via /usr/lib/llvm-21/bin (apt.llvm.org) and
          # $(brew --prefix)/opt/llvm@21.
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 21
            sudo apt-get install -y clang-21 lld-21 nasm
            echo "/usr/lib/llvm-21/bin" >> "${GITHUB_PATH}"
            /usr/lib/llvm-21/bin/clang --version
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install llvm@21 lld@21 nasm
            echo "$(brew --prefix llvm@21)/bin" >> "${GITHUB_PATH}"
            echo "$(brew --prefix lld@21)/bin" >> "${GITHUB_PATH}"
            "$(brew --prefix llvm@21)/bin/clang" --version
          fi
          nasm -v

      # The adapter build uses --webkit=local (WebKit/JSC built from source with
      # the simdutf-namespace flag so Bun's simdutf symbols don't collide with
      # V8/rusty_v8 when dlopened in the same process). Bun deliberately does NOT
      # auto-clone WebKit, so the workflow must provision the pinned source and
      # expose it via BUN_WEBKIT_PATH. Both the source and the (expensive) JSC
      # build output are cached, keyed on the pin, so only a cache-miss pays the
      # multi-hour cold build.
      - name: Resolve WebKit pin and build paths
        id: webkit
        shell: bash
        run: |
          set -euo pipefail
          ver="$(grep -oE 'WEBKIT_VERSION = "[0-9a-f]{40}"' bun/scripts/build/deps/webkit.ts | grep -oE '[0-9a-f]{40}' | head -1)"
          [[ -n "${ver}" ]] || { echo "could not parse WEBKIT_VERSION from bun/scripts/build/deps/webkit.ts" >&2; exit 1; }
          src="${RUNNER_TEMP}/webkit-src"
          bun_build="${RUNNER_TEMP}/bun-build-${{ matrix.platform_arch }}"
          {
            echo "version=${ver}"
            echo "src=${src}"
            echo "webkit_build=${bun_build}/deps/WebKit"
          } >> "${GITHUB_OUTPUT}"
          # Pin a stable, cacheable Bun build dir so the WebKit output persists
          # across runs (the artifact script honors NIMBUS_BUN_BUILD_DIR).
          echo "NIMBUS_BUN_BUILD_DIR=${bun_build}" >> "${GITHUB_ENV}"
          echo "BUN_WEBKIT_PATH=${src}" >> "${GITHUB_ENV}"
          echo "WebKit pin: ${ver}"

      - name: Cache WebKit source
        id: webkit-src-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.webkit.outputs.src }}
          key: webkit-src-${{ steps.webkit.outputs.version }}

      - name: Provision WebKit source
        if: steps.webkit-src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          src="${{ steps.webkit.outputs.src }}"
          git init -q "${src}"
          git -C "${src}" remote add origin https://github.com/oven-sh/WebKit.git
          git -C "${src}" fetch --depth 1 origin "${{ steps.webkit.outputs.version }}"
          git -C "${src}" checkout -q FETCH_HEAD

      - name: Cache WebKit build (JSC/WTF from source)
        uses: actions/cache@v4
        with:
          path: ${{ steps.webkit.outputs.webkit_build }}
          key: webkit-build-${{ matrix.platform_arch }}-${{ steps.webkit.outputs.version }}-release-local-nimbus_bun_simdutf-v1

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: bun-jsc-adapter-${{ matrix.target }}-v1
          save-cache: always
          consume-prebuilt-v8: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'release' || 'false' }}
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install pinned Bun CLI
        if: inputs.install_bun_with_npm == true
        run: npm install --global "bun@${{ inputs.bun_bootstrap_version }}"

      - name: Verify Bun CLI
        run: |
          command -v bun
          bun --version
          bun --revision || true

      - name: Verify Bun source revision
        env:
          EXPECTED_REVISION: ${{ inputs.bun_source_revision }}
        run: |
          actual="$(git -C bun rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_REVISION}" ]]; then
            echo "unexpected Bun revision: expected ${EXPECTED_REVISION}, got ${actual}" >&2
            exit 65
          fi

      - name: Build, package, and verify adapter
        env:
          INPUT_NIMBUS_VERSION: ${{ inputs.nimbus_version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          nimbus_version="${INPUT_NIMBUS_VERSION}"
          if [[ -z "${nimbus_version}" ]]; then
            nimbus_version="${INPUT_RELEASE_TAG}"
          fi
          if [[ -z "${nimbus_version}" ]]; then
            nimbus_version="${GITHUB_REF_NAME:-manual}"
          fi
          bash scripts/build-bun-jsc-adapter-artifacts.sh \
            --output-dir "dist/bun-jsc-adapter-${{ matrix.platform_arch }}" \
            --bun-repo "${GITHUB_WORKSPACE}/bun" \
            --nimbus-version "${nimbus_version}" \
            --target-triple "${{ matrix.target }}" \
            --bun-source-repository "https://github.com/${{ inputs.bun_repository }}" \
            --bun-source-ref "${{ inputs.bun_source_ref }}" \
            --bun-source-revision "${{ inputs.bun_source_revision }}"

      - name: Summarize adapter proof
        if: always()
        run: |
          summary="dist/bun-jsc-adapter-${{ matrix.platform_arch }}/proof-summary-${{ matrix.platform_arch }}.txt"
          if [[ -f "${summary}" ]]; then
            {
              echo "## Bun/JSC adapter ${{ matrix.platform_arch }}"
              echo
              echo '```text'
              cat "${summary}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload adapter archive and proof logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-jsc-adapter-${{ matrix.platform_arch }}
          path: dist/bun-jsc-adapter-${{ matrix.platform_arch }}/**
          compression-level: 0
          if-no-files-found: error

  publish-release-assets:
    name: Publish Bun/JSC adapter release assets
    if: inputs.publish_release_assets == true
    needs: build-adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6

      - name: Download adapter artifacts
        uses: actions/download-artifact@v8
        with:
          path: adapter-artifacts
          pattern: bun-jsc-adapter-*
          merge-multiple: true

      - name: Generate adapter checksums
        run: |
          cd adapter-artifacts
          sha256sum nimbus-bun-jsc-adapter-*.tar.gz \
            > nimbus-bun-jsc-adapter-checksums-sha256.txt
          cat nimbus-bun-jsc-adapter-checksums-sha256.txt

      - name: Verify adapter release assets
        run: |
          bash scripts/verify-bun-jsc-release-assets.sh \
            --artifacts-dir adapter-artifacts \
            --checksums adapter-artifacts/nimbus-bun-jsc-adapter-checksums-sha256.txt \
            --require-platform linux-x86_64 \
            --require-platform darwin-arm64

      - name: Attest adapter build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            adapter-artifacts/nimbus-bun-jsc-adapter-*.tar.gz
            adapter-artifacts/nimbus-bun-jsc-adapter-checksums-sha256.txt

      - name: Upload adapter assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_NIMBUS_VERSION: ${{ inputs.nimbus_version }}
        run: |
          release_tag="${INPUT_RELEASE_TAG}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${INPUT_NIMBUS_VERSION}"
          fi
          if [[ -z "${release_tag}" ]]; then
            release_tag="${GITHUB_REF_NAME:-}"
          fi
          if [[ -z "${release_tag}" || "${release_tag}" != v* ]]; then
            echo "set release_tag or nimbus_version to the target v* release tag before publishing Bun/JSC adapter assets" >&2
            exit 64
          fi
          gh release upload "${release_tag}" \
            adapter-artifacts/nimbus-bun-jsc-adapter-*.tar.gz \
            adapter-artifacts/nimbus-bun-jsc-adapter-checksums-sha256.txt \
            --clobber
