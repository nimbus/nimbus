name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/get-started/**"
      - "docs/developers/**"
      - "docs/agents/**"
      - "docs/operators/**"
      - "docs/concepts/**"
      - "docs/reference/**"
      - "docs/brand/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/get-started/**"
      - "docs/developers/**"
      - "docs/agents/**"
      - "docs/operators/**"
      - "docs/concepts/**"
      - "docs/reference/**"
      - "docs/brand/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  docs:
    name: Build and Deploy Docs Site
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Check docs
        run: |
          if [ -f scripts/check-docs.sh ]; then
            bash scripts/check-docs.sh
          else
            echo "scripts/check-docs.sh not present yet (lands in DOC8); skipping"
          fi

      - name: Upload PR preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        working-directory: website
        run: |
          set -o pipefail
          npx wrangler versions upload 2>&1 | tee preview.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev[^ ]*' preview.log | tail -1)"
          if [[ -z "${url}" ]]; then
            echo "::error title=Docs preview URL missing::The upload succeeded but returned no preview URL"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs preview"
            echo
            echo "${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        id: preview_comment
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const url = `${{ steps.preview.outputs.url }}`;
            const marker = '<!-- nimbus-docs-preview -->';
            const body = `${marker}\n📘 Docs preview for this PR: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Report preview comment failure
        if: always() && github.event_name == 'pull_request' && steps.preview.outputs.url != '' && steps.preview_comment.outcome == 'failure'
        run: |
          echo "::warning title=Docs preview comment unavailable::The preview is available, but GitHub could not update the PR comment"
          {
            echo
            echo "> [!WARNING]"
            echo "> GitHub could not update the PR comment. Use the preview URL above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production
        if: github.event_name != 'pull_request'
        working-directory: website
        run: npx wrangler deploy
