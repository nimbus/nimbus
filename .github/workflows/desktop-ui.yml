name: Desktop UI Smoke

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/nimbus-ui/**"
      - "packages/codegen/**"
      - "packages/nimbus/**"
      - "packages/convex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/desktop-ui.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packages/nimbus-ui/**"
      - "packages/codegen/**"
      - "packages/nimbus/**"
      - "packages/convex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/desktop-ui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # CC2: route rustc through sccache. CARGO_INCREMENTAL=0 (above) is required.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  desktop-ui-smoke:
    name: Desktop UI Smoke Walk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-desktop-ui-v2
          cache-bin: "true"
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Desktop UI shell-component grep gate
        run: scripts/verify-desktop-ui-shell-gates.sh

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/nimbus-ui/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: packages/nimbus-ui
        run: npx playwright install --with-deps chromium

      - name: Run desktop UI smoke walk
        run: make verify-desktop-ui

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/nimbus-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
