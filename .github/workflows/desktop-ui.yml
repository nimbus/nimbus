name: Desktop UI Smoke

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/nimbus-ui/**"
      - "packages/codegen/**"
      - "packages/nimbus/**"
      - "packages/convex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/desktop-ui.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packages/nimbus-ui/**"
      - "packages/codegen/**"
      - "packages/nimbus/**"
      - "packages/convex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/desktop-ui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # CC2: route rustc through sccache. CARGO_INCREMENTAL=0 (above) is required.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  desktop-ui-smoke:
    name: Desktop UI Smoke Walk
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-desktop-ui-v2
          cache-bin: "true"
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Desktop UI shell-component grep gate
        run: scripts/verify-desktop-ui-shell-gates.sh

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/nimbus-ui/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: packages/nimbus-ui
        run: npx playwright install --with-deps chromium

      - name: Run desktop UI smoke walk
        id: smoke
        run: |
          set +e
          make verify-desktop-ui 2>&1 | tee /tmp/desktop-ui-smoke.out
          status=$?
          set -e
          {
            echo "## Desktop UI smoke walk"
            echo
            if [ "${status}" -eq 0 ]; then
              echo "**Status:** :white_check_mark: passed"
            else
              echo "**Status:** :x: failed (exit ${status})"
            fi
            echo
            echo "<details><summary>Output (last 80 lines)</summary>"
            echo
            echo '```'
            tail -n 80 /tmp/desktop-ui-smoke.out
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: packages/nimbus-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
