name: Coverage

# PW2: extracted from ci.yml. Coverage is not a merge gate
# (rust-gate-summary.needs: does not include it), so running it on the
# PR critical path only added wall-time without protecting `main`.
# Coverage now runs on:
#   - every push to main (so codecov has a per-commit lcov.info)
#   - a weekly schedule (so trends stay populated if main is quiet)
#   - manual dispatch (so a developer can refresh on demand)
# Pull requests intentionally do NOT trigger this workflow.

on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 08:00 UTC. Pairs with ci.yml's deny audit window.
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Per-branch concurrency; never cancel main (a cancelled main run abandons
# the lcov.info upload and Codecov's per-commit history develops gaps).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  ui-artifacts:
    # Leader job mirroring ci.yml's ui-artifacts: build the nimbus-ui
    # bundle once so the coverage shards + reducer can reuse it.
    name: UI Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Upload nimbus-ui artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts
          path: |
            packages/nimbus-ui/.nimbus/convex
            packages/nimbus-ui/dist
          if-no-files-found: error
          retention-days: 1

      # nimbus-assets embeds the dependency-closed JS package payload via
      # rust-embed; build + stage it once and pass it to the compile jobs (BPD1).
      - name: Build embedded package payload
        run: make build-packages

      - name: Upload embedded package payload
        uses: actions/upload-artifact@v7
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages
          if-no-files-found: error
          retention-days: 1

  warm-sccache:
    # Mirrors ci.yml's warm-sccache: prime sccache so coverage shards do
    # not all cold-compile identical crates in parallel.
    name: Warm sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-warm-sccache-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Warm sccache via workspace check
        run: cargo check --workspace

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  coverage-plan:
    # CS1: the shard matrix is data, not YAML. `.github/coverage-shards.json`
    # assigns every workspace member to exactly one shard or records an
    # explicit exclusion with a reason, and this job turns that file into the
    # matrix below.
    #
    # The split matters because the reducer instruments the whole workspace.
    # Before CS1 the matrix named 9 of 43 members while
    # `cargo llvm-cov report` reported on 42, so about 31 crates and roughly
    # 4,000 tests sat in the denominator at 0% and pulled the headline number
    # down for a reason that had nothing to do with test quality.
    #
    # `check-coverage-scope.py` is the drift guard. A new workspace member
    # fails this job until somebody shards it or excludes it on purpose, so
    # the gap cannot reopen silently. ci.yml runs the same guard on pull
    # requests, because this workflow does not run on them.
    name: Coverage Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify every workspace member is sharded or excluded
        run: python3 scripts/check-coverage-scope.py

      - name: Emit the shard matrix
        id: plan
        run: |
          shards="$(jq -c '[.shards[] | {shard, packages: (.packages | map("-p " + .) | join(" "))}]' .github/coverage-shards.json)"
          echo "shards=${shards}" >> "${GITHUB_OUTPUT}"
          jq -r '.shards[] | "\(.shard): \(.packages | length) packages"' .github/coverage-shards.json

  # CA3: Coverage is sharded across N parallel lanes plus a dependent
  # reducer. Each shard runs `cargo llvm-cov --no-report` over its
  # workspace member group and uploads its profraw artifact;
  # `coverage-reduce` downloads every shard's profraw, rebuilds the
  # instrumented workspace via sccache hits, and calls
  # `cargo llvm-cov report --lcov` to produce the combined lcov.info
  # consumed by codecov. Critical path is now bounded by
  # `max(shard wall) + reducer wall` instead of `sum(crates wall)`.
  coverage:
    name: Coverage shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Process-per-test is strictly slower than one process per crate, and
    # nextest's `external-provider` group serializes the provider suites that
    # `cargo test` used to interleave. Both are correctness requirements, not
    # regressions, so the bound accommodates them rather than the reverse.
    timeout-minutes: 45
    needs: [ui-artifacts, warm-sccache, coverage-plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage-plan.outputs.shards) }}
    env:
      NIMBUS_REQUIRE_EXTERNAL_PROVIDER_FIXTURES: "1"
      NIMBUS_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      NIMBUS_MYSQL_URL: mysql://root@127.0.0.1:3306/test
      # PW5: localhost (not 127.0.0.1) defensively avoids sqld's
      # subdomain-from-Host-header namespace routing. v0.24.26 had a bug
      # where with --enable-namespaces the server extracted the first
      # dotted label ("127" from "127.0.0.1") as the namespace and
      # ignored the x-namespace header. v0.24.33 fixed it, but a
      # single-label host (`localhost`) never triggers that codepath.
      NIMBUS_LIBSQL_URL: http://localhost:18080
      NIMBUS_LIBSQL_ADMIN_URL: http://localhost:18081
      # The reducer downloads every shard artifact concurrently into one
      # directory (`merge-multiple: true`), so a filename produced by two
      # shards is two writers racing on one path. cargo-llvm-cov's default
      # name is `nimbus-%p-%Nm.profraw`, which repeats whenever a pid repeats
      # on a binary both shards build. The shard name makes the namespaces
      # disjoint. cargo-llvm-cov reads this variable in `show-env` and still
      # collects `target/*.profraw`, so only the names change. %4m matches the
      # ubuntu-24.04 vCPU count, which is what cargo-llvm-cov would pick.
      LLVM_PROFILE_FILE_NAME: nimbus-${{ matrix.shard }}-%p-%4m.profraw
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-coverage-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      # Pinned to the same version ci.yml's workspace test lane uses. The
      # coverage shards must run tests the same way the merge gate does; see
      # the "Run coverage shard" step for why.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: nextest@0.9.143
          fallback: none

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      # PW1: pin libsql image + cache docker layer.
      - name: Restore cached libsql docker image
        id: libsql-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/libsql-image.tar.gz
          key: libsql-image-v0.24.33

      - name: Load cached libsql docker image
        if: steps.libsql-image-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/libsql-image.tar.gz

      # v0.24.33
      - name: Pull and save libsql docker image (cache miss)
        if: steps.libsql-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/tursodatabase/libsql-server:v0.24.33
          docker save ghcr.io/tursodatabase/libsql-server:v0.24.33 | gzip > /tmp/libsql-image.tar.gz

      # v0.24.33
      - name: Start libsql provider fixture
        run: |
          docker run --detach \
            --name nimbus-libsql-coverage \
            --publish 18080:8080 \
            --publish 18081:8081 \
            --env SQLD_ADMIN_LISTEN_ADDR=0.0.0.0:8081 \
            ghcr.io/tursodatabase/libsql-server:v0.24.33 \
            /bin/sqld --enable-namespaces --no-welcome

      - name: Wait for libsql provider fixture
        run: |
          for _ in {1..60}; do
            if curl -fsS -X POST http://localhost:18081/v1/namespaces/nimbus_coverage_probe/create \
              -H 'content-type: application/json' \
              --data '{}' >/dev/null; then
              curl -fsS -X DELETE http://localhost:18081/v1/namespaces/nimbus_coverage_probe >/dev/null || true
              exit 0
            fi
            sleep 1
          done
          docker logs nimbus-libsql-coverage
          exit 1

      - name: Run coverage shard (no report)
        # CA3: shards use cargo-llvm-cov's `show-env --export-prefix`
        # mode to set LLVM_PROFILE_FILE/RUSTFLAGS/RUSTC_WRAPPER, then run
        # the tests directly. Profraws live at `target/nimbus-*.profraw`
        # (the show-env convention) which the reducer also uses; the
        # LLVM_PROFILE_FILE pattern carries `%p`, so one profraw per test
        # process merges exactly like one profraw per test binary did.
        #
        # This runs nextest, not `cargo test`, because the workspace only
        # supports process-per-test. `cargo test` puts every test of a crate
        # in one process, and several of our invariants are process-global by
        # design -- `LocalNetworkManager::bootstrap` deliberately admits one
        # composition per process, and V8 isolate construction is guarded by
        # nextest's `runtime-v8-global` test group. Under `cargo test` those
        # tests collided with each other rather than testing anything, which
        # is what left this lane red while `make test` stayed green. Running
        # the merge gate's runner also means a coverage failure now reflects
        # the same execution model the gate does.
        #
        # CA2: --build-jobs 4 matches the ubuntu-24.04 runner vCPU count
        # under mold. Note nextest's `-j` means `--test-threads`, not build
        # jobs; test concurrency is left at the profile default (num-cpus).
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo-nextest nextest run \
            --profile coverage \
            ${{ matrix.packages }} \
            --build-jobs 4

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload coverage shard profraw
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profraw-${{ matrix.shard }}
          path: target/nimbus-${{ matrix.shard }}-*.profraw
          if-no-files-found: error
          retention-days: 1

  coverage-reduce:
    name: Coverage reducer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [coverage, ui-artifacts]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-coverage-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Rebuild instrumented workspace (no run)
        # cargo-llvm-cov's `report` subcommand needs the instrumented
        # binaries' coverage maps on the reducer. sccache hits on
        # per-crate units the shards already populated.
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --no-run --workspace --exclude nimbus-runtime -j 4

      - name: Download every shard's profraw
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-profraw-*
          path: target/
          merge-multiple: true

      - name: Generate combined coverage report
        # `--failure-mode all` is load-bearing. Several suites spawn
        # instrumented child processes and kill them during teardown; a child
        # killed inside the profiling runtime's exit flush leaves a truncated
        # .profraw behind (one page written, counters missing). llvm-profdata
        # defaults to `-failure-mode=any`, which rejects the entire merge over
        # a single unreadable input, so one such file discarded every profile
        # from every shard and failed this job. `all` excludes the
        # unreadable files and fails only when no profile can be read.
        # The count of excluded files is surfaced below rather than hidden.
        run: |
          set -o pipefail
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --lcov --output-path lcov.info \
            --failure-mode all 2>&1 | tee llvm-profdata.log
          profraw_total=$(find target -maxdepth 1 -name '*.profraw' | wc -l | tr -d ' ')
          profraw_rejected=$(grep -c 'invalid instrumentation profile data' llvm-profdata.log || true)
          echo "PROFRAW_TOTAL=${profraw_total}" >> "${GITHUB_ENV}"
          echo "PROFRAW_REJECTED=${profraw_rejected}" >> "${GITHUB_ENV}"
          if [ "${profraw_rejected}" -gt 0 ]; then
            echo "::warning::${profraw_rejected} of ${profraw_total} profraw files were unreadable and excluded from the merge."
          fi
          # `--failure-mode all` makes an empty report a success, so assert the
          # report carries data rather than shipping a silent 0% to Codecov.
          instrumented=$(awk -F: '/^LF:/ {sum += $2} END {print sum+0}' lcov.info)
          if [ "${instrumented}" -eq 0 ]; then
            echo "::error::lcov.info instruments 0 lines; the merge produced no usable coverage."
            exit 1
          fi

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Summarize coverage
        if: always()
        run: |
          if [ ! -f lcov.info ]; then
            {
              echo "## Coverage"
              echo
              echo ":warning: lcov.info not produced (reducer failed before report)."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          covered=$(awk -F: '/^LH:/ {sum += $2} END {print sum+0}' lcov.info)
          total=$(awk -F: '/^LF:/ {sum += $2} END {print sum+0}' lcov.info)
          if [ "${total}" -eq 0 ]; then
            pct="n/a"
          else
            pct=$(awk -v c="${covered}" -v t="${total}" 'BEGIN {printf "%.2f%%", (c/t)*100}')
          fi
          files=$(grep -c '^SF:' lcov.info || echo 0)
          {
            echo "## Coverage"
            echo
            echo "| metric | value |"
            echo "|---|---|"
            echo "| files instrumented | ${files} |"
            echo "| lines hit | ${covered} |"
            echo "| lines total | ${total} |"
            echo "| line coverage | ${pct} |"
            echo "| profraw files found | ${PROFRAW_TOTAL:-unknown} |"
            echo "| profraw files rejected | ${PROFRAW_REJECTED:-unknown} |"
            echo
            echo "_Codecov upload is best-effort; see the Codecov tab for trend graphs._"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
