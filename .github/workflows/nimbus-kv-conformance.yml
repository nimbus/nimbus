name: Nimbus KV Conformance

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nimbus-kv-conformance.yml"
      - "crates/nimbus-kv/**"
      - "crates/nimbus-storage/**"
      - "crates/nimbus-bin/src/kv.rs"
      - "scripts/nimbus-kv-conformance.sh"
      - "tests/nimbus-kv-skip.txt"
  pull_request:
    paths:
      - ".github/workflows/nimbus-kv-conformance.yml"
      - "crates/nimbus-kv/**"
      - "crates/nimbus-storage/**"
      - "crates/nimbus-bin/src/kv.rs"
      - "scripts/nimbus-kv-conformance.sh"
      - "tests/nimbus-kv-skip.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  nimbus-kv-conformance:
    name: Nimbus KV Valkey External Mode
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-nimbus-kv-conformance-v1
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl

      - name: Install JS dependencies
        run: npm ci

      - name: Build embedded assets
        run: make build-ui build-packages

      - name: Build nimbus binary
        run: cargo build -p nimbus-bin --bin nimbus

      - name: Run redis-rs spawned-binary harness
        env:
          REDISRS_SERVER_BIN: ${{ github.workspace }}/target/debug/nimbus
        run: cargo test -p nimbus-kv --test spawn_harness -- --ignored --nocapture

      - name: Run Valkey external-mode conformance
        env:
          REDISRS_SERVER_BIN: ${{ github.workspace }}/target/debug/nimbus
        run: bash scripts/nimbus-kv-conformance.sh
