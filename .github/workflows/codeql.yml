name: CodeQL

# CM6: SAST coverage for Nimbus. CodeQL analyzes the JavaScript/TypeScript
# package tree and the Rust workspace on every PR + weekly schedule.
#
# Rust support in CodeQL is GA as of 2025; the analysis is most useful when
# the build step exercises real codepaths, but autobuild + a workspace check
# is sufficient for the baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cadence catches new query packs / advisory drops between PRs.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Set up Rust toolchain
        if: matrix.language == 'rust'
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: codeql-rust-stable-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js
        if: matrix.language == 'rust'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        if: matrix.language == 'rust'
        run: npm ci

      - name: Build Rust workspace for CodeQL
        if: matrix.language == 'rust'
        # `cargo check` is sufficient for CodeQL — it exercises type checking
        # and macro expansion (the inputs CodeQL needs to build its database)
        # without paying the full link cost. Make's UI dependency graph runs
        # codegen + SPA build first so include_str! in nimbus-server resolves.
        run: make check

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
