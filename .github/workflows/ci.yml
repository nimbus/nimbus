name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly security audit — catches newly disclosed CVEs between PRs
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PW3: never cancel main. A cancelled main run aborts the sccache /
  # Swatinem cache-save side effects, leaving the next run cold. PR
  # branches still cancel themselves on rapid pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # CC2: route rustc through sccache on every Rust job. CARGO_INCREMENTAL=0
  # is required by sccache (already set above). Jobs without rustc invocations
  # (rust-format, js, proof-helpers, rust-gate-summary) ignore these vars.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  rust-format:
    name: Rust Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-clippy-no-bin-v2
          toolchain-components: clippy
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # `make clippy` triggers the UI dependency graph (codegen + SPA build)
      # before invoking cargo, so nimbus-convex's generated registry includes
      # and nimbus-assets' SPA embed inputs resolve. Node is therefore a build
      # prerequisite for any Rust target that touches nimbus-server.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run clippy
        run: make clippy

  deny:
    name: Rust Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-deny-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        id: deny
        run: |
          set +e
          cargo deny check 2>&1 | tee /tmp/deny.out
          status=$?
          set -e
          {
            echo "## cargo deny"
            echo
            if [ "${status}" -eq 0 ]; then
              echo "**Status:** :white_check_mark: passed"
            else
              echo "**Status:** :x: failed (exit ${status})"
            fi
            echo
            echo "<details><summary>Output (last 60 lines)</summary>"
            echo
            echo '```'
            tail -n 60 /tmp/deny.out
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Third-party attribution gate (G4)
        id: attribution
        run: |
          set +e
          bash scripts/verify-third-party-attribution.sh 2>&1 | tee /tmp/attribution.out
          status=$?
          set -e
          {
            echo "## third-party attribution gate (G4)"
            echo
            if [ "${status}" -eq 0 ]; then
              echo "**Status:** :white_check_mark: passed"
            else
              echo "**Status:** :x: failed (exit ${status})"
            fi
            echo
            echo "<details><summary>Output</summary>"
            echo
            echo '```'
            cat /tmp/attribution.out
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Third-party attribution gate unit tests
        run: bash scripts/verify-third-party-attribution-helper.sh

  rust-runtime-tests:
    name: Rust Runtime Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-runtime-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Run isolated runtime test lane
        # V8-sensitive runtime tests are subprocess-isolated in the harness, so
        # CI keeps a dedicated runtime lane instead of falling back to a global
        # single-thread workaround. The official Node compatibility corpus is a
        # conformance signal with its own dedicated workflow; keep required
        # runtime tests focused on product runtime behavior and lightweight
        # manifest/unit checks. nimbus-runtime has zero workspace deps (per
        # CLAUDE.md) so this lane intentionally has no Node/UI prerequisites.
        run: make test-rust-runtime

  rust-runtime-ptrcomp-check:
    name: Rust Runtime Ptrcomp Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-runtime-ptrcomp-no-bin-v1
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Check supported pointer-compression runtime path
        run: |
          env -u V8_FROM_SOURCE cargo check -p nimbus-runtime --lib --features v8-pointer-compression
          cargo tree -p nimbus-runtime --features v8-pointer-compression -e features -i v8 > /tmp/runtime-ptrcomp-tree.txt
          grep -F 'v8 feature "v8_enable_pointer_compression"' /tmp/runtime-ptrcomp-tree.txt
          grep -F 'v8 feature "simdutf"' /tmp/runtime-ptrcomp-tree.txt

      - name: Generate + verify embedded anchor snapshot (pointer-compression)
        # A V8 startup snapshot is platform-specific, so the feature-on (.pc.bin) anchor snapshot the
        # release/cage serving path uses is GENERATED for THIS runner's target (not committed) and
        # self-`--check`ed live. This clean job's shared gn_out/obj/librusty_v8.a is the
        # pointer-compression variant (no interleaved feature-off build to mislink it). Required by the
        # under-cage integration test below.
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-on

      - name: Run cage crash-oracle lane
        # The cross-profile shared-RO-heap crash only reproduces under the single
        # pointer-compression cage, which is exactly how release binaries ship (see
        # scripts/nimbus-release-rust-features.sh). The default feature-off runtime lane
        # cannot exercise it, so this lane runs the subprocess-isolated `isol_*` parents:
        # crash-by-design controls assert the bug still aborts by signal (non-vacuous) and the
        # fix tests assert success, each in its own process. Uses the prebuilt ptrcomp rusty_v8
        # (V8_FROM_SOURCE unset), matching the check above.
        run: env -u V8_FROM_SOURCE make test-rust-runtime-cage

      - name: Verify embedded anchor installs under the cage
        # The cfg(test) cage oracle above CANNOT exercise the EMBEDDED anchor path: under cfg(test)
        # snapshot_extensions adds a test-only extension, so provenance mismatches the committed blob
        # and try_embedded falls back to a runtime build. This integration test links NON-cfg(test)
        # nimbus-runtime, so the anchor installs FROM the committed .pc.bin into the real shared cage
        # — the production serving path. The shipped first-installer guard stays silent (the anchor is
        # the first, superset, installer).
        run: env -u V8_FROM_SOURCE cargo test -p nimbus-runtime --features v8-pointer-compression --test embedded_anchor

  profile-aware-runtime-crossover:
    name: Profile-Aware Runtime Crossover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-profile-aware-runtime-crossover-no-bin-v1
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Run PIR0/PIR2 crossover smoke benches
        env:
          NIMBUS_PIR_CROSSOVER_SAMPLE_SIZE: "10"
          NIMBUS_PIR_CROSSOVER_MEASUREMENT_TIME: "1"
          NIMBUS_PIR_CROSSOVER_WARM_UP_TIME: "1"
        run: make verify-profile-aware-runtime-crossover

  bun-runtime-contract:
    name: Bun/JSC Runtime Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-bun-runtime-contract-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # This lane touches nimbus-server runtime diagnostics and the operator UI
      # contract, so it needs the same Node/UI prerequisites as workspace lanes.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run Bun/JSC runtime contract gate
        run: make verify-bun-jsc-runtime-contract

  rust-workspace-tests:
    # CW2: Rust Workspace Tests is sharded across N partitions via
    # cargo-nextest's `--partition hash:N/M`. nextest hashes the test path to
    # produce a deterministic assignment that stays stable across runs (so
    # cache reuse and rerun-on-failure both behave). Shard 1 also runs the
    # workspace doctests because nextest does not support doc tests; the
    # doctest pass is small (~30s) so its placement on a single shard does
    # not move the wall.
    name: Rust Workspace Tests (shard ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    env:
      NIMBUS_DISABLE_IMPLICIT_EXTERNAL_PROVIDER_FIXTURES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: "1/3"
            shard-id: "1"
            run-doctests: "true"
          - partition: "2/3"
            shard-id: "2"
            run-doctests: "false"
          - partition: "3/3"
            shard-id: "3"
            run-doctests: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-workspace-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2
        with:
          tool: nextest
          fallback: none

      # `make test-rust-workspace` and `make test-rust-docs` both depend on the
      # nimbus-ui dist target, so Make's graph runs codegen + SPA build before
      # invoking cargo. Node is therefore a build prerequisite for any Rust
      # lane that touches nimbus-server.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run workspace test lane (shard ${{ matrix.partition }})
        # Verification-harness corpus tests are ignored by default and run in
        # the dedicated harness matrix below, so this lane stays focused on the
        # main workspace suite outside the runtime crate.
        env:
          NIMBUS_NEXTEST_PARTITION: ${{ matrix.partition }}
        run: make test-rust-workspace

      - name: Run workspace doctests
        if: matrix.run-doctests == 'true'
        # nextest intentionally does not run doctests, so keep this explicit
        # libtest pass to preserve the coverage of the previous cargo test lane.
        # Pinned to shard 1 so it runs exactly once across the matrix.
        run: make test-rust-docs

  external-provider-tests:
    name: External Provider Integration Tests (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    strategy:
      # CW3: split by provider so postgres / mysql / libsql run in parallel
      # instead of serialized in one ~14.6m job. Within-provider tests stay
      # serial via serial_test::serial(<provider>); across-provider was
      # always safe (different services, no shared state). Each matrix
      # shard starts only its own provider's fixture via the per-step
      # `if: matrix.provider == ...` gate, and NIMBUS_PROVIDER_FILTER tells
      # scripts/test-external-providers.sh which cargo invocations to run.
      fail-fast: false
      matrix:
        include:
          - provider: postgres
          - provider: mysql
          - provider: libsql
    env:
      NIMBUS_REQUIRE_EXTERNAL_PROVIDER_FIXTURES: "1"
      NIMBUS_PROVIDER_FILTER: ${{ matrix.provider }}
      NIMBUS_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      NIMBUS_MYSQL_URL: mysql://root@127.0.0.1:3306/test
      # PW5: localhost (not 127.0.0.1) defensively avoids sqld's
      # subdomain-from-Host-header namespace routing. v0.24.26 had a bug
      # where with --enable-namespaces the server extracted the first
      # dotted label ("127" from "127.0.0.1") as the namespace and
      # ignored the x-namespace header. v0.24.33 fixed it, but a
      # single-label host (`localhost`) never triggers that codepath.
      NIMBUS_LIBSQL_URL: http://localhost:18080
      NIMBUS_LIBSQL_ADMIN_URL: http://localhost:18081

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-external-providers-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Start postgres provider fixture
        if: matrix.provider == 'postgres'
        run: |
          docker run --detach \
            --name nimbus-postgres-provider-tests \
            --publish 5432:5432 \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --health-cmd "pg_isready -U postgres -d postgres" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 12 \
            postgres:16

      - name: Wait for postgres provider fixture
        if: matrix.provider == 'postgres'
        run: |
          for _ in {1..60}; do
            if docker exec nimbus-postgres-provider-tests pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nimbus-postgres-provider-tests
          exit 1

      - name: Start mysql provider fixture
        if: matrix.provider == 'mysql'
        run: |
          docker run --detach \
            --name nimbus-mysql-provider-tests \
            --publish 3306:3306 \
            --env MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            --env MYSQL_DATABASE=test \
            --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 12 \
            mysql:8.4

      - name: Wait for mysql provider fixture
        if: matrix.provider == 'mysql'
        run: |
          for _ in {1..60}; do
            if docker exec nimbus-mysql-provider-tests mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nimbus-mysql-provider-tests
          exit 1

      # PW1: pin libsql image to a known-good tag and cache the docker
      # image layer between runs so cold pulls don't dominate the gate path.
      # Pin selected 2026-05-23 — most recent v0.24.x present on GHCR for
      # tursodatabase/libsql-server.
      - name: Restore cached libsql docker image
        if: matrix.provider == 'libsql'
        id: libsql-image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/libsql-image.tar.gz
          key: libsql-image-v0.24.33

      - name: Load cached libsql docker image
        if: matrix.provider == 'libsql' && steps.libsql-image-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/libsql-image.tar.gz

      # v0.24.33
      - name: Pull and save libsql docker image (cache miss)
        if: matrix.provider == 'libsql' && steps.libsql-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/tursodatabase/libsql-server:v0.24.33
          docker save ghcr.io/tursodatabase/libsql-server:v0.24.33 | gzip > /tmp/libsql-image.tar.gz

      # v0.24.33
      - name: Start libsql provider fixture
        if: matrix.provider == 'libsql'
        run: |
          docker run --detach \
            --name nimbus-libsql-provider-tests \
            --publish 18080:8080 \
            --publish 18081:8081 \
            --env SQLD_ADMIN_LISTEN_ADDR=0.0.0.0:8081 \
            ghcr.io/tursodatabase/libsql-server:v0.24.33 \
            /bin/sqld --enable-namespaces --no-welcome

      - name: Wait for libsql provider fixture
        if: matrix.provider == 'libsql'
        run: |
          for _ in {1..60}; do
            if curl -fsS -X POST http://localhost:18081/v1/namespaces/nimbus_provider_probe/create \
              -H 'content-type: application/json' \
              --data '{}' >/dev/null; then
              curl -fsS -X DELETE http://localhost:18081/v1/namespaces/nimbus_provider_probe >/dev/null || true
              exit 0
            fi
            sleep 1
          done
          docker logs nimbus-libsql-provider-tests
          exit 1

      - name: Run external provider integration tests
        run: make test-external-providers

  node-faas-compatibility:
    name: Node FaaS Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk for Node compatibility evidence
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-node-faas-compat-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Set up Node.js 24 for package canaries
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/runtime/node/convex-canaries/package-lock.json
            tests/runtime/node/host-heavy-canaries/package-lock.json
            tests/runtime/node/networking-canaries/package-lock.json
            tests/runtime/node/sdk-canaries/package-lock.json

      - name: Verify Node support docs and release metadata
        run: |
          bash scripts/verify-node-lts-docs.sh
          bash scripts/verify-node-release-train.sh
          bash scripts/verify-node-latest-suite-tags.sh
          make node-compat-validate-fixtures

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Bootstrap application canaries
        run: make node-compat-canaries-bootstrap PRESET=application

      - name: Bootstrap tooling canaries
        run: make node-compat-canaries-bootstrap PRESET=tooling

      - name: Gate supported-LTS and Current application canaries
        run: |
          make node-compat-validate-claims
          make node-compat-canaries PRESET=application LANE=node22
          make node-compat-canaries PRESET=application LANE=node24
          make node-compat-canaries PRESET=application LANE=node26

      - name: Gate supported-LTS tooling canaries
        run: |
          make node-compat-canaries PRESET=tooling LANE=node22
          make node-compat-canaries PRESET=tooling LANE=node24

      - name: Set up Node.js 22 for oracle sample
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Emit Node22 oracle evidence
        run: |
          make node-compat-oracle LANE=node22 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Set up Node.js 24 for oracle sample
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Emit Node24 oracle evidence
        run: |
          make node-compat-oracle LANE=node24 SAMPLE=test/parallel/test-buffer-alloc.js NODE_BIN="$(which node)"

      - name: Build Node compatibility dashboard for PR gates
        run: make node-compat-dashboard

      - name: Verify checked-in canary support boundaries
        env:
          NIMBUS_NODE_COMPAT_DASHBOARD_PATH: target/node-compat/dashboard/dashboard-summary.json
        run: |
          bash scripts/verify-node-lts-canaries-and-oracles.sh
          bash scripts/verify-node-host-heavy-diagnostics.sh

      - name: Verify Node default runtime support hardening gate
        run: bash scripts/verify-node-default-runtime-support-hardening.sh

  node-dbus-integration:
    name: Node D-Bus Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    # The LR12 live node-workload-executor test builds nimbus-bin, which
    # embeds the operator UI through nimbus-assets — reuse the ui-artifacts
    # leader build like the other nimbus-bin-building lanes.
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-node-dbus-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Bootstrap user-mode systemd
        # GitHub runners have no interactive login session, so the per-user
        # systemd manager is not running by default. Enable lingering and start
        # user@<uid> explicitly, then wait for the session bus socket.
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus-user-session systemd-container
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service" || true
          for _ in $(seq 1 30); do
            [ -S "/run/user/${uid}/bus" ] && break
            sleep 1
          done
          {
            echo "XDG_RUNTIME_DIR=/run/user/${uid}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus"
          } >> "$GITHUB_ENV"

      - name: Verify session systemd is reachable (hard fail if not)
        # `is-system-running` may report degraded/starting on a fresh runner —
        # that is an acceptable reachability signal, NOT a reason to skip. But a
        # Manager interface that cannot be reached at all fails the job, so a
        # broken bootstrap can never masquerade as a vacuous pass.
        run: |
          set -uxo pipefail
          systemctl --user is-system-running || true
          systemctl --user show --property=Version

      - name: Run live systemd integration tests
        run: |
          set -o pipefail
          cargo test -p nimbus-node \
            --features systemd-dbus,systemd-dbus-integration-tests \
            --test zbus_systemd_live --no-fail-fast 2>&1 | tee /tmp/ndb-live.log

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Run live node workload executor test (LR12)
        run: |
          set -o pipefail
          make test-node-workload-executor-live 2>&1 | tee -a /tmp/ndb-live.log

      - name: Summarize per-test results
        if: always()
        run: |
          {
            echo "## Node D-Bus integration"
            echo
            echo "| test | result |"
            echo "|---|---|"
            grep -E '^test .* \.\.\. (ok|FAILED)$' /tmp/ndb-live.log 2>/dev/null \
              | while read -r _ name _ res; do
                  icon=":white_check_mark:"; [ "$res" = "FAILED" ] && icon=":x:"
                  echo "| ${name} | ${icon} ${res} |"
                done
            echo
            grep -E '^test result:' /tmp/ndb-live.log 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

  rust-gate-summary:
    name: Rust Gate Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always() && github.event_name != 'schedule'
    needs:
      - rust-format
      - rust-clippy
      - deny
      - rust-runtime-tests
      - rust-runtime-ptrcomp-check
      - bun-runtime-contract
      - rust-workspace-tests
      - external-provider-tests
      - node-faas-compatibility
      - node-dbus-integration

    steps:
      - name: Check Rust gate results
        env:
          FORMAT_RESULT: ${{ needs['rust-format'].result }}
          CLIPPY_RESULT: ${{ needs['rust-clippy'].result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs['deny'].result }}
          RUNTIME_TEST_RESULT: ${{ needs['rust-runtime-tests'].result }}
          RUNTIME_PTRCOMP_RESULT: ${{ needs['rust-runtime-ptrcomp-check'].result }}
          BUN_RUNTIME_CONTRACT_RESULT: ${{ needs['bun-runtime-contract'].result }}
          WORKSPACE_TEST_RESULT: ${{ needs['rust-workspace-tests'].result }}
          EXTERNAL_PROVIDER_TEST_RESULT: ${{ needs['external-provider-tests'].result }}
          NODE_FAAS_COMPATIBILITY_RESULT: ${{ needs['node-faas-compatibility'].result }}
          NODE_DBUS_RESULT: ${{ needs['node-dbus-integration'].result }}
        run: |
          printf 'format=%s\n' "${FORMAT_RESULT}"
          printf 'clippy=%s\n' "${CLIPPY_RESULT}"
          printf 'dependency-audit=%s\n' "${DEPENDENCY_AUDIT_RESULT}"
          printf 'runtime-test=%s\n' "${RUNTIME_TEST_RESULT}"
          printf 'runtime-ptrcomp=%s\n' "${RUNTIME_PTRCOMP_RESULT}"
          printf 'bun-runtime-contract=%s\n' "${BUN_RUNTIME_CONTRACT_RESULT}"
          printf 'workspace-test=%s\n' "${WORKSPACE_TEST_RESULT}"
          printf 'external-provider-test=%s\n' "${EXTERNAL_PROVIDER_TEST_RESULT}"
          printf 'node-faas-compatibility=%s\n' "${NODE_FAAS_COMPATIBILITY_RESULT}"
          printf 'node-dbus-integration=%s\n' "${NODE_DBUS_RESULT}"
          icon() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":no_entry:" ;;
              skipped) echo ":fast_forward:" ;;
              *) echo ":question:" ;;
            esac
          }
          {
            echo "## Rust gate"
            echo
            echo "| lane | result |"
            echo "|---|---|"
            echo "| rust-format | $(icon "${FORMAT_RESULT}") ${FORMAT_RESULT} |"
            echo "| rust-clippy | $(icon "${CLIPPY_RESULT}") ${CLIPPY_RESULT} |"
            echo "| deny | $(icon "${DEPENDENCY_AUDIT_RESULT}") ${DEPENDENCY_AUDIT_RESULT} |"
            echo "| rust-runtime-tests | $(icon "${RUNTIME_TEST_RESULT}") ${RUNTIME_TEST_RESULT} |"
            echo "| rust-runtime-ptrcomp-check | $(icon "${RUNTIME_PTRCOMP_RESULT}") ${RUNTIME_PTRCOMP_RESULT} |"
            echo "| bun-runtime-contract | $(icon "${BUN_RUNTIME_CONTRACT_RESULT}") ${BUN_RUNTIME_CONTRACT_RESULT} |"
            echo "| rust-workspace-tests | $(icon "${WORKSPACE_TEST_RESULT}") ${WORKSPACE_TEST_RESULT} |"
            echo "| external-provider-tests | $(icon "${EXTERNAL_PROVIDER_TEST_RESULT}") ${EXTERNAL_PROVIDER_TEST_RESULT} |"
            echo "| node-faas-compatibility | $(icon "${NODE_FAAS_COMPATIBILITY_RESULT}") ${NODE_FAAS_COMPATIBILITY_RESULT} |"
            echo "| node-dbus-integration | $(icon "${NODE_DBUS_RESULT}") ${NODE_DBUS_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${FORMAT_RESULT}" = success
          test "${CLIPPY_RESULT}" = success
          test "${DEPENDENCY_AUDIT_RESULT}" = success
          test "${RUNTIME_TEST_RESULT}" = success
          test "${RUNTIME_PTRCOMP_RESULT}" = success
          test "${BUN_RUNTIME_CONTRACT_RESULT}" = success
          test "${WORKSPACE_TEST_RESULT}" = success
          test "${EXTERNAL_PROVIDER_TEST_RESULT}" = success
          test "${NODE_FAAS_COMPATIBILITY_RESULT}" = success
          test "${NODE_DBUS_RESULT}" = success

  ui-artifacts:
    # CC4: leader job that builds the nimbus-ui artifacts (convex codegen +
    # SPA dist) once per push. Downstream Rust jobs that compile nimbus-server
    # consume the result via actions/download-artifact instead of running
    # npm ci + make build-ui themselves.
    name: UI Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Stage embedded JS package payloads
        # The embedded package tree is gitignored and required at compile time
        # by nimbus-assets' rust-embed. Stage it here so warm-sccache (which has no
        # Node toolchain) can consume it as an artifact, mirroring coverage.yml.
        run: make build-packages

      - name: Upload nimbus-ui artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts
          path: |
            packages/nimbus-ui/.nimbus/convex
            packages/nimbus-ui/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload embedded-packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages
          if-no-files-found: error
          retention-days: 1

  warm-sccache:
    # PW4c: retained. Swatinem rust-cache hit rate is uneven across jobs
    # (libsql external-provider shard shows 0% sccache (Rust) on CW5 while
    # storage harness shows 77%), so retiring warm-sccache would expose
    # the consistently-cold lanes to full cold-compile cost on every PR.
    # See docs/private/plans/proof/ci-pr-wall-sub-15/pw4c-warm-sccache-retained.md
    # for the measurement and the deferred cache-invalidation investigation.
    # CC5: warm the per-rustc-call sccache before downstream parallel Rust
    # jobs fan out. `cargo check --workspace` rustc's every workspace
    # crate and its lib/bin dep graph once, populating sccache so
    # concurrent downstream jobs hit instead of all cold-compiling
    # identical deps in parallel. CW4 dropped `--tests` from this command:
    # the test-binary rustc invocations had marginal sccache reuse benefit
    # downstream (each integration test bin is its own rustc call) while
    # adding minutes to the wall-pole warm pass. Test-bin compile is now
    # paid inline in the downstream test jobs (harness shards, coverage
    # shards), which were already sharded by CW1 and CA3 respectively.
    # The job consumes ui-artifacts because nimbus-convex's generated registry
    # includes and nimbus-assets' SPA embed inputs must be present for the
    # workspace to type-check.
    name: Warm sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-warm-sccache-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Warm sccache via workspace check
        run: cargo check --workspace

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  harness:
    name: ${{ matrix.surface-label }} Verification Harness${{ matrix.shard-label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [ui-artifacts, warm-sccache]
    strategy:
      fail-fast: false
      # CW1: server + engine surfaces are sharded across the harness corpus
      # via NIMBUS_HARNESS_SHARD=N/M. Server has 7 transport-liveness cases
      # so sharding into 4 lanes drops the post-CW0 pole; engine + storage
      # generated-history corpora have 2 cases so we cap at 2 shards there
      # (storage stays unsharded because its 8.3m duration is already well
      # below the wall pole). Runtime is fast enough to stay single-shard.
      matrix:
        include:
          - surface: storage
            surface-label: Storage
            shard: ""
            shard-label: ""
          - surface: engine
            surface-label: Engine
            shard: "1/2"
            shard-label: " (shard 1/2)"
          - surface: engine
            surface-label: Engine
            shard: "2/2"
            shard-label: " (shard 2/2)"
          - surface: server
            surface-label: Server
            shard: "1/4"
            shard-label: " (shard 1/4)"
          - surface: server
            surface-label: Server
            shard: "2/4"
            shard-label: " (shard 2/4)"
          - surface: server
            surface-label: Server
            shard: "3/4"
            shard-label: " (shard 3/4)"
          - surface: server
            surface-label: Server
            shard: "4/4"
            shard-label: " (shard 4/4)"
          - surface: runtime
            surface-label: Runtime
            shard: ""
            shard-label: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-harness-${{ matrix.surface }}-no-bin-v2
          toolchain-components: llvm-tools-preview
          linux-linker: lld
          linux-openssl-provider: system
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # CC4: nimbus-ui artifacts (convex codegen + SPA dist) are produced by
      # the ui-artifacts leader job and consumed here. Touching the files
      # bumps their mtimes above the freshly-cloned source tree so the
      # Makefile's UI_DIST_INDEX target stays satisfied and no rebuild
      # happens transitively.
      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Run required verification harness corpus
        run: bash scripts/verification-harness.sh required ${{ matrix.surface }} ${{ matrix.shard }}

  harness-nightly:
    name: Nightly ${{ matrix.surface-label }} Verification Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: storage
            surface-label: Storage
          - surface: engine
            surface-label: Engine
          - surface: server
            surface-label: Server
          - surface: runtime
            surface-label: Runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-harness-nightly-${{ matrix.surface }}-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # `make build-ui` runs codegen + SPA build via the Makefile dependency
      # graph so the nimbus-server crate compiles regardless of matrix surface.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Run nightly verification harness corpus
        run: bash scripts/verification-harness.sh nightly ${{ matrix.surface }}

  js:
    name: JavaScript Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Stage embedded packages
        run: node scripts/stage-embedded-packages.mjs

      - name: Capability boundary lint
        run: npm run lint:capability-boundary

      - name: Test
        run: npm run test --workspaces --if-present

  proof-helpers:
    name: Proof Helper Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check helper script syntax
        run: |
          bash -n scripts/collect-sqlcipher-proof-bundles.sh
          bash -n scripts/collect-nimbus-machine-guest-proof.sh
          bash -n scripts/collect-nimbus-machine-service-proof.sh
          bash -n scripts/collect-nimbus-homebrew-cask-proof.sh
          bash -n scripts/verify-bun-jsc-runtime-contract.sh
          bash -n scripts/verify-bun-jsc-in-process-lockdown.sh
          bash -n scripts/bun-jsc-adapter-contract.sh
          bash -n scripts/verify-bun-jsc-linked-adapter.sh
          bash -n scripts/build-bun-jsc-adapter-artifacts.sh
          bash -n scripts/package-bun-jsc-adapter.sh
          bash -n scripts/verify-bun-jsc-adapter-package.sh
          bash -n scripts/verify-bun-jsc-adapter-package-helper.sh
          bash -n scripts/verify-bun-jsc-release-assets.sh
          bash -n scripts/verify-bun-jsc-release-assets-helper.sh
          bash -n scripts/verify-node-full-substrate-realm.sh
          bash -n scripts/verify-runtime-execution-classification.sh
          bash -n scripts/verify-profile-aware-isolate-runtime-crossover.sh
          bash -n scripts/verify-node-release-train.sh
          bash -n scripts/verify-node-ci-nightly-lanes.sh
          bash -n scripts/build-linux-release-packages.sh
          bash -n scripts/verify-build-linux-release-packages-helper.sh
          bash -n scripts/verify-collect-sqlcipher-proof-bundles-helper.sh
          bash -n scripts/verify-nimbus-machine-guest-proof-helper.sh
          bash -n scripts/verify-nimbus-machine-service-proof-helper.sh
          bash -n scripts/verify-nimbus-homebrew-cask-proof-helper.sh
          bash -n scripts/verify-machine-os-release-default-gate.sh
          bash -n scripts/verify-machine-os-release-default-gate-helper.sh
          bash -n scripts/verify-bootc-default-promotion-gate.sh
          bash -n scripts/verify-bootc-default-promotion-gate-helper.sh
          bash -n scripts/verify-machine-os-release-ref-contract.sh
          bash -n scripts/verify-machine-os-release-ref-contract-helper.sh
          bash -n scripts/install.sh
          bash -n scripts/verify-install.sh
          bash -n scripts/verify-install-helper.sh

      - name: Verify SQLCipher proof bundle collector helper
        run: bash scripts/verify-collect-sqlcipher-proof-bundles-helper.sh

      - name: Verify guest proof helper
        run: bash scripts/verify-nimbus-machine-guest-proof-helper.sh

      - name: Verify service proof helper
        run: bash scripts/verify-nimbus-machine-service-proof-helper.sh

      - name: Verify Homebrew cask proof helper
        run: bash scripts/verify-nimbus-homebrew-cask-proof-helper.sh

      - name: Verify machine-os release default gate helper
        run: bash scripts/verify-machine-os-release-default-gate-helper.sh

      - name: Verify bootc default promotion gate helper
        run: bash scripts/verify-bootc-default-promotion-gate-helper.sh

      - name: Verify machine-os release ref contract helper
        run: bash scripts/verify-machine-os-release-ref-contract-helper.sh

      - name: Verify Bun/JSC adapter package helper
        run: bash scripts/verify-bun-jsc-adapter-package-helper.sh

      - name: Verify Bun/JSC release asset helper
        run: bash scripts/verify-bun-jsc-release-assets-helper.sh

      - name: Verify Linux package helper
        run: bash scripts/verify-build-linux-release-packages-helper.sh

      - name: Verify shipped systemd unit
        run: |
          sudo install -m 0755 /bin/true /usr/bin/nimbus
          systemd-analyze verify packaging/systemd/nimbus.service
          sudo rm -f /usr/bin/nimbus

      - name: Verify install script helper
        run: bash scripts/verify-install-helper.sh

# PW2: Coverage moved to .github/workflows/coverage.yml.
# Not a merge gate (rust-gate-summary.needs excludes it); now fires on
# push.main + schedule + workflow_dispatch only.
