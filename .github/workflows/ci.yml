  node-faas-canaries:
    name: Node FaaS Canaries (${{ matrix.preset }} ${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.event_name != 'schedule'
    needs: [nimbus-bin-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: application
            lane: node22
          - preset: application
            lane: node24
          - preset: application
            lane: node26
          - preset: tooling
            lane: node22
          - preset: tooling
            lane: node24
    env:
      NEXTEST_BIN_EXE_nimbus: ${{ github.workspace }}/target/ci-archive/nimbus

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk for Node compatibility evidence
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-node-faas-compat-no-bin-v2
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-bin binary
        uses: actions/download-artifact@v8
        with:
          name: nimbus-bin
          path: target/ci-archive

      - name: Mark nimbus-bin executable
        run: chmod +x target/ci-archive/nimbus

      - name: Set up Node.js 24 for package canaries
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/runtime/node/convex-canaries/package-lock.json
            tests/runtime/node/host-heavy-canaries/package-lock.json
            tests/runtime/node/networking-canaries/package-lock.json
            tests/runtime/node/sdk-canaries/package-lock.json

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Bootstrap canaries
        run: |
          case "${{ matrix.preset }}" in
            application)
              make node-compat-canaries-bootstrap PRESET=application
              ;;
            tooling)
              make node-compat-canaries-bootstrap PRESET=tooling
              ;;
            *)
              echo "unsupported canary preset: ${{ matrix.preset }}" >&2
              exit 2
              ;;
          esac

      - name: Gate canary lane
        run: |
          case "${{ matrix.preset }}:${{ matrix.lane }}" in
            application:node22)
              make node-compat-canaries PRESET=application LANE=node22
              ;;
            application:node24)
              make node-compat-canaries PRESET=application LANE=node24
              ;;
            application:node26)
              make node-compat-canaries PRESET=application LANE=node26
              ;;
            tooling:node22)
              make node-compat-canaries PRESET=tooling LANE=node22
              ;;
            tooling:node24)
              make node-compat-canaries PRESET=tooling LANE=node24
              ;;
            *)
              echo "unsupported canary lane: ${{ matrix.preset }}:${{ matrix.lane }}" >&2
              exit 2
              ;;
          esac

      - name: Upload Node compatibility reports
        uses: actions/upload-artifact@v7
        with:
          name: node-compat-reports-${{ matrix.preset }}-${{ matrix.lane }}
          path: target/node-compat
          if-no-files-found: error
          retention-days: 1

