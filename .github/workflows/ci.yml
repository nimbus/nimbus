name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly security audit — catches newly disclosed CVEs between PRs
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PW3: never cancel main. A cancelled main run aborts the sccache /
  # Swatinem cache-save side effects, leaving the next run cold. PR
  # branches still cancel themselves on rapid pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # CC2: route rustc through sccache on every Rust job. CARGO_INCREMENTAL=0
  # is required by sccache (already set above). Jobs without rustc invocations
  # (rust-format, js, proof-helpers, rust-gate-summary) ignore these vars.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  rust-format:
    name: Rust Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-clippy-no-bin-v2
          toolchain-components: clippy
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # `make clippy` triggers the UI dependency graph (codegen + SPA build)
      # before invoking cargo, so nimbus-convex's generated registry includes
      # and nimbus-assets' SPA embed inputs resolve. Node is therefore a build
      # prerequisite for any Rust target that touches nimbus-server.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run clippy
        run: make clippy

  deny:
    name: Rust Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-deny-no-bin-v2
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-deny@0.19.0

      - name: Run cargo deny
        id: deny
        run: |
          set +e
          cargo deny check 2>&1 | tee /tmp/deny.out
          status=$?
          set -e
          {
            echo "## cargo deny"
            echo
            if [ "${status}" -eq 0 ]; then
              echo "**Status:** :white_check_mark: passed"
            else
              echo "**Status:** :x: failed (exit ${status})"
            fi
            echo
            echo "<details><summary>Output (last 60 lines)</summary>"
            echo
            echo '```'
            tail -n 60 /tmp/deny.out
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Third-party attribution gate (G4)
        id: attribution
        run: |
          set +e
          bash scripts/verify-third-party-attribution.sh 2>&1 | tee /tmp/attribution.out
          status=$?
          set -e
          {
            echo "## third-party attribution gate (G4)"
            echo
            if [ "${status}" -eq 0 ]; then
              echo "**Status:** :white_check_mark: passed"
            else
              echo "**Status:** :x: failed (exit ${status})"
            fi
            echo
            echo "<details><summary>Output</summary>"
            echo
            echo '```'
            cat /tmp/attribution.out
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Third-party attribution gate unit tests
        run: bash scripts/verify-third-party-attribution-helper.sh

  container-pep-egress:
    name: Root-only container PEP egress
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'schedule'
    env:
      NIMBUS_CONTAINER_EGRESS_WORKDIR: /tmp/nimbus-container-egress

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-container-pep-egress-v1
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install OCI and network namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aardvark-dns \
            buildah \
            conmon \
            crun \
            iproute2 \
            netavark \
            nftables \
            uidmap

      - name: Verify host tool versions
        run: |
          set -euxo pipefail
          find_tool() {
            local name="$1"
            shift
            if command -v "${name}" >/dev/null 2>&1; then
              command -v "${name}"
              return 0
            fi
            local candidate
            for candidate in "$@"; do
              if [ -x "${candidate}" ]; then
                printf '%s\n' "${candidate}"
                return 0
              fi
            done
            printf 'missing required tool %s\n' "${name}" >&2
            return 127
          }
          NETAVARK_BIN="$(find_tool netavark /usr/lib/podman/netavark /usr/libexec/podman/netavark)"
          AARDVARK_DNS_BIN="$(find_tool aardvark-dns /usr/lib/podman/aardvark-dns /usr/libexec/podman/aardvark-dns)"
          {
            printf 'NIMBUS_NETAVARK=%s\n' "${NETAVARK_BIN}"
            printf 'NIMBUS_AARDVARK_DNS=%s\n' "${AARDVARK_DNS_BIN}"
          } >> "${GITHUB_ENV}"
          buildah --version
          conmon --version
          crun --version
          "${NETAVARK_BIN}" --version
          "${AARDVARK_DNS_BIN}" --version
          nft --version
          ip -Version
          sudo true
          sudo nft list ruleset >/dev/null

      - name: Run root-only container PEP egress proof
        env:
          NIMBUS_CONTAINER_EGRESS_IMAGE: docker.io/library/busybox:latest
          NIMBUS_CONTAINER_EGRESS_TARGET: http://1.1.1.1
        run: |
          set -o pipefail
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          CARGO_BIN="$(command -v cargo)"
          unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED SCCACHE_PATH
          mkdir -p "${NIMBUS_CONTAINER_EGRESS_WORKDIR}"
          sudo --preserve-env=HOME,PATH,CARGO_HOME,RUSTUP_HOME,CARGO_TERM_COLOR,CARGO_INCREMENTAL,CARGO_PROFILE_DEV_DEBUG,CARGO_PROFILE_TEST_DEBUG,CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS,CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS,OPENSSL_NO_VENDOR,NIMBUS_CONTAINER_EGRESS_WORKDIR,NIMBUS_CONTAINER_EGRESS_IMAGE,NIMBUS_CONTAINER_EGRESS_TARGET,NIMBUS_NETAVARK,NIMBUS_AARDVARK_DNS \
            "${CARGO_BIN}" test -p nimbus-sandbox --test container_linux_egress -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "${RUNNER_TEMP}/container-pep-egress-test.log"

      - name: Prove mounted network namespace removal
        run: |
          set -o pipefail
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          CARGO_BIN="$(command -v cargo)"
          unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED SCCACHE_PATH
          sudo --preserve-env=HOME,PATH,CARGO_HOME,RUSTUP_HOME,CARGO_TERM_COLOR,CARGO_INCREMENTAL,CARGO_PROFILE_DEV_DEBUG,CARGO_PROFILE_TEST_DEBUG,CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS,CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS,OPENSSL_NO_VENDOR \
            "${CARGO_BIN}" test -p nimbus-sandbox --lib nnc6_5d3_k14_mounted_namespace_removal_detaches_nsfs_and_deletes_mount_point -- --ignored --nocapture --test-threads=1

      - name: Collect failure diagnostics
        if: failure()
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/container-pep-egress-diagnostics"
          mkdir -p "${diagnostics}"
          {
            echo "== kernel =="
            uname -a
            echo
            echo "== os-release =="
            cat /etc/os-release
            echo
            echo "== ids =="
            id
            sudo id
            echo
            echo "== tool versions =="
            buildah --version
            conmon --version
            crun --version
            "${NIMBUS_NETAVARK:-netavark}" --version
            "${NIMBUS_AARDVARK_DNS:-aardvark-dns}" --version
            nft --version
            ip -Version
            echo
            echo "== nft ruleset =="
            sudo nft list ruleset
            echo
            echo "== network namespaces =="
            sudo ip netns list
            echo
            echo "== sandbox state path =="
            printf '%s\n' "${NIMBUS_CONTAINER_EGRESS_WORKDIR}"
            find "${NIMBUS_CONTAINER_EGRESS_WORKDIR}" -maxdepth 5 -print
          } > "${diagnostics}/host.txt" 2>&1
          cp "${RUNNER_TEMP}/container-pep-egress-test.log" "${diagnostics}/test.log" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-pep-egress-diagnostics
          path: ${{ runner.temp }}/container-pep-egress-diagnostics
          if-no-files-found: ignore

  rust-runtime-tests:
    name: Rust Runtime Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-runtime-no-bin-v2
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Cache Node22 anchor snapshot
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-off-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Verify prebuilt V8 consumption pairing (release)
        run: bash scripts/ci/verify-prebuilt-v8-consumption.sh release

      - name: Run isolated runtime test lane
        # V8-sensitive runtime tests live in a dedicated serial runtime lane:
        # subprocess isolation protects child cases, while --test-threads=1
        # prevents unignored in-process V8 constructors from overlapping those
        # parents and poisoning process-global cage / RO-heap state. The
        # official Node compatibility corpus is a conformance signal with its
        # own dedicated workflow; keep required runtime tests focused on product
        # runtime behavior and lightweight manifest/unit checks. nimbus-runtime
        # has zero workspace deps (per CLAUDE.md) so this lane intentionally has
        # no Node/UI prerequisites.
        run: make test-rust-runtime

  ptrcomp-check:
    name: Ptrcomp Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    env:
      CARGO_TARGET_DIR: target/ptrcomp-check-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-runtime-ptrcomp-check-no-bin-v1
          consume-prebuilt-v8: ptrcomp
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Verify prebuilt V8 consumption pairing (ptrcomp)
        run: bash scripts/ci/verify-prebuilt-v8-consumption.sh ptrcomp

      - name: Check supported pointer-compression runtime path
        run: |
          env -u V8_FROM_SOURCE cargo check -p nimbus-runtime --lib --features v8-pointer-compression
          cargo tree -p nimbus-runtime --features v8-pointer-compression -e features -i v8 > /tmp/runtime-ptrcomp-tree.txt
          grep -F 'v8 feature "v8_enable_pointer_compression"' /tmp/runtime-ptrcomp-tree.txt
          grep -F 'v8 feature "simdutf"' /tmp/runtime-ptrcomp-tree.txt

  ptrcomp-cage:
    name: Ptrcomp Cage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    env:
      CARGO_TARGET_DIR: target/ptrcomp-cage-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-runtime-ptrcomp-cage-no-bin-v1
          consume-prebuilt-v8: ptrcomp
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Verify prebuilt V8 consumption pairing (ptrcomp)
        run: bash scripts/ci/verify-prebuilt-v8-consumption.sh ptrcomp

      - name: Cache Node22 anchor snapshot (pointer-compression)
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.pc.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-on-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Generate + verify embedded anchor snapshot (pointer-compression)
        # A V8 startup snapshot is platform-specific, so the feature-on (.pc.bin) anchor snapshot the
        # release/cage serving path uses is GENERATED for THIS runner's target (not committed) and
        # self-`--check`ed live. This clean job's shared gn_out/obj/librusty_v8.a is the
        # pointer-compression variant (no interleaved feature-off build to mislink it). Required by the
        # under-cage integration test below.
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-on

      - name: Run cage crash-oracle lane
        # The cross-profile shared-RO-heap crash only reproduces under the single
        # pointer-compression cage, which is exactly how release binaries ship (see
        # scripts/nimbus-release-rust-features.sh). The default feature-off runtime lane
        # cannot exercise it, so this lane runs the subprocess-isolated `isol_*` parents:
        # crash-by-design controls assert the bug still aborts by signal (non-vacuous) and the
        # fix tests assert success, each in its own process. Uses the prebuilt ptrcomp rusty_v8
        # (V8_FROM_SOURCE unset), matching the check above.
        run: env -u V8_FROM_SOURCE make test-rust-runtime-cage

      - name: Verify embedded anchor installs under the cage
        # The cfg(test) cage oracle above CANNOT exercise the EMBEDDED anchor path: under cfg(test)
        # snapshot_extensions adds a test-only extension, so provenance mismatches the committed blob
        # and try_embedded falls back to a runtime build. This integration test links NON-cfg(test)
        # nimbus-runtime, so the anchor installs FROM the committed .pc.bin into the real shared cage
        # — the production serving path. The shipped first-installer guard stays silent (the anchor is
        # the first, superset, installer).
        #
        # `if: !cancelled()` so this runs even when the crash-oracle lane above reports failure: that
        # lane runs the full ptrcomp lib suite, which currently carries a pre-existing failure on main
        # (pool_reuse::*condemns_stalled_wait_until*, identical 67-pass/1-fail on the branch point) that
        # is unrelated to the embedded-anchor path. Gating this step on the whole lane's success would
        # let an inherited red mask the embedded-anchor verification this PR actually owns.
        if: ${{ !cancelled() }}
        run: env -u V8_FROM_SOURCE cargo test -p nimbus-runtime --features v8-pointer-compression --test embedded_anchor

  profile-aware-runtime-crossover:
    name: Profile-Aware Runtime Crossover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-profile-aware-runtime-crossover-no-bin-v1
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Run PIR0/PIR2 crossover smoke benches
        env:
          NIMBUS_PIR_CROSSOVER_SAMPLE_SIZE: "10"
          NIMBUS_PIR_CROSSOVER_MEASUREMENT_TIME: "1"
          NIMBUS_PIR_CROSSOVER_WARM_UP_TIME: "1"
        run: make verify-profile-aware-runtime-crossover

  bun-runtime-contract:
    name: Bun/JSC Runtime Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-bun-runtime-contract-no-bin-v2
          linux-linker: lld
          linux-openssl-provider: system
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # This lane touches nimbus-server runtime diagnostics and the operator UI
      # contract, so it needs the same Node/UI prerequisites as workspace lanes.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run Bun/JSC runtime contract gate
        run: make verify-bun-jsc-runtime-contract

  rust-workspace-tests:
    # B5: Rust Workspace Tests consume the B4 nextest archive instead of
    # compiling. Node-dependent tests run in workspace-run-node below; this
    # matrix is PATH-poisoned for cargo/rustc/rustup/node/npm/npx.
    name: Rust Workspace Tests (shard ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [archive]
    env:
      NIMBUS_DISABLE_IMPLICIT_EXTERNAL_PROVIDER_FIXTURES: "1"
      NODE_DEPENDENT_FILTER: >-
        (package(nimbus-cli) and (test(/dev::tests::adoption::/) or test(/dev::redetect::tests::mid_session_(convex|firebase)_adoption_/) or test(/deploy::typecheck_tests::run_tsc_passes_clean_code_and_fails_on_type_error/) or test(/typeinfo::tests::/) or test(/codegen::tests::external_node_codegen_uses_embedded_tooling_without_app_codegen_package/))) or (package(nimbus-server) and (test(/firebase_sdk_crud_selftest_smoke/) or test(/adapters::cloud_functions::(http|execution)::tests::cloud_functions_.*generated_.*bundle/)))
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: "1/3"
            shard-id: "1"
          - partition: "2/3"
            shard-id: "2"
          - partition: "3/3"
            shard-id: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Download nimbus tests archive
        uses: actions/download-artifact@v8
        with:
          name: nimbus-tests-archive
          path: ${{ runner.temp }}/nimbus-tests-archive

      - name: Download nextest config
        uses: actions/download-artifact@v8
        with:
          name: nextest-config
          path: ${{ runner.temp }}/nextest-config

      - name: Verify and install nextest config
        run: bash scripts/ci/install-nextest-archive-artifacts.sh "$RUNNER_TEMP/nimbus-tests-archive" "$RUNNER_TEMP/nextest-config"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Install PATH poison guard
        run: bash scripts/ci/install-path-poison.sh cargo rustc rustup node npm npx

      - name: Record rerun visibility
        if: github.run_attempt > 1
        continue-on-error: true
        run: bash scripts/ci/append-rerun-visibility.sh "rust-workspace-tests shard ${{ matrix.partition }}"

      - name: Run workspace test lane (shard ${{ matrix.partition }})
        run: |
          cargo-nextest nextest run \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-pr \
            --partition hash:${{ matrix.partition }} \
            -E "not (${NODE_DEPENDENT_FILTER})"

  workspace-run-node:
    name: Rust Workspace Node-Dependent Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [archive]
    env:
      NIMBUS_DISABLE_IMPLICIT_EXTERNAL_PROVIDER_FIXTURES: "1"
      NODE_DEPENDENT_FILTER: >-
        (package(nimbus-cli) and (test(/dev::tests::adoption::/) or test(/dev::redetect::tests::mid_session_(convex|firebase)_adoption_/) or test(/deploy::typecheck_tests::run_tsc_passes_clean_code_and_fails_on_type_error/) or test(/typeinfo::tests::/) or test(/codegen::tests::external_node_codegen_uses_embedded_tooling_without_app_codegen_package/))) or (package(nimbus-server) and (test(/firebase_sdk_crud_selftest_smoke/) or test(/adapters::cloud_functions::(http|execution)::tests::cloud_functions_.*generated_.*bundle/)))

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Download nimbus tests archive
        uses: actions/download-artifact@v8
        with:
          name: nimbus-tests-archive
          path: ${{ runner.temp }}/nimbus-tests-archive

      - name: Download nextest config
        uses: actions/download-artifact@v8
        with:
          name: nextest-config
          path: ${{ runner.temp }}/nextest-config

      - name: Verify and install nextest config
        run: bash scripts/ci/install-nextest-archive-artifacts.sh "$RUNNER_TEMP/nimbus-tests-archive" "$RUNNER_TEMP/nextest-config"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install PATH poison guard
        run: bash scripts/ci/install-path-poison.sh cargo rustc rustup

      - name: Record rerun visibility
        if: github.run_attempt > 1
        continue-on-error: true
        run: bash scripts/ci/append-rerun-visibility.sh "workspace-run-node"

      - name: Assert workspace filter partition
        run: |
          set -euo pipefail
          all_json="${RUNNER_TEMP}/nextest-ci-pr.json"
          node_json="${RUNNER_TEMP}/nextest-node-dependent.json"
          non_node_json="${RUNNER_TEMP}/nextest-non-node-dependent.json"
          cargo-nextest nextest list \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-pr \
            --message-format json > "${all_json}"
          cargo-nextest nextest list \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-pr \
            -E "${NODE_DEPENDENT_FILTER}" \
            --message-format json > "${node_json}"
          cargo-nextest nextest list \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-pr \
            -E "not (${NODE_DEPENDENT_FILTER})" \
            --message-format json > "${non_node_json}"
          python3 - "${all_json}" "${node_json}" "${non_node_json}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          def load_ids(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r"^\{", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"::error::{path} did not contain nextest JSON")
              data = json.loads(text[match.start():])
              ids = set()
              for suite in data.get("rust-suites", {}).values():
                  package = str(suite.get("package-name") or suite.get("package_name") or "")
                  binary = str(suite.get("binary-name") or suite.get("binary_name") or "")
                  for name, case in suite.get("testcases", {}).items():
                      status = case.get("filter-match", {}).get("status")
                      if not case.get("ignored", False) and status in (None, "matches"):
                          ids.add(f"{package}::{binary}::{name}")
              return ids

          all_ids = load_ids(sys.argv[1])
          node_ids = load_ids(sys.argv[2])
          non_node_ids = load_ids(sys.argv[3])
          overlap = sorted(node_ids & non_node_ids)
          missing = sorted(all_ids - (node_ids | non_node_ids))
          extra = sorted((node_ids | non_node_ids) - all_ids)
          if not node_ids:
              print("::error::node-dependent filter selected zero ci-pr tests")
              sys.exit(1)
          if overlap or missing or extra:
              print("::error::workspace node/non-node filters do not partition the ci-pr archive universe")
              print(f"all={len(all_ids)} node={len(node_ids)} non_node={len(non_node_ids)}")
              for label, rows in (("overlap", overlap), ("missing", missing), ("extra", extra)):
                  if rows:
                      print(f"{label} ({len(rows)}):")
                      for row in rows[:200]:
                          print(row)
                      if len(rows) > 200:
                          print(f"... and {len(rows) - 200} more")
              sys.exit(1)
          print(f"workspace filter partition ok: all={len(all_ids)} node={len(node_ids)} non_node={len(non_node_ids)}")
          PY

      - name: Run node-dependent workspace tests
        run: |
          cargo-nextest nextest run \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-pr \
            -E "${NODE_DEPENDENT_FILTER}"

  archive:
    name: Rust Test Archive
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    needs: [ui-artifacts]
    env:
      NIMBUS_DISABLE_IMPLICIT_EXTERNAL_PROVIDER_FIXTURES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk for archive build
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-archive-no-bin-v1
          linux-linker: lld
          linux-openssl-provider: system
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Install cargo-hakari
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-hakari@0.9.38
          fallback: cargo-install

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Download ui-artifacts timing
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ci-timings-ui-artifacts
          path: ${{ runner.temp }}/ci-timings-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Cache Node22 anchor snapshot
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-off-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Generate + verify embedded anchor snapshot
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-off

      - name: Run taxonomy check before archive
        run: python3 scripts/test-taxonomy.py check

      - name: Check workspace-hack drift
        run: cargo hakari generate --diff

      # CALIBRATED 2026-07-05 (run 28739808188): the pre-B10 archive job consumed
      # 30 GiB from its post-reclaim baseline (108G -> 78G free). B10 moves the
      # standalone nimbus-bin build into nimbus-bin-build, so these floors are
      # conservative for the archive-only path until the next frontier run
      # recalibrates them.
      - name: Enforce disk budget before archive compile
        run: bash scripts/ci/disk-guard.sh enforce --label before-archive-compile --min-free-gib 45

      - name: Build nextest archive
        run: |
          set -euo pipefail
          mkdir -p target/ci-timings
          start_ms="$(date +%s%3N)"
          cargo nextest archive --workspace --exclude nimbus-runtime --locked --cargo-profile ci-archive --archive-file "$RUNNER_TEMP/nimbus-tests.tar.zst"
          end_ms="$(date +%s%3N)"
          python3 - "$start_ms" "$end_ms" <<'PY'
          import json
          import sys
          from pathlib import Path

          start_ms = int(sys.argv[1])
          end_ms = int(sys.argv[2])
          Path("target/ci-timings").mkdir(parents=True, exist_ok=True)
          Path("target/ci-timings/archive-compile-pack.json").write_text(
              json.dumps(
                  {
                      "name": "archive-compile-pack",
                      "wall_seconds": round((end_ms - start_ms) / 1000, 3),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce disk budget after archive
        if: always()
        run: bash scripts/ci/disk-guard.sh enforce --label after-archive --min-free-gib 20

      - name: Check archive size cap
        run: |
          archive="$RUNNER_TEMP/nimbus-tests.tar.zst"
          size_bytes="$(stat -c%s "$archive")"
          warn_bytes=$((6 * 1024 * 1024 * 1024))
          fail_bytes=$((9 * 1024 * 1024 * 1024))
          size_gib="$(awk -v bytes="$size_bytes" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "archive-size=${size_gib} GiB (${size_bytes} bytes)"
          if [ "$size_bytes" -gt "$fail_bytes" ]; then
            echo "::error::nimbus-tests archive is ${size_gib} GiB, above the 9 GiB hard cap"
            exit 1
          fi
          if [ "$size_bytes" -gt "$warn_bytes" ]; then
            echo "::warning::nimbus-tests archive is ${size_gib} GiB, above the 6 GiB warning cap"
          fi

      - name: Package deno source checkout for consumers
        # Deno's extension macros bake ABSOLUTE builder paths for lazy-loaded
        # JS (env!(CARGO_MANIFEST_DIR) inside ~/.cargo/git/checkouts/deno-*),
        # so archived binaries read those sources at JsRuntime construction.
        # Ship the checkout INSIDE the tests archive artifact so toolchain-free
        # consumers restore it at the exact baked path (same-run provenance;
        # no cross-run cache surface). Fork-plane follow-up tracked in the
        # owning plan: embed lazy JS in the deno fork and drop this.
        run: |
          set -euo pipefail
          ext_dir="$(find "$HOME/.cargo/git/checkouts" -maxdepth 3 -type d -path '*deno-*/*/ext' | head -1)"
          checkout_dir="$(dirname "${ext_dir}")"
          parent="$(dirname "${checkout_dir}")"
          rel="$(basename "${parent}")/$(basename "${checkout_dir}")"
          test -f "${checkout_dir}/ext/telemetry/telemetry.ts"
          # Only JS/TS/JSON sources under ext/ and libs/ are read at runtime
          # (~7 MiB) — never ship the full multi-GB checkout.
          (
            cd "$HOME/.cargo/git/checkouts"
            find "${rel}/ext" "${rel}/libs" -type f \
              \( -name '*.ts' -o -name '*.js' -o -name '*.mjs' -o -name '*.json' \) \
              | tar -czf "$RUNNER_TEMP/deno-src-checkout.tgz" -T -
          )
          sha256sum "$RUNNER_TEMP/deno-src-checkout.tgz" | awk '{print $1"  deno-src-checkout.tgz"}' > "$RUNNER_TEMP/deno-src-checkout.tgz.sha256"
          ls -lh "$RUNNER_TEMP/deno-src-checkout.tgz"

      - name: Prepare nextest config artifact
        run: sha256sum .config/nextest.toml > .config/nextest.toml.sha256

      - name: Generate canonical nextest inventory
        run: |
          mkdir -p target/test-inventory
          cargo nextest list --workspace --exclude nimbus-runtime --run-ignored all --locked --cargo-profile ci-archive --message-format json > target/test-inventory/nextest-list.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          meta = {
              "platform": "x86_64-unknown-linux-gnu",
              "nextest_version": "0.9.138",
              "command": "cargo nextest list --workspace --exclude nimbus-runtime --run-ignored all --locked --cargo-profile ci-archive --message-format json",
              "git_rev": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          Path("target/test-inventory/nextest-list.meta.json").write_text(
              json.dumps(meta, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run taxonomy check with canonical inventory
        run: python3 scripts/test-taxonomy.py check

      - name: Check archive test universe
        run: |
          cargo nextest list --archive-file "$RUNNER_TEMP/nimbus-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --run-ignored all --message-format json > target/test-inventory/nextest-archive-list.json
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          def load_json(path: str) -> dict:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r"^\{", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"{path} does not contain a JSON object")
              return json.loads(text[match.start():])

          def test_ids(data: dict) -> set[str]:
              ids: set[str] = set()
              for suite in data.get("rust-suites", {}).values():
                  package = str(suite.get("package-name") or suite.get("package_name") or "")
                  if package == "nimbus-runtime":
                      continue
                  binary = str(suite.get("binary-name") or suite.get("binary_name") or "")
                  # Ignored tests are INCLUDED in the universe identity: an
                  # ignored-only suite (e.g. nimbus-kv spawn_harness) vanishing
                  # from the archive must trip this gate too (review finding).
                  for name, case in suite.get("testcases", {}).items():
                      ids.add(f"{package}::{binary}::{name}")
              return ids

          inventory = test_ids(load_json("target/test-inventory/nextest-list.json"))
          archive = test_ids(load_json("target/test-inventory/nextest-archive-list.json"))
          missing = sorted(inventory - archive)
          if missing:
              print(f"::error::archive universe shrinkage: {len(missing)} inventory tests (incl. ignored) are missing from the archive")
              for test_id in missing[:200]:
                  print(f"missing: {test_id}")
              if len(missing) > 200:
                  print(f"... and {len(missing) - 200} more")
              sys.exit(1)
          print(f"archive universe ok: {len(inventory)} non-runtime tests present (ignored included)")
          PY

      - name: Record archive upload start
        run: date +%s%3N > "$RUNNER_TEMP/archive-upload-start-ms"

      - name: Upload nimbus tests archive
        uses: actions/upload-artifact@v7
        with:
          name: nimbus-tests-archive
          path: |
            ${{ runner.temp }}/nimbus-tests.tar.zst
            ${{ runner.temp }}/deno-src-checkout.tgz
            ${{ runner.temp }}/deno-src-checkout.tgz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Record archive upload timing
        run: |
          set -euo pipefail
          start_ms="$(cat "$RUNNER_TEMP/archive-upload-start-ms")"
          end_ms="$(date +%s%3N)"
          mkdir -p target/ci-timings
          python3 - "$start_ms" "$end_ms" <<'PY'
          import json
          import sys
          from pathlib import Path

          start_ms = int(sys.argv[1])
          end_ms = int(sys.argv[2])
          Path("target/ci-timings/archive-upload.json").write_text(
              json.dumps(
                  {
                      "name": "archive-upload",
                      "wall_seconds": round((end_ms - start_ms) / 1000, 3),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Append archive frontier summary
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          coverage_file="${RUNNER_TEMP}/test-taxonomy-coverage.txt"
          ci_pr_json="${RUNNER_TEMP}/nextest-ci-pr-list.json"
          ci_nightly_json="${RUNNER_TEMP}/nextest-ci-nightly-list.json"
          python3 scripts/test-taxonomy.py coverage-report > "${coverage_file}"
          cargo nextest list \
            --archive-file "$RUNNER_TEMP/nimbus-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci-pr \
            --message-format json > "${ci_pr_json}"
          cargo nextest list \
            --archive-file "$RUNNER_TEMP/nimbus-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci-nightly \
            --message-format json > "${ci_nightly_json}"
          python3 - "${coverage_file}" "${ci_pr_json}" "${ci_nightly_json}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          coverage_path = Path(sys.argv[1])
          ci_pr_path = Path(sys.argv[2])
          ci_nightly_path = Path(sys.argv[3])

          def load_timing(path: Path) -> float | None:
              if not path.is_file():
                  return None
              return float(json.loads(path.read_text(encoding="utf-8"))["wall_seconds"])

          def find_timing(root: Path, name: str) -> float | None:
              if not root.exists():
                  return None
              for path in root.rglob(name):
                  value = load_timing(path)
                  if value is not None:
                      return value
              return None

          def load_nextest(path: Path) -> dict:
              text = path.read_text(encoding="utf-8")
              match = re.search(r"^\{", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"{path} did not contain nextest JSON")
              return json.loads(text[match.start():])

          def count_selected(data: dict) -> int:
              count = 0
              for suite in data.get("rust-suites", {}).values():
                  for case in suite.get("testcases", {}).values():
                      status = case.get("filter-match", {}).get("status")
                      if not case.get("ignored", False) and status in (None, "matches"):
                          count += 1
              return count

          def fmt(value: float | None, pending: str) -> str:
              return f"{value:.3f}s" if value is not None else f"PENDING({pending})"

          ui = find_timing(Path(os.environ["RUNNER_TEMP"]) / "ci-timings-ui", "ui-artifacts.json")
          archive = load_timing(Path("target/ci-timings/archive-compile-pack.json"))
          upload = load_timing(Path("target/ci-timings/archive-upload.json"))
          archive_wall = ui + archive + upload if ui is not None else None
          local_archive_wall = archive + upload
          ci_pr = count_selected(load_nextest(ci_pr_path))
          ci_nightly = count_selected(load_nextest(ci_nightly_path))
          ratio = (ci_pr / ci_nightly * 100.0) if ci_nightly else 0.0

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Test frontier\n\n")
              summary.write(
                  "CI-TIMING "
                  f"js_prebuild={fmt(ui, 'ui-artifacts timing artifact')} "
                  f"archive_compile_pack={archive:.3f}s "
                  f"archive_upload={upload:.3f}s\n"
              )
              summary.write(
                  "FLOOR "
                  f"archive_wall={fmt(archive_wall, 'ui-artifacts timing artifact')} "
                  f"archive_job_local={local_archive_wall:.3f}s "
                  "shard_download_extract_run=PENDING(shard-scaling-probe) "
                  "floor=PENDING(shard-scaling-probe) "
                  "gap=PENDING(shard-scaling-probe)\n"
              )
              summary.write(
                  f"COVERAGE ci-pr={ci_pr} ci-nightly={ci_nightly} "
                  f"ratio={ratio:.2f}%\n\n"
              )
              summary.write("<details><summary>test-taxonomy coverage-report</summary>\n\n")
              summary.write("```text\n")
              summary.write(coverage_path.read_text(encoding="utf-8"))
              summary.write("```\n\n</details>\n")
          PY

      - name: Upload nextest config
        uses: actions/upload-artifact@v7
        with:
          name: nextest-config
          path: |
            .config/nextest.toml
            .config/nextest.toml.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload nextest inventory
        uses: actions/upload-artifact@v7
        with:
          name: nextest-inventory
          path: |
            target/test-inventory/nextest-list.json
            target/test-inventory/nextest-list.meta.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload disk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disk-report
          path: target/disk-report.json
          if-no-files-found: error
          retention-days: 1

  nimbus-bin-build:
    name: Nimbus Bin Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk for nimbus-bin build
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-nimbus-bin-no-bin-v1
          linux-linker: lld
          linux-openssl-provider: system
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Cache Node22 anchor snapshot
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-off-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Generate + verify embedded anchor snapshot
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-off

      - name: Enforce disk budget before nimbus-bin build
        run: bash scripts/ci/disk-guard.sh enforce --label before-nimbus-bin-build --min-free-gib 45

      - name: Build nimbus-bin with archive profile
        run: cargo build -p nimbus-bin --profile ci-archive --locked

      - name: Enforce disk budget after nimbus-bin build
        if: always()
        run: bash scripts/ci/disk-guard.sh enforce --label after-nimbus-bin --min-free-gib 20

      - name: Upload nimbus-bin binary
        uses: actions/upload-artifact@v7
        with:
          name: nimbus-bin
          path: target/ci-archive/nimbus
          if-no-files-found: error
          retention-days: 1

      - name: Upload nimbus-bin disk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disk-report-nimbus-bin
          path: target/disk-report.json
          if-no-files-found: error
          retention-days: 1

  workspace-run-nightly:
    name: Nightly Rust Workspace Tests (shard ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'schedule'
    needs: [archive]
    env:
      NIMBUS_DISABLE_IMPLICIT_EXTERNAL_PROVIDER_FIXTURES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: "1/2"
            shard-id: "1"
          - partition: "2/2"
            shard-id: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Download nimbus tests archive
        uses: actions/download-artifact@v8
        with:
          name: nimbus-tests-archive
          path: ${{ runner.temp }}/nimbus-tests-archive

      - name: Download nextest config
        uses: actions/download-artifact@v8
        with:
          name: nextest-config
          path: ${{ runner.temp }}/nextest-config

      - name: Verify and install nextest config
        run: bash scripts/ci/install-nextest-archive-artifacts.sh "$RUNNER_TEMP/nimbus-tests-archive" "$RUNNER_TEMP/nextest-config"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install PATH poison guard
        run: bash scripts/ci/install-path-poison.sh cargo rustc rustup

      - name: Run nightly workspace test lane (shard ${{ matrix.partition }})
        id: run-nightly
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          set -o pipefail
          log_file="${RUNNER_TEMP}/nextest-nightly-${{ matrix.shard-id }}.log"
          : > "${log_file}"
          cargo-nextest nextest run \
            --archive-file "${NIMBUS_TESTS_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}" \
            --profile ci-nightly \
            --partition hash:${{ matrix.partition }} \
            --message-format libtest-json-plus 2>&1 | tee "${log_file}"

      # A9/F13 disposition for every FLAKY-DETECTED line is a flaky-quarantine
      # ledger row with owner, issue, and expiry; scripts/test-taxonomy.py check
      # enforces expiry on flaky-quarantine rows.
      - name: Detect nextest flaky retries
        if: always() && steps.run-nightly.outcome != 'skipped'
        run: python3 scripts/ci/detect-nextest-flakes.py "target/nextest/ci-nightly/junit.xml" "**/nextest/ci-nightly/junit.xml"

