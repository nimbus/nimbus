          PTRCOMP_CAGE_RESULT: ${{ needs['ptrcomp-cage'].result }}
          BUN_RUNTIME_CONTRACT_RESULT: ${{ needs['bun-runtime-contract'].result }}
          WORKSPACE_TEST_RESULT: ${{ needs['rust-workspace-tests'].result }}
          WORKSPACE_NODE_RESULT: ${{ needs['workspace-run-node'].result }}
          ARCHIVE_RESULT: ${{ needs['archive'].result }}
          NIMBUS_BIN_BUILD_RESULT: ${{ needs['nimbus-bin-build'].result }}
          DOCTEST_RESULT: ${{ needs['doctests'].result }}
          EXTERNAL_PROVIDER_TEST_RESULT: ${{ needs['external-provider-tests'].result }}
          ELLE_SERIALIZABILITY_RESULT: ${{ needs['elle-serializability'].result }}
          PPSC_SEED_FARM_RESULT: ${{ needs['ppsc-seed-farm'].result }}
          NODE_FAAS_METADATA_RESULT: ${{ needs['node-faas-compatibility-metadata'].result }}
          NODE_FAAS_CANARIES_RESULT: ${{ needs['node-faas-canaries'].result }}
          NODE_FAAS_ORACLES_RESULT: ${{ needs['node-faas-oracles'].result }}
          NODE_FAAS_COMPATIBILITY_RESULT: ${{ needs['node-faas-compatibility'].result }}
          NODE_DBUS_RESULT: ${{ needs['node-dbus-integration'].result }}
        run: |
          printf 'format=%s\n' "${FORMAT_RESULT}"
          printf 'clippy=%s\n' "${CLIPPY_RESULT}"
          printf 'dependency-audit=%s\n' "${DEPENDENCY_AUDIT_RESULT}"
          printf 'runtime-test=%s\n' "${RUNTIME_TEST_RESULT}"
          printf 'ptrcomp-check=%s\n' "${PTRCOMP_CHECK_RESULT}"
          printf 'ptrcomp-cage=%s\n' "${PTRCOMP_CAGE_RESULT}"
          printf 'bun-runtime-contract=%s\n' "${BUN_RUNTIME_CONTRACT_RESULT}"
          printf 'workspace-test=%s\n' "${WORKSPACE_TEST_RESULT}"
          printf 'workspace-node=%s\n' "${WORKSPACE_NODE_RESULT}"
          printf 'archive=%s\n' "${ARCHIVE_RESULT}"
          printf 'nimbus-bin-build=%s\n' "${NIMBUS_BIN_BUILD_RESULT}"
          printf 'doctests=%s\n' "${DOCTEST_RESULT}"
          printf 'external-provider-test=%s\n' "${EXTERNAL_PROVIDER_TEST_RESULT}"
          printf 'elle-serializability=%s\n' "${ELLE_SERIALIZABILITY_RESULT}"
          printf 'ppsc-seed-farm=%s\n' "${PPSC_SEED_FARM_RESULT}"
          printf 'node-faas-compatibility-metadata=%s\n' "${NODE_FAAS_METADATA_RESULT}"
          printf 'node-faas-canaries=%s\n' "${NODE_FAAS_CANARIES_RESULT}"
          printf 'node-faas-oracles=%s\n' "${NODE_FAAS_ORACLES_RESULT}"
          printf 'node-faas-compatibility=%s\n' "${NODE_FAAS_COMPATIBILITY_RESULT}"
          printf 'node-dbus-integration=%s\n' "${NODE_DBUS_RESULT}"
          icon() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":no_entry:" ;;
              skipped) echo ":fast_forward:" ;;
              *) echo ":question:" ;;
            esac
          }
          {
            echo "## Rust gate"
            echo
            echo "| lane | result |"
            echo "|---|---|"
            echo "| rust-format | $(icon "${FORMAT_RESULT}") ${FORMAT_RESULT} |"
            echo "| rust-clippy | $(icon "${CLIPPY_RESULT}") ${CLIPPY_RESULT} |"
            echo "| deny | $(icon "${DEPENDENCY_AUDIT_RESULT}") ${DEPENDENCY_AUDIT_RESULT} |"
            echo "| rust-runtime-tests | $(icon "${RUNTIME_TEST_RESULT}") ${RUNTIME_TEST_RESULT} |"
            echo "| ptrcomp-check | $(icon "${PTRCOMP_CHECK_RESULT}") ${PTRCOMP_CHECK_RESULT} |"
            echo "| ptrcomp-cage | $(icon "${PTRCOMP_CAGE_RESULT}") ${PTRCOMP_CAGE_RESULT} |"
            echo "| bun-runtime-contract | $(icon "${BUN_RUNTIME_CONTRACT_RESULT}") ${BUN_RUNTIME_CONTRACT_RESULT} |"
            echo "| rust-workspace-tests | $(icon "${WORKSPACE_TEST_RESULT}") ${WORKSPACE_TEST_RESULT} |"
            echo "| workspace-run-node | $(icon "${WORKSPACE_NODE_RESULT}") ${WORKSPACE_NODE_RESULT} |"
            echo "| archive | $(icon "${ARCHIVE_RESULT}") ${ARCHIVE_RESULT} |"
            echo "| nimbus-bin-build | $(icon "${NIMBUS_BIN_BUILD_RESULT}") ${NIMBUS_BIN_BUILD_RESULT} |"
            echo "| doctests | $(icon "${DOCTEST_RESULT}") ${DOCTEST_RESULT} |"
            echo "| external-provider-tests | $(icon "${EXTERNAL_PROVIDER_TEST_RESULT}") ${EXTERNAL_PROVIDER_TEST_RESULT} |"
            echo "| elle-serializability | $(icon "${ELLE_SERIALIZABILITY_RESULT}") ${ELLE_SERIALIZABILITY_RESULT} |"
            echo "| ppsc-seed-farm | $(icon "${PPSC_SEED_FARM_RESULT}") ${PPSC_SEED_FARM_RESULT} |"
            echo "| node-faas-compatibility-metadata | $(icon "${NODE_FAAS_METADATA_RESULT}") ${NODE_FAAS_METADATA_RESULT} |"
            echo "| node-faas-canaries | $(icon "${NODE_FAAS_CANARIES_RESULT}") ${NODE_FAAS_CANARIES_RESULT} |"
            echo "| node-faas-oracles | $(icon "${NODE_FAAS_ORACLES_RESULT}") ${NODE_FAAS_ORACLES_RESULT} |"
            echo "| node-faas-compatibility | $(icon "${NODE_FAAS_COMPATIBILITY_RESULT}") ${NODE_FAAS_COMPATIBILITY_RESULT} |"
            echo "| node-dbus-integration | $(icon "${NODE_DBUS_RESULT}") ${NODE_DBUS_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${FORMAT_RESULT}" = success
          test "${CLIPPY_RESULT}" = success
          test "${DEPENDENCY_AUDIT_RESULT}" = success
          test "${RUNTIME_TEST_RESULT}" = success
          test "${PTRCOMP_CHECK_RESULT}" = success
          test "${PTRCOMP_CAGE_RESULT}" = success
          test "${BUN_RUNTIME_CONTRACT_RESULT}" = success
          test "${WORKSPACE_TEST_RESULT}" = success
          test "${WORKSPACE_NODE_RESULT}" = success
          test "${ARCHIVE_RESULT}" = success
          test "${NIMBUS_BIN_BUILD_RESULT}" = success
          test "${DOCTEST_RESULT}" = success
          test "${EXTERNAL_PROVIDER_TEST_RESULT}" = success
          test "${ELLE_SERIALIZABILITY_RESULT}" = success
          test "${PPSC_SEED_FARM_RESULT}" = success
          test "${NODE_FAAS_METADATA_RESULT}" = success
          test "${NODE_FAAS_CANARIES_RESULT}" = success
          test "${NODE_FAAS_ORACLES_RESULT}" = success
          test "${NODE_FAAS_COMPATIBILITY_RESULT}" = success
          test "${NODE_DBUS_RESULT}" = success

  ui-artifacts:
    # CC4: leader job that builds the nimbus-ui artifacts (convex codegen +
    # SPA dist) once per push. Downstream Rust jobs that compile nimbus-server
    # consume the result via actions/download-artifact instead of running
    # npm ci + make build-ui themselves.
    name: UI Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record ui-artifacts start
        run: date +%s%3N > "$RUNNER_TEMP/ui-artifacts-start-ms"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Stage embedded JS package payloads
        # The embedded package tree is gitignored and required at compile time
        # by nimbus-assets' rust-embed. Stage it here so warm-sccache (which has no
        # Node toolchain) can consume it as an artifact, mirroring coverage.yml.
        run: make build-packages

      - name: Record ui-artifacts timing
        run: |
          set -euo pipefail
          start_ms="$(cat "$RUNNER_TEMP/ui-artifacts-start-ms")"
          end_ms="$(date +%s%3N)"
          mkdir -p target/ci-timings
          python3 - "$start_ms" "$end_ms" <<'PY'
          import json
          import sys
          from pathlib import Path

          start_ms = int(sys.argv[1])
          end_ms = int(sys.argv[2])
          Path("target/ci-timings/ui-artifacts.json").write_text(
              json.dumps(
                  {
                      "name": "ui-artifacts",
                      "wall_seconds": round((end_ms - start_ms) / 1000, 3),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload nimbus-ui artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts
          path: |
            packages/nimbus-ui/.nimbus/convex
            packages/nimbus-ui/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload embedded-packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages
          if-no-files-found: error
          retention-days: 1

      - name: Upload ui-artifacts timing
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-ui-artifacts
          path: target/ci-timings/ui-artifacts.json
          if-no-files-found: error
          retention-days: 1

  warm-sccache:
    # PW4c: retained. Swatinem rust-cache hit rate is uneven across jobs
    # (libsql external-provider shard shows 0% sccache (Rust) on CW5 while
    # storage harness shows 77%), so retiring warm-sccache would expose
    # the consistently-cold lanes to full cold-compile cost on every PR.
    # See docs/private/plans/proof/ci-pr-wall-sub-15/pw4c-warm-sccache-retained.md
    # for the measurement and the deferred cache-invalidation investigation.
    # CC5: warm the per-rustc-call sccache before downstream parallel Rust
    # jobs fan out. `cargo check --workspace` rustc's every workspace
    # crate and its lib/bin dep graph once, populating sccache so
    # concurrent downstream jobs hit instead of all cold-compiling
    # identical deps in parallel. CW4 dropped `--tests` from this command:
    # the test-binary rustc invocations had marginal sccache reuse benefit
    # downstream (each integration test bin is its own rustc call) while
    # adding minutes to the wall-pole warm pass. Test-bin compile is now
    # paid inline in the downstream test jobs (harness shards, coverage
    # shards), which were already sharded by CW1 and CA3 respectively.
    # The job consumes ui-artifacts because nimbus-convex's generated registry
    # includes and nimbus-assets' SPA embed inputs must be present for the
    # workspace to type-check.
    name: Warm sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    needs: [ui-artifacts]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-warm-sccache-no-bin-v2
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      - name: Warm sccache via workspace check
        run: cargo check --workspace

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  harness:
    name: ${{ matrix.surface-label }} Verification Harness${{ matrix.shard-label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [archive]
    strategy:
      fail-fast: false
      # CW1: server + engine surfaces are sharded across the harness corpus
      # via NIMBUS_HARNESS_SHARD=N/M. Server has 7 transport-liveness cases
      # so sharding into 4 lanes drops the post-CW0 pole; engine + storage
      # generated-history corpora have 2 cases so we cap at 2 shards there
      # (storage stays unsharded because its 8.3m duration is already well
      # below the wall pole). Runtime remains on the compile lane until B6.
      matrix:
        include:
          - surface: storage
            surface-label: Storage
            shard: ""
            shard-label: ""
          - surface: engine
            surface-label: Engine
            shard: "1/2"
            shard-label: " (shard 1/2)"
          - surface: engine
            surface-label: Engine
            shard: "2/2"
            shard-label: " (shard 2/2)"
          - surface: server
            surface-label: Server
            shard: "1/4"
            shard-label: " (shard 1/4)"
          - surface: server
            surface-label: Server
            shard: "2/4"
            shard-label: " (shard 2/4)"
          - surface: server
            surface-label: Server
            shard: "3/4"
            shard-label: " (shard 3/4)"
          - surface: server
            surface-label: Server
            shard: "4/4"
            shard-label: " (shard 4/4)"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download nimbus tests archive
        uses: actions/download-artifact@v8
        with:
          name: nimbus-tests-archive
          path: ${{ runner.temp }}/nimbus-tests-archive

      - name: Download nextest config
        uses: actions/download-artifact@v8
        with:
          name: nextest-config
          path: ${{ runner.temp }}/nextest-config

      - name: Verify and install nextest config
        run: bash scripts/ci/install-nextest-archive-artifacts.sh "$RUNNER_TEMP/nimbus-tests-archive" "$RUNNER_TEMP/nextest-config"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Install PATH poison guard
        run: bash scripts/ci/install-path-poison.sh cargo rustc rustup node npm npx

      - name: Run required verification harness corpus
        run: NIMBUS_HARNESS_ARCHIVE_FILE="${NIMBUS_TESTS_ARCHIVE}" bash scripts/verification-harness.sh required ${{ matrix.surface }} ${{ matrix.shard }}

  harness-runtime:
    name: Runtime Verification Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    needs: [ui-artifacts, warm-sccache]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-harness-runtime-no-bin-v2
          toolchain-components: llvm-tools-preview
          linux-linker: lld
          linux-openssl-provider: system
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # CC4: nimbus-ui artifacts (convex codegen + SPA dist) are produced by
      # the ui-artifacts leader job and consumed here. Touching the files
      # bumps their mtimes above the freshly-cloned source tree so the
      # Makefile's UI_DIST_INDEX target stays satisfied and no rebuild
      # happens transitively.
      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Cache Node22 anchor snapshot
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-off-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Generate embedded anchor snapshot
        # The harness exercises the production Convex serving path, where the NodeFull
        # anchor installs from the embedded blob (release.yml gens it per target). The
        # committed blob is a gitignored empty placeholder, so without this the harness
        # runs the ~4.18s LAZY anchor build, which blows the 3s seeded-action timeout at
        # convex demo step 0 (e.g. smoke-storage-baseline-31 on the convex demo surface).
        # Generate the feature-off blob for THIS runner's target so the harness uses the
        # ~19ms embedded deserialize, matching the workspace-tests and release lanes.
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-off

      - name: Run required verification harness corpus
        run: bash scripts/verification-harness.sh required runtime

  harness-nightly:
    name: Nightly ${{ matrix.surface-label }} Verification Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: storage
            surface-label: Storage
          - surface: engine
            surface-label: Engine
          - surface: server
            surface-label: Server
          - surface: runtime
            surface-label: Runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust with cache
        id: setup-rust
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: ci-ubuntu-stable-harness-nightly-${{ matrix.surface }}-no-bin-v2
          consume-prebuilt-v8: release
          github-token: ${{ github.token }}
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      # `make build-ui` runs codegen + SPA build via the Makefile dependency
      # graph so the nimbus-server crate compiles regardless of matrix surface.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Cache Node22 anchor snapshot
        uses: actions/cache@v5
        with:
          path: crates/nimbus-runtime/src/backends/v8/node22_anchor_snapshot.bin
          key: node22-anchor-snapshot-${{ steps.setup-rust.outputs.rust-target }}-pc-off-${{ steps.setup-rust.outputs.rusty-v8-tag }}-${{ steps.setup-rust.outputs.deno-tag }}-${{ hashFiles('crates/nimbus-runtime/src/runtime/bootstrap/**', 'crates/nimbus-runtime/src/bin/build_node22_anchor_snapshot.rs', 'crates/nimbus-runtime/build.rs', 'crates/nimbus-runtime/src/backends/v8/*.rs') }}

      - name: Generate embedded anchor snapshot
        # Match the production Convex serving path: without the embedded blob the
        # harness runs the ~4.18s lazy NodeFull anchor build, blowing the 3s
        # seeded-action timeout. See the required-harness lane above.
        run: env -u V8_FROM_SOURCE make build-node22-anchor-snapshot-off

      - name: Run nightly verification harness corpus
        run: bash scripts/verification-harness.sh nightly ${{ matrix.surface }}

  js:
    name: JavaScript Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Stage embedded packages
        run: node scripts/stage-embedded-packages.mjs

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Capability boundary lint
        run: npm run lint:capability-boundary

      - name: Test
        run: npm run test --workspaces --if-present

  examples-verify:
    name: Examples Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    needs: [nimbus-bin-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download nimbus-bin binary
        uses: actions/download-artifact@v8
        with:
          name: nimbus-bin
          path: target/ci-archive

      - name: Mark nimbus-bin executable
        run: chmod +x target/ci-archive/nimbus

      # nimbus-bin-build's ci-archive profile inherits from `dev`, so
      # nimbus-assets' rust-embed compiles with debug-assertions on and reads
      # embedded/packages/manifest.json from disk at runtime instead of baking
      # it into the binary (rust-embed only embeds bytes at compile time under
      # release-style, non-debug-assertions builds). Every other job that
      # boots this binary already re-stages the payload for that reason; this
      # job needs the same step so app-dir preflight (agent-chat, convex,
      # firebase, cloud-functions) can find the manifest instead of panicking
      # at crates/nimbus-assets/src/js_packages.rs:84.
      - name: Download embedded package payload
        uses: actions/download-artifact@v8
        with:
          name: embedded-packages
          path: crates/nimbus-assets/embedded/packages

      - name: Refresh embedded package payload mtimes
        run: find crates/nimbus-assets/embedded/packages -exec touch {} +

      # Same rust-embed debug-assertions gap as above, for the OTHER folder
      # embed in nimbus-assets: `UiAssets` in crates/nimbus-assets/src/ui.rs
      # reads $CARGO_MANIFEST_DIR/../../packages/nimbus-ui/dist/ from disk at
      # runtime under ci-archive. Unlike the manifest.json case this doesn't
      # panic — nimbus-server's `spa_index_response` falls back to a bootstrap
      # placeholder HTML page when the embed is empty (crates/nimbus-server/
      # src/http/ui.rs) — but any example that exercises `/ui` or the console
      # routes would silently get the placeholder instead of the real SPA
      # instead of a genuine smoke result. Stage it the same way
      # nimbus-bin-build and node-dbus-integration already do.
      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      # The Node22 anchor snapshot blob itself needs no staging (it's
      # `include_bytes!`'d into nimbus-bin unconditionally at compile time —
      # unlike rust-embed above, that macro doesn't care about
      # debug-assertions). But every deno extension's js/esm source file is
      # declared via `ExtensionFileSource::loaded_during_snapshot(...)`, which
      # bakes in an ABSOLUTE path under the ORIGINAL builder's
      # `$CARGO_HOME/git/checkouts/deno-*` vendored checkout
      # (`concat!(env!("CARGO_MANIFEST_DIR"), ...)`, resolved on
      # nimbus-bin-build's runner). nimbus-runtime re-reads those same files
      # from disk at RUNTIME — both to confirm the embedded snapshot's
      # provenance is still current (`embedded_node22_snapshot_provenance` in
      # crates/nimbus-runtime/src/backends/v8/startup.rs) and, if that check
      # can't complete, in deno_core's own no-snapshot JsRuntime fallback — so
      # any app-dir example that boots a JsRuntime (e.g. agent-chat; tasks
      # never does, so it's unaffected) panics here with "Failed to
      # initialize a JsRuntime: No such file or directory", since this job
      # runs no Rust toolchain and so never populates that checkout.
      # `cargo fetch --locked` reproduces the same checkout tree
      # byte-for-byte: Cargo's checkout directory name is a pure hash of the
      # pinned git source URL + resolved commit, not machine-specific, so it
      # lands at the exact absolute path baked into the binary. No
      # compilation happens (`cargo fetch` never runs build scripts), so this
      # stays cheap relative to nimbus-bin-build's real build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache vendored deno checkout
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-ubuntu-stable-examples-verify-no-bin-v1
          cache-directories: ~/.cargo/git/checkouts
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch vendored deno JS/TS sources
        # The workflow-level RUSTC_WRAPPER=sccache (CC2) breaks even
        # `cargo fetch`'s rustc -vV probe on this deliberately
        # toolchain-light job, which never installs sccache.
        env:
          RUSTC_WRAPPER: ""
        run: cargo fetch --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run examples-verify
        env:
          NIMBUS_EXAMPLES_VERIFY_BIN: ${{ github.workspace }}/target/ci-archive/nimbus
          NIMBUS_EXAMPLES_VERIFY_MAX_PARALLEL: "5"
        run: make examples-verify

      - name: Upload examples-verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-verification-reports
          path: |
            target/examples-verify-results/*/report.json
            target/examples-verify-results/*/junit.xml
          if-no-files-found: error
          retention-days: 14

  proof-helpers:
    name: Proof Helper Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check helper script syntax
