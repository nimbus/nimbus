name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Force Cargo through the git CLI so GitHub-hosted Windows runners can use
  # Git's long-path support for large Deno-family dependency submodules.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror Podman's macOS packaging model: ship a pinned upstream gvproxy
  # binary inside the darwin archive instead of publishing gvproxy as a
  # separate Nimbus release asset or depending on Podman at runtime.
  GVPROXY_VERSION: v0.8.8
  # Dedicated machine-os source ref used by the release graph. Nimbus stages
  # the bootc artifact as soon as the Linux arm64 binary exists, then dispatches
  # the machine-os repository to publish from its own package context after all
  # CLI release targets pass.
  MACHINE_OS_SOURCE_REF: main
  MACHINE_OS_REPOSITORY: nimbus/machine-os
  MACHINE_OS_PACKAGE: ghcr.io/nimbus/machine-os
  MACHINE_OS_STAGED_ARTIFACT: nimbus-machine-os-arm64-staged
  MACHINE_OS_RELEASE_ARTIFACT: machine-os-arm64-release
  MACHINE_OS_FEDORA_BOOTC_IMAGE: quay.io/fedora/fedora-bootc@sha256:5cb3f1ce33bb0663effecf6b278dae5c91a97f4ab0b5dddd8a883ba9a9f6b354
  MACHINE_OS_BOOTC_IMAGE_BUILDER: quay.io/centos-bootc/bootc-image-builder@sha256:754fc17718f977313885379e2c779066aba7d15af88fe04b486baec74759f574
  NIMBUS_IMAGE_PACKAGE: ghcr.io/nimbus/nimbus
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

permissions:
  contents: read

jobs:
  verify-release-contract:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches workspace/package versions
        run: bash scripts/verify-release-version-contract.sh "${{ github.ref_name }}"

      - name: Verify machine-os release default gate helper
        run: bash scripts/verify-machine-os-release-default-gate-helper.sh

      - name: Verify bootc default promotion gate helper
        run: bash scripts/verify-bootc-default-promotion-gate-helper.sh

      - name: Verify release runtime feature selector
        shell: bash
        run: |
          bash -n scripts/nimbus-release-rust-features.sh
          test "$(bash scripts/nimbus-release-rust-features.sh --target x86_64-unknown-linux-gnu --format cargo-args)" = "--features v8-pointer-compression"
          test "$(bash scripts/nimbus-release-rust-features.sh --target aarch64-apple-darwin --format cargo-args)" = "--features v8-pointer-compression"
          test "$(bash scripts/nimbus-release-rust-features.sh --target aarch64-unknown-linux-gnu --format cargo-args)" = "--features v8-pointer-compression"
          test -z "$(bash scripts/nimbus-release-rust-features.sh --target x86_64-pc-windows-msvc --format cargo-args)"

      - name: Verify machine-os release ref contract
        run: bash scripts/verify-machine-os-release-ref-contract.sh

      - name: Verify machine-os release ref contract helper
        run: bash scripts/verify-machine-os-release-ref-contract-helper.sh

      - name: Verify release OCI image helper
        run: bash scripts/verify-release-oci-image-helper.sh

      - name: Require machine-os release app credentials
        env:
          MACHINE_OS_RELEASE_APP_CLIENT_ID: ${{ vars.MACHINE_OS_RELEASE_APP_CLIENT_ID }}
          MACHINE_OS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MACHINE_OS_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${MACHINE_OS_RELEASE_APP_CLIENT_ID}" ]]; then
            echo "MACHINE_OS_RELEASE_APP_CLIENT_ID must be configured so this workflow can check out machine-os and dispatch the matching machine-os release." >&2
            exit 1
          fi
          if [[ -z "${MACHINE_OS_RELEASE_APP_PRIVATE_KEY}" ]]; then
            echo "MACHINE_OS_RELEASE_APP_PRIVATE_KEY must be configured so this workflow can check out machine-os and dispatch the matching machine-os release." >&2
            exit 1
          fi

  ui-artifacts:
    name: UI Artifacts
    needs: verify-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build nimbus-ui artifacts
        run: make build-ui

      - name: Upload nimbus-ui artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts
          path: |
            packages/nimbus-ui/.nimbus/convex
            packages/nimbus-ui/dist
          if-no-files-found: error
          retention-days: 1

  build-linux-arm64:
    name: Build (aarch64-unknown-linux-gnu)
    needs: [verify-release-contract, ui-artifacts]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6

      # CA4: Centralize toolchain + sccache + Swatinem cache + googlesource
      # bootstrap through the composite action. Release tag builds opt into
      # `save-cache: always` so per-target caches accumulate across tags;
      # PR CI keeps the default `auto` (save only on main).
      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: release-aarch64-unknown-linux-gnu-ptrcomp-no-bin-v1
          save-cache: always
          linux-linker: default
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Set up Node.js for target-local embedded payload
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build target-local embedded package payload
        env:
          NIMBUS_EMBEDDED_ESBUILD_PLATFORM: linux-arm64
        run: npm run build:embedded-packages

      - name: Build release binary
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          echo "::group::arm64 release build resources"
          date -u
          nproc || true
          free -h || true
          df -h . || true
          echo "CARGO_PROFILE_RELEASE_LTO=${CARGO_PROFILE_RELEASE_LTO}"
          echo "::endgroup::"

          while sleep 120; do
            echo "::group::arm64 release build heartbeat"
            date -u
            free -h || true
            df -h . || true
            echo "::endgroup::"
          done &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          cargo_features="$(bash scripts/nimbus-release-rust-features.sh --target aarch64-unknown-linux-gnu --format cargo-args)"
          echo "release runtime features: ${cargo_features:-<none>}"
          cargo build --release -p nimbus-bin ${cargo_features} -j 1

      - name: Prove SQLCipher release lane
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/verify-sqlcipher-proof.sh \
            --output-dir "dist/sqlcipher-proof-aarch64-unknown-linux-gnu" \
            cargo-lanes

      - name: Upload SQLCipher proof bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlcipher-proof-aarch64-unknown-linux-gnu
          path: dist/sqlcipher-proof-aarch64-unknown-linux-gnu
          compression-level: 0
          if-no-files-found: ignore

      - name: Package archive
        run: |
          tar czf nimbus_linux_arm64.tar.gz \
            -C target/release nimbus \
            -C ${{ github.workspace }} README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nimbus_linux_arm64
          path: nimbus_linux_arm64.tar.gz
          compression-level: 0

  build:
    name: Build (${{ matrix.target }})
    needs: [verify-release-contract, ui-artifacts]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
            arch: x86_64
            esbuild_platform: linux-x64
            archive: tar.gz
            runtime_feature_mode: ptrcomp
          - target: aarch64-apple-darwin
            runner: macos-14
            os: darwin
            arch: arm64
            esbuild_platform: darwin-arm64
            archive: tar.gz
            runtime_feature_mode: ptrcomp
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: x86_64
            esbuild_platform: win32-x64
            archive: zip
            runtime_feature_mode: non-ptrcomp
          # Windows ARM64 — V8 prebuilt available, but no free GitHub runner yet.
          # Uncomment when GitHub adds a free windows-arm64 runner.
          # See: https://github.com/actions/runner-images/issues
          # - target: aarch64-pc-windows-msvc
          #   runner: windows-11-arm
          #   os: windows
          #   arch: arm64
          #   archive: zip

    steps:
      - uses: actions/checkout@v6

      # CA4: Centralize toolchain + sccache + Swatinem cache + googlesource
      # bootstrap through the composite action. The composite's mold step is
      # Linux-gated and no-ops on the macOS and Windows matrix entries.
      # Release tag builds opt into `save-cache: always` so per-target caches
      # accumulate across tags; PR CI keeps the default `auto` (main only).
      - name: Set up Rust with cache
        uses: ./.github/actions/setup-rust-cached
        with:
          shared-key: release-${{ matrix.target }}-${{ matrix.runtime_feature_mode }}-no-bin-v1
          save-cache: always
          linux-linker: default
          googlesource-cookie: ${{ secrets.GOOGLESOURCE_COOKIE }}

      - name: Download nimbus-ui artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-artifacts
          path: packages/nimbus-ui

      - name: Refresh nimbus-ui artifact mtimes
        shell: bash
        run: find packages/nimbus-ui/.nimbus packages/nimbus-ui/dist -exec touch {} +

      - name: Set up Node.js for target-local embedded payload
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build target-local embedded package payload
        env:
          NIMBUS_EMBEDDED_ESBUILD_PLATFORM: ${{ matrix.esbuild_platform }}
        run: npm run build:embedded-packages

      - name: Set up Windows Perl
        if: matrix.os == 'windows'
        uses: shogo82148/actions-setup-perl@a198315ec4e9244f206879ea7b63078003aec8a6 # v1
        with:
          distribution: strawberry
          perl-version: "5.42"

      - name: Export Windows Perl for vendored OpenSSL
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $perlExe = (Get-Command perl).Source
          "PERL=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_SRC_PERL=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $perlExe -MLocale::Maketext::Simple -e "print qq(Strawberry Perl OK`n)"

      - name: Enable Windows long paths for Cargo git dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Build release binary
        shell: bash
        run: |
          cargo_features="$(bash scripts/nimbus-release-rust-features.sh --target "${{ matrix.target }}" --format cargo-args)"
          echo "release runtime features: ${cargo_features:-<none>}"
          cargo build --release -p nimbus-bin ${cargo_features}

      - name: Prove SQLCipher release lane
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/verify-sqlcipher-proof.sh \
            --output-dir "dist/sqlcipher-proof-${{ matrix.target }}" \
            cargo-lanes

      - name: Upload SQLCipher proof bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlcipher-proof-${{ matrix.target }}
          path: dist/sqlcipher-proof-${{ matrix.target }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Bundle macOS machine helper
        if: matrix.os == 'darwin'
        run: |
          mkdir -p dist/libexec
          curl --fail -sSL --retry 5 \
            -o dist/libexec/gvproxy \
            "https://github.com/containers/gvisor-tap-vsock/releases/download/${GVPROXY_VERSION}/gvproxy-darwin"
          chmod 0755 dist/libexec/gvproxy

      - name: Package archive (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/release/nimbus dist/nimbus
          cp README.md LICENSE dist/
          if [[ "${{ matrix.os }}" == "darwin" ]]; then
            tar czf nimbus_${{ matrix.os }}_${{ matrix.arch }}.tar.gz \
              -C dist nimbus libexec README.md LICENSE
          else
          tar czf nimbus_${{ matrix.os }}_${{ matrix.arch }}.tar.gz \
              -C dist nimbus README.md LICENSE
          fi

      - name: Package archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/nimbus.exe, README.md, LICENSE `
            -DestinationPath nimbus_windows_x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nimbus_${{ matrix.os }}_${{ matrix.arch }}
          path: nimbus_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.archive }}
          compression-level: 0

  build-machine-os:
    name: Build machine-os
    needs: [build-linux-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      machine_os_source_revision: ${{ steps.machine_os_source.outputs.revision }}
    permissions:
      contents: read
    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6

      - name: Create machine-os source token
        id: machine_os_source_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MACHINE_OS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINE_OS_RELEASE_APP_PRIVATE_KEY }}
          owner: nimbus
          repositories: machine-os
          permission-contents: read

      - name: Check out machine-os repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MACHINE_OS_REPOSITORY }}
          ref: ${{ env.MACHINE_OS_SOURCE_REF }}
          path: machine-os
          token: ${{ steps.machine_os_source_token.outputs.token }}

      - name: Initialize machine-os directories
        run: |
          {
            echo "MACHINE_OS_DIR=${GITHUB_WORKSPACE}/machine-os"
            echo "BUILD_OUTPUT_DIR=${RUNNER_TEMP}/nimbus-machine-os"
            echo "LAYOUT_DIR=${RUNNER_TEMP}/nimbus-machine-os-layout"
            echo "STAGE_DIR=${RUNNER_TEMP}/nimbus-machine-os-staged"
          } >> "${GITHUB_ENV}"
          mkdir -p \
            "${RUNNER_TEMP}/nimbus-machine-os" \
            "${RUNNER_TEMP}/nimbus-machine-os-layout" \
            "${RUNNER_TEMP}/nimbus-machine-os-staged"

      - name: Download Linux arm64 nimbus artifact
        uses: actions/download-artifact@v8
        with:
          name: nimbus_linux_arm64
          path: ${{ runner.temp }}/nimbus-linux-arm64

      - name: Extract nimbus binary
        run: |
          tar xzf "${RUNNER_TEMP}/nimbus-linux-arm64/nimbus_linux_arm64.tar.gz" \
            -C "${RUNNER_TEMP}/nimbus-linux-arm64"
          chmod +x "${RUNNER_TEMP}/nimbus-linux-arm64/nimbus"
          echo "NIMBUS_LINUX_ARM64_BINARY=${RUNNER_TEMP}/nimbus-linux-arm64/nimbus" >> "${GITHUB_ENV}"

      - name: Resolve machine-os source revision
        id: machine_os_source
        run: |
          revision="$(git -C "${MACHINE_OS_DIR}" rev-parse HEAD)"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "machine-os source revision: ${revision}"

      - name: Verify build-host requirements
        run: |
          command -v sudo
          command -v git
          command -v podman
          command -v gzip
          command -v sha256sum
          sudo -n true

      - name: Restore container image cache
        id: image-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/image-cache
          key: machine-os-base-image-arm64-${{ hashFiles('.github/workflows/release.yml', 'machine-os/image/Containerfile', 'machine-os/image/build-common.sh', 'machine-os/image/build.sh') }}
          restore-keys: |
            machine-os-base-image-arm64-

      - name: Load cached container images
        run: |
          cache_dir="${RUNNER_TEMP}/image-cache"
          for archive in "${cache_dir}"/*.tar; do
            if [[ -f "${archive}" ]]; then
              echo "Loading $(basename "${archive}")..."
              sudo podman load -i "${archive}"
            fi
          done

      - name: Pull base images
        run: |
          sudo podman pull "${MACHINE_OS_FEDORA_BOOTC_IMAGE}" &
          fedora_pid=$!
          sudo podman pull "${MACHINE_OS_BOOTC_IMAGE_BUILDER}" &
          bib_pid=$!
          wait "${fedora_pid}"
          wait "${bib_pid}"

      - name: Build machine-os guest image
        run: |
          cd "${MACHINE_OS_DIR}"
          sudo bash scripts/build.sh \
            --nimbus-binary "${NIMBUS_LINUX_ARM64_BINARY}" \
            --nimbus-version "${{ github.ref_name }}" \
            --source-revision "${{ steps.machine_os_source.outputs.revision }}" \
            --fedora-bootc-base-image "${MACHINE_OS_FEDORA_BOOTC_IMAGE}" \
            --bib-image "${MACHINE_OS_BOOTC_IMAGE_BUILDER}" \
            --output-dir "${BUILD_OUTPUT_DIR}"
          sudo chown -R "$(id -u):$(id -g)" \
            "${BUILD_OUTPUT_DIR}"

      - name: Save base image to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          cache_dir="${RUNNER_TEMP}/image-cache"
          mkdir -p "${cache_dir}"
          sudo podman save -o "${cache_dir}/fedora-bootc-base.tar" "${MACHINE_OS_FEDORA_BOOTC_IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" "${cache_dir}"

      - name: Package raw-disk OCI layout
        run: |
          cd "${MACHINE_OS_DIR}"
          bash scripts/package-oci.sh \
            --build-output-dir "${BUILD_OUTPUT_DIR}" \
            --image-reference "docker://${{ env.MACHINE_OS_PACKAGE }}:${{ github.ref_name }}" \
            --layout-dir "${LAYOUT_DIR}" \
            --arch arm64 \
            --source-repository-url "https://github.com/${{ env.MACHINE_OS_REPOSITORY }}" \
            --source-revision "${{ steps.machine_os_source.outputs.revision }}" \
            --attestation-repository "${{ env.MACHINE_OS_REPOSITORY }}" \
            --nimbus-version "${{ github.ref_name }}"

      - name: Assemble staged machine-os artifact
        run: |
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/build-output" "${STAGE_DIR}/layout"
          cp \
            "${BUILD_OUTPUT_DIR}/summary.txt" \
            "${BUILD_OUTPUT_DIR}/nimbus-machine-os.ociarchive" \
            "${BUILD_OUTPUT_DIR}/nimbus-machine-os.raw.gz" \
            "${BUILD_OUTPUT_DIR}/nimbus-machine-os.sbom.cdx.json" \
            "${STAGE_DIR}/build-output/"
          cp -R "${LAYOUT_DIR}/." "${STAGE_DIR}/layout/"

      - name: Upload staged machine-os artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MACHINE_OS_STAGED_ARTIFACT }}
          if-no-files-found: error
          path: ${{ env.STAGE_DIR }}/**
          compression-level: 0

  publish-machine-os:
    name: Publish machine-os
    needs: [build-linux-arm64, build, build-machine-os]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6

      - name: Create machine-os workflow token
        id: machine_os_workflow_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.MACHINE_OS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINE_OS_RELEASE_APP_PRIVATE_KEY }}
          owner: nimbus
          repositories: machine-os
          permission-actions: write
          permission-contents: read

      - name: Verify dispatch-host requirements
        run: |
          command -v gh
          command -v jq

      - name: Dispatch machine-os publish workflow
        id: machine_os_publish
        env:
          GH_TOKEN: ${{ steps.machine_os_workflow_token.outputs.token }}
          MACHINE_OS_SOURCE_REVISION: ${{ needs.build-machine-os.outputs.machine_os_source_revision }}
        run: |
          dispatch_response="$(
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${MACHINE_OS_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
              -f ref="${MACHINE_OS_SOURCE_REF}" \
              -F return_run_details=true \
              -f "inputs[source_repository]=${GITHUB_REPOSITORY}" \
              -f "inputs[source_run_id]=${GITHUB_RUN_ID}" \
              -f "inputs[source_run_attempt]=${GITHUB_RUN_ATTEMPT}" \
              -f "inputs[nimbus_version]=${GITHUB_REF_NAME}" \
              -f "inputs[release_tag]=${GITHUB_REF_NAME}" \
              -f "inputs[stage_artifact_name]=${MACHINE_OS_STAGED_ARTIFACT}" \
              -f "inputs[image_reference]=docker://${MACHINE_OS_PACKAGE}:${GITHUB_REF_NAME}" \
              -f "inputs[machine_os_source_revision]=${MACHINE_OS_SOURCE_REVISION}" \
              -F "inputs[create_release]=true"
          )"

          run_id="$(jq -r '.workflow_run_id // empty' <<<"${dispatch_response}")"
          run_url="$(jq -r '.html_url // .run_url // empty' <<<"${dispatch_response}")"
          if [[ -z "${run_id}" ]]; then
            echo "workflow dispatch did not return a machine-os publish run id: ${dispatch_response}" >&2
            exit 66
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${run_url}" >> "${GITHUB_OUTPUT}"
          echo "machine-os publish run: ${run_url}"

      - name: Wait for machine-os publish workflow
        env:
          GH_TOKEN: ${{ steps.machine_os_workflow_token.outputs.token }}
        run: |
          run_id="${{ steps.machine_os_publish.outputs.run_id }}"
          for _ in {1..180}; do
            run_json="$(gh run view "${run_id}" --repo "${MACHINE_OS_REPOSITORY}" --json status,conclusion,url)"
            status="$(jq -r '.status' <<<"${run_json}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${run_json}")"
            url="$(jq -r '.url' <<<"${run_json}")"

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "machine-os publish succeeded: ${url}"
                exit 0
              fi
              echo "machine-os publish failed with conclusion ${conclusion}: ${url}" >&2
              exit 65
            fi

            sleep 20
          done

          echo "timed out waiting for machine-os publish run ${run_id}" >&2
          exit 66

      - name: Download machine-os release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MACHINE_OS_RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/machine-os-release
          repository: ${{ env.MACHINE_OS_REPOSITORY }}
          run-id: ${{ steps.machine_os_publish.outputs.run_id }}
          github-token: ${{ steps.machine_os_workflow_token.outputs.token }}

      - name: Verify machine-os release default gate
        run: |
          bash scripts/verify-machine-os-release-default-gate.sh \
            --release-dir "${RUNNER_TEMP}/machine-os-release" \
            --expected-tag "${{ github.ref_name }}" \
            --require-ghcr-public

      - name: Upload machine-os release bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MACHINE_OS_RELEASE_ARTIFACT }}
          if-no-files-found: error
          path: ${{ runner.temp }}/machine-os-release/**
          compression-level: 0

  build-oci-image:
    name: Build OCI image (${{ matrix.platform }})
    needs: [build-linux-arm64, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: nimbus_linux_x86_64
            archive: nimbus_linux_x86_64.tar.gz
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: nimbus_linux_arm64
            archive: nimbus_linux_arm64.tar.gz
            arch_tag: arm64
    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux release archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}

      - name: Verify Linux release archive before image build
        run: |
          archive="${RUNNER_TEMP}/${{ matrix.artifact }}/${{ matrix.archive }}"
          tar -tzf "${archive}" | grep -Fx nimbus
          tar -tzf "${archive}" | grep -Fx README.md
          tar -tzf "${archive}" | grep -Fx LICENSE

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Build and push per-arch Nimbus image
        id: build
        env:
          IMAGE: ${{ env.NIMBUS_IMAGE_PACKAGE }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          build_date="$(git show -s --format=%cI "${GITHUB_SHA}")"
          context_dir="${RUNNER_TEMP}/nimbus-oci-context-${ARCH_TAG}"
          mkdir -p "${context_dir}"
          cp Containerfile "${context_dir}/Containerfile"
          cp "${RUNNER_TEMP}/${{ matrix.artifact }}/${ARCHIVE}" "${context_dir}/${ARCHIVE}"

          docker buildx create \
            --use \
            --driver docker-container \
            --name "nimbus-release-image-${ARCH_TAG}"
          docker buildx inspect --bootstrap

          docker buildx build \
            --platform "${PLATFORM}" \
            --file "${context_dir}/Containerfile" \
            --build-arg "NIMBUS_ARCHIVE=${ARCHIVE}" \
            --build-arg "NIMBUS_VERSION=${TAG}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "oci-${ARCH_TAG}-metadata.json" \
            --tag "${IMAGE}:${TAG}-${ARCH_TAG}" \
            --push \
            "${context_dir}"

          digest="$(jq -r '."containerimage.digest"' "oci-${ARCH_TAG}-metadata.json")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "buildx did not report a valid ${ARCH_TAG} image digest: ${digest}" >&2
            cat "oci-${ARCH_TAG}-metadata.json" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "arch_tag=${ARCH_TAG}"
            echo "platform=${PLATFORM}"
            echo "digest=${digest}"
            echo "ref=${IMAGE}:${TAG}-${ARCH_TAG}@${digest}"
          } > "oci-digest-${ARCH_TAG}.env"

      - name: Smoke-test per-arch image
        run: |
          bash scripts/smoke-release-oci-image.sh \
            --image "${{ env.NIMBUS_IMAGE_PACKAGE }}:${{ github.ref_name }}-${{ matrix.arch_tag }}@${{ steps.build.outputs.digest }}" \
            --expected-version "${{ github.ref_name }}"

      - name: Attest per-arch image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.NIMBUS_IMAGE_PACKAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload per-arch image digest
        uses: actions/upload-artifact@v7
        with:
          name: oci-image-digest-${{ matrix.arch_tag }}
          path: oci-digest-${{ matrix.arch_tag }}.env
          compression-level: 0

  publish-oci-image:
    name: Publish OCI image
    needs: build-oci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out Nimbus repository
        uses: actions/checkout@v6

      - name: Download per-arch image digests
        uses: actions/download-artifact@v8
        with:
          path: oci-image-digests
          pattern: oci-image-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Assemble multi-arch image manifest
        id: manifest
        env:
          IMAGE: ${{ env.NIMBUS_IMAGE_PACKAGE }}
          TAG: ${{ github.ref_name }}
        run: |
          amd64_digest="$(awk -F= '$1 == "digest" {print $2}' oci-image-digests/oci-digest-amd64.env)"
          arm64_digest="$(awk -F= '$1 == "digest" {print $2}' oci-image-digests/oci-digest-arm64.env)"
          for digest in "${amd64_digest}" "${arm64_digest}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid per-arch digest: ${digest}" >&2
              exit 1
            fi
          done

          docker buildx create \
            --use \
            --driver docker-container \
            --name nimbus-release-manifest
          docker buildx inspect --bootstrap

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=Nimbus" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${TAG}" \
            --annotation "index:org.opencontainers.image.licenses=LicenseRef-Nimbus-Community" \
            --tag "${IMAGE}:${TAG}" \
            --metadata-file oci-manifest-metadata.json \
            "${IMAGE}:${TAG}-amd64@${amd64_digest}" \
            "${IMAGE}:${TAG}-arm64@${arm64_digest}"

          multi_digest="$(jq -r '."containerimage.descriptor".digest' oci-manifest-metadata.json)"
          if [[ ! "${multi_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "imagetools did not report a valid multi-arch digest: ${multi_digest}" >&2
            cat oci-manifest-metadata.json >&2
            exit 1
          fi

          latest_digest="none"
          if [[ "${TAG}" != *-* ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              --metadata-file oci-latest-metadata.json \
              "${IMAGE}:${TAG}@${multi_digest}"
            latest_digest="$(jq -r '."containerimage.descriptor".digest' oci-latest-metadata.json)"
            if [[ "${latest_digest}" != "${multi_digest}" ]]; then
              echo "latest digest ${latest_digest} did not match ${multi_digest}" >&2
              exit 1
            fi
          fi

          {
            echo "multi_digest=${multi_digest}"
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "latest_digest=${latest_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest multi-arch image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.NIMBUS_IMAGE_PACKAGE }}
          subject-digest: ${{ steps.manifest.outputs.multi_digest }}
          push-to-registry: true

      - name: Verify multi-arch image attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          signer_workflow="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify \
            "oci://${{ env.NIMBUS_IMAGE_PACKAGE }}:${{ github.ref_name }}@${{ steps.manifest.outputs.multi_digest }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle-from-oci \
            --signer-workflow "${signer_workflow}" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --source-ref "refs/tags/${{ github.ref_name }}" \
            --deny-self-hosted-runners \
            --format json \
            > artifacts/nimbus_oci_attestation.json

      - name: Capture image SBOM evidence
        run: |
          mkdir -p artifacts
          image_ref="${{ env.NIMBUS_IMAGE_PACKAGE }}:${{ github.ref_name }}@${{ steps.manifest.outputs.multi_digest }}"
          raw_sbom_amd64="${RUNNER_TEMP}/nimbus_oci_sbom_linux_amd64.raw.json"
          raw_sbom_arm64="${RUNNER_TEMP}/nimbus_oci_sbom_linux_arm64.raw.json"

          docker buildx imagetools inspect "${image_ref}" \
            --format '{{json (index .SBOM "linux/amd64").SPDX}}' \
            > "${raw_sbom_amd64}"
          docker buildx imagetools inspect "${image_ref}" \
            --format '{{json (index .SBOM "linux/arm64").SPDX}}' \
            > "${raw_sbom_arm64}"

          for sbom_path in "${raw_sbom_amd64}" "${raw_sbom_arm64}"; do
            if [[ ! -s "${sbom_path}" ]] || grep -Fx "null" "${sbom_path}" >/dev/null; then
              echo "missing BuildKit platform SBOM evidence for Nimbus OCI image: ${sbom_path}" >&2
              exit 1
            fi
            jq -e 'type == "object" and length > 0 and (.SPDXID | type == "string")' "${sbom_path}" >/dev/null
          done

          jq -n \
            --arg image "${{ env.NIMBUS_IMAGE_PACKAGE }}" \
            --arg tag "${{ github.ref_name }}" \
            --arg ref "${{ env.NIMBUS_IMAGE_PACKAGE }}:${{ github.ref_name }}@${{ steps.manifest.outputs.multi_digest }}" \
            --arg digest "${{ steps.manifest.outputs.multi_digest }}" \
            --slurpfile amd64 "${raw_sbom_amd64}" \
            --slurpfile arm64 "${raw_sbom_arm64}" \
            '{subject: {image: $image, tag: $tag, ref: $ref, digest: $digest}, platforms: {"linux/amd64": $amd64[0], "linux/arm64": $arm64[0]}}' \
            > artifacts/nimbus_oci_sbom.json

      - name: Scan image for vulnerabilities
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${PWD}/artifacts:/workspace" \
            "${TRIVY_IMAGE}" \
            image \
            --image-src remote \
            --scanners vuln \
            --format sarif \
            --output /workspace/nimbus_oci_vulns.sarif.json \
            --no-progress \
            --skip-version-check \
            "${{ env.NIMBUS_IMAGE_PACKAGE }}:${{ github.ref_name }}@${{ steps.manifest.outputs.multi_digest }}"
          test -s artifacts/nimbus_oci_vulns.sarif.json

      - name: Render OCI image release report
        run: |
          bash scripts/render-release-oci-image-report.sh \
            --image "${{ env.NIMBUS_IMAGE_PACKAGE }}" \
            --tag "${{ github.ref_name }}" \
            --multi-digest "${{ steps.manifest.outputs.multi_digest }}" \
            --amd64-digest "${{ steps.manifest.outputs.amd64_digest }}" \
            --arm64-digest "${{ steps.manifest.outputs.arm64_digest }}" \
            --latest-digest "${{ steps.manifest.outputs.latest_digest }}" \
            --output artifacts/nimbus_oci_image.txt

      - name: Verify OCI image release report
        run: |
          bash scripts/verify-release-oci-image-report.sh \
            --report artifacts/nimbus_oci_image.txt \
            --expected-image "${{ env.NIMBUS_IMAGE_PACKAGE }}" \
            --expected-tag "${{ github.ref_name }}"

      - name: Verify OCI image release evidence assets
        run: |
          bash scripts/verify-release-oci-image-assets.sh \
            --artifacts-dir artifacts \
            --expected-image "${{ env.NIMBUS_IMAGE_PACKAGE }}" \
            --expected-tag "${{ github.ref_name }}"

      - name: Upload OCI image release evidence
        uses: actions/upload-artifact@v7
        with:
          name: nimbus_oci_image
          if-no-files-found: error
          path: artifacts/nimbus_oci_*
          compression-level: 0

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-linux-arm64, build, publish-machine-os, publish-oci-image]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download nimbus build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nimbus_*
          merge-multiple: true

      - name: Verify release archive layout
        run: bash scripts/verify-release-archive-layout.sh --artifacts-dir artifacts

      - name: Verify optional Bun/JSC adapter assets
        run: bash scripts/verify-bun-jsc-release-assets.sh --artifacts-dir artifacts

      - name: Stage release support assets
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp LICENSE artifacts/LICENSE
          chmod 0755 artifacts/install.sh
          test -s artifacts/LICENSE

      - name: Generate checksums
        run: |
          cd artifacts
          shopt -s nullglob
          adapter_assets=(nimbus-bun-jsc-adapter-*.tar.gz)
          checksum_assets=(nimbus_*)
          checksum_assets+=("${adapter_assets[@]}" install.sh LICENSE)
          declare -A seen_checksum_asset=()
          unique_checksum_assets=()
          for asset in "${checksum_assets[@]}"; do
            [[ -e "${asset}" ]] || continue
            if [[ -z "${seen_checksum_asset[$asset]+x}" ]]; then
              seen_checksum_asset["$asset"]=1
              unique_checksum_assets+=("${asset}")
            fi
          done
          sha256sum "${unique_checksum_assets[@]}" > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Verify optional Bun/JSC adapter checksums
        run: |
          bash scripts/verify-bun-jsc-release-assets.sh \
            --artifacts-dir artifacts \
            --checksums artifacts/checksums-sha256.txt

      - name: Verify OCI image release evidence bundle
        run: |
          bash scripts/verify-release-oci-image-assets.sh \
            --artifacts-dir artifacts \
            --expected-image "${{ env.NIMBUS_IMAGE_PACKAGE }}" \
            --expected-tag "${{ github.ref_name }}" \
            --require-license \
            --checksums artifacts/checksums-sha256.txt

      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
          github_token: ${{ github.token }}
        env:
          OUTPUT: /tmp/RELEASE_NOTES.md

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          github_token: ${{ github.token }}
        env:
          OUTPUT: /tmp/CHANGELOG.md

      - name: Update CHANGELOG.md on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_SHA=$(gh api repos/${{ github.repository }}/contents/CHANGELOG.md \
            --jq '.sha' 2>/dev/null || echo "")

          ARGS=(
            repos/${{ github.repository }}/contents/CHANGELOG.md
            --method PUT
            --field message="docs: update CHANGELOG.md for ${{ github.ref_name }}"
            --field content="$(base64 -w0 /tmp/CHANGELOG.md)"
            --field branch="main"
          )
          if [ -n "$FILE_SHA" ]; then
            ARGS+=(--field sha="$FILE_SHA")
          fi

          gh api "${ARGS[@]}" --silent
        continue-on-error: true

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release asset provenance
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/checksums-sha256.txt

      - name: Attest checksum manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/checksums-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --notes-file /tmp/RELEASE_NOTES.md \
            ${{ steps.prerelease.outputs.flag }} \
            artifacts/*

      - name: Create Homebrew tap token
        id: homebrew_tap_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: nimbus
          repositories: homebrew-tap
          permission-contents: write

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ steps.homebrew_tap_token.outputs.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          SHA_DARWIN_ARM64=$(grep darwin_arm64 artifacts/checksums-sha256.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep linux_arm64 artifacts/checksums-sha256.txt | awk '{print $1}')
          SHA_LINUX_X86_64=$(grep linux_x86_64 artifacts/checksums-sha256.txt | awk '{print $1}')

          cat > /tmp/nimbus.rb << CASKEOF
          cask "nimbus" do
            name "nimbus"
            desc "Self-hosted JavaScript backend runtime powered by V8"
            homepage "https://github.com/nimbus/nimbus"
            version "${VERSION}"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "nimbus"

            on_macos do
              depends_on arch: :arm64
              depends_on macos: ">= :sonoma"
              depends_on formula: "slp/krunkit/krunkit"

              on_arm do
                url "https://github.com/nimbus/nimbus/releases/download/v#{version}/nimbus_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/nimbus/nimbus/releases/download/v#{version}/nimbus_linux_x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
              on_arm do
                url "https://github.com/nimbus/nimbus/releases/download/v#{version}/nimbus_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            postflight do
              if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
                system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path.to_s], sudo: false
              end
            end

            caveats do
              "Nimbus has been installed!"
              ""
              "Quick start:"
              "  nimbus --help              # Show all commands"
              "  nimbus machine init        # Record the default macOS machine contract"
              "  nimbus start               # Start the server"
              ""
              "Documentation: https://github.com/nimbus/nimbus"
            end
          end

          CASKEOF

          # Strip leading whitespace from heredoc
          sed -i 's/^          //' /tmp/nimbus.rb

          # Get current file SHA (if it exists) for the update API call
          FILE_SHA=$(gh api repos/nimbus/homebrew-tap/contents/Casks/nimbus.rb --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$FILE_SHA" ]; then
            gh api repos/nimbus/homebrew-tap/contents/Casks/nimbus.rb \
              --method PUT \
              --field message="Update nimbus to ${VERSION}" \
              --field content="$(base64 -w0 /tmp/nimbus.rb)" \
              --field sha="$FILE_SHA" \
              --silent
          else
            gh api repos/nimbus/homebrew-tap/contents/Casks/nimbus.rb \
              --method PUT \
              --field message="Add nimbus cask at ${VERSION}" \
              --field content="$(base64 -w0 /tmp/nimbus.rb)" \
              --silent
          fi
        continue-on-error: true

  # The release above is created with the workflow's GITHUB_TOKEN, and
  # events raised by that token do not trigger other workflows' `release:`
  # triggers — which left linux-distribution-release.yml never running.
  # workflow_dispatch is exempt from that restriction, so dispatch it
  # explicitly.
  trigger-linux-distribution:
    name: Trigger Linux distribution release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [release]
    permissions:
      actions: write
    steps:
      - name: Dispatch linux-distribution-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run linux-distribution-release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f release_tag="${{ github.ref_name }}" \
            -f publish_apt_repo=true \
            -f submit_to_copr=false \
            -f include_bun_jsc_adapter=false
