# CM1: Composite action consolidating the Rust toolchain + sccache +
# Swatinem cache + googlesource credentials bootstrap that previously
# appeared verbatim at 12 sites across ci.yml, desktop-ui.yml, and
# node-compat-nightly.yml.
#
# Owning plan: docs/plans/ci-modernization-plan.md (CM1).
# Caching contract: docs/operating/ci-caching.md.

name: Set up Rust with cache
description: >-
  Install the Rust toolchain, sccache, and the Swatinem cargo cache, and
  configure googlesource credentials for any chromium.googlesource.com
  pulls. Centralizes the pinned versions of these third-party actions so
  bumps land in one file.

inputs:
  shared-key:
    description: >-
      Swatinem/rust-cache shared-key. Must remain unique per job so caches
      do not collide. Bump the trailing `-vN` to invalidate.
    required: true
  toolchain-components:
    description: >-
      Optional rustup components to install (e.g. "clippy" or
      "llvm-tools-preview"). Empty by default.
    required: false
    default: ""
  cache-bin:
    description: >-
      Whether Swatinem/rust-cache should cache `~/.cargo/bin`. Defaults to
      "false" because the CC caching contract excludes binaries from the
      cargo cache.
    required: false
    default: "false"
  googlesource-cookie:
    description: >-
      Contents of the .googlesource.com gitcookie. Pass the calling
      workflow's GOOGLESOURCE_COOKIE secret as the value. When empty
      the credential-configuration step is skipped.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure googlesource credentials
      if: inputs.googlesource-cookie != ''
      shell: bash
      env:
        GOOGLESOURCE_COOKIE: ${{ inputs.googlesource-cookie }}
      run: |
        touch ~/.gitcookies && chmod 0600 ~/.gitcookies
        git config --global http.cookiefile ~/.gitcookies
        echo ".googlesource.com	TRUE	/	TRUE	2147483647	o	${GOOGLESOURCE_COOKIE}" >> ~/.gitcookies
        git config --global url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"

    # CA1: Replace the system bfd/lld linker on Linux runners with mold.
    # mold is 3-10x faster than the GNU linker on large instrumented binaries
    # and was the prerequisite for unlocking `cargo llvm-cov -j > 1` in the
    # Coverage job (see ci.yml's coverage step and the CC6 deferral). The
    # env vars persist via $GITHUB_ENV so every subsequent cargo invocation
    # in the job uses mold without per-call wrapper plumbing.
    # macOS/Windows branches keep their system linker; this gate exists so
    # the composite remains portable once CA4 migrates release.yml onto it.
    - name: Install mold linker (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=mold" >> "${GITHUB_ENV}"
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=mold" >> "${GITHUB_ENV}"
        mold --version

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: ${{ inputs.toolchain-components }}

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        cache-directories: ~/.cargo/.rusty_v8
        cache-on-failure: "true"
        cache-bin: ${{ inputs.cache-bin }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
