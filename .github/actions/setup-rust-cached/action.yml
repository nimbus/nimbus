# CM1: Composite action consolidating the Rust toolchain + sccache +
# Swatinem cache + googlesource credentials bootstrap that previously
# appeared verbatim at 12 sites across ci.yml, desktop-ui.yml, and
# node-compat-nightly.yml.
#
# Owning plan: docs/private/plans/ci-modernization-plan.md (CM1).
# Caching contract: docs/private/operating/ci-caching.md.

name: Set up Rust with cache
description: >-
  Install the Rust toolchain, sccache, and the Swatinem cargo cache, and
  configure googlesource credentials for any chromium.googlesource.com
  pulls. Centralizes the pinned versions of these third-party actions so
  bumps land in one file.

inputs:
  shared-key:
    description: >-
      Swatinem/rust-cache shared-key. Must remain unique per job so caches
      do not collide. Bump the trailing `-vN` to invalidate.
    required: true
  toolchain-components:
    description: >-
      Optional rustup components to install (e.g. "clippy" or
      "llvm-tools-preview"). Empty by default.
    required: false
    default: ""
  cache-bin:
    description: >-
      Whether Swatinem/rust-cache should cache `~/.cargo/bin`. Defaults to
      "false" because the CC caching contract excludes binaries from the
      cargo cache.
    required: false
    default: "false"
  googlesource-cookie:
    description: >-
      Contents of the .googlesource.com gitcookie. Pass the calling
      workflow's GOOGLESOURCE_COOKIE secret as the value. When empty
      the credential-configuration step is skipped.
    required: false
    default: ""
  save-cache:
    description: >-
      When to save the Swatinem rust-cache. "auto" (default) saves only on
      pushes to main — the CC9 retraction that protects main warm caches
      from PR cold-cache poisoning. "always" saves on every run — used by
      release.yml tag builds where each tag is intentional and per-target
      shared-keys isolate the cache namespace from PR CI. "never" disables
      saving entirely.
    required: false
    default: "auto"
  linux-linker:
    description: >-
      Linux linker to export through CARGO_TARGET_*_RUSTFLAGS. Defaults to
      "mold" for CI acceleration. Use "lld" for test lanes that combine
      system OpenSSL with the LLVM linker. Use "default" for release lanes
      that must keep vendored OpenSSL and the platform cc default linker.
    required: false
    default: "mold"
  linux-openssl-provider:
    description: >-
      OpenSSL provider for Linux builds. Defaults to "vendored" so release
      artifacts keep the workspace Cargo feature contract. Use "system" for
      CI test lanes that only need a deterministic runner-local OpenSSL link.
    required: false
    default: "vendored"
  consume-prebuilt-v8:
    description: >-
      Opt in to fail-closed rusty_v8 prebuilt consumption. Valid values:
      "false", "release", or "ptrcomp". Disabled by default because this
      composite is shared by staged-rollout workflows that still build V8
      from their current path.
    required: false
    default: "false"
  github-token:
    description: >-
      GitHub token used for rate-limited rusty_v8 fork release downloads
      when consume-prebuilt-v8 is enabled.
    required: false
    default: ""

outputs:
  rusty-v8-release-tag:
    description: "Canonical rusty_v8 fork release tag for the pinned prebuild."
    value: ${{ steps.resolve-prebuilt-v8.outputs.release-tag }}
  rusty-v8-tag:
    description: "Derived rusty_v8 fork tag from Cargo.toml."
    value: ${{ steps.resolve-prebuilt-v8.outputs.rusty-v8-tag }}
  deno-tag:
    description: "Derived shared nimbus/deno patch tag from Cargo.toml."
    value: ${{ steps.resolve-prebuilt-v8.outputs.deno-tag }}
  rust-target:
    description: "Rust host target used for prebuilt V8 consumption."
    value: ${{ steps.resolve-prebuilt-v8.outputs.target }}

runs:
  using: composite
  steps:
    - name: Configure googlesource credentials
      if: inputs.googlesource-cookie != ''
      shell: bash
      env:
        GOOGLESOURCE_COOKIE: ${{ inputs.googlesource-cookie }}
      run: |
        touch ~/.gitcookies && chmod 0600 ~/.gitcookies
        git config --global http.cookiefile ~/.gitcookies
        echo ".googlesource.com	TRUE	/	TRUE	2147483647	o	${GOOGLESOURCE_COOKIE}" >> ~/.gitcookies
        git config --global url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"

    # CA1: Default Linux runners to mold. mold is 3-10x faster than the GNU
    # linker on large binaries. The linux-linker input lets known
    # OpenSSL-backed link lanes opt back to lld without open-coding
    # environment writes in each workflow.
    #
    # Invocation pattern: RUSTFLAGS '-C link-arg=-fuse-ld=mold' (NOT
    # CARGO_TARGET_*_LINKER=mold). The LINKER=mold variant makes rustc
    # invoke mold directly via the gcc-wrapper protocol passing `-m64`,
    # and mold rejects `-m64` with `mold: fatal: unknown -m argument: 64`.
    # Routing through cc with `-fuse-ld=mold` keeps gcc's driver flags
    # gcc-side and only swaps the linker binary cc selects.
    #
    # macOS/Windows branches keep their system linker; this gate exists so
    # the composite remains portable once CA4 migrates release.yml onto it.
    - name: Configure Linux linker
      if: runner.os == 'Linux'
      shell: bash
      env:
        NIMBUS_LINUX_LINKER: ${{ inputs.linux-linker }}
      run: |
        case "${NIMBUS_LINUX_LINKER}" in
          mold)
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mold
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "${GITHUB_ENV}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "${GITHUB_ENV}"
            mold --version
            ;;
          lld)
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "${GITHUB_ENV}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "${GITHUB_ENV}"
            ;;
          default)
            ;;
          *)
            echo "unsupported linux-linker: ${NIMBUS_LINUX_LINKER}" >&2
            exit 64
            ;;
        esac

    - name: Configure Linux OpenSSL provider
      if: runner.os == 'Linux'
      shell: bash
      env:
        NIMBUS_LINUX_OPENSSL_PROVIDER: ${{ inputs.linux-openssl-provider }}
      run: |
        case "${NIMBUS_LINUX_OPENSSL_PROVIDER}" in
          vendored)
            ;;
          system)
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
            echo "OPENSSL_NO_VENDOR=1" >> "${GITHUB_ENV}"
            ;;
          *)
            echo "unsupported linux-openssl-provider: ${NIMBUS_LINUX_OPENSSL_PROVIDER}" >&2
            exit 64
            ;;
        esac

    - name: Configure Windows git long paths
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git config --global core.longpaths true

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: ${{ inputs.toolchain-components }}

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Assert sccache is installed
      shell: bash
      run: sccache --version

    - name: Resolve prebuilt V8 pins
      id: resolve-prebuilt-v8
      if: inputs.consume-prebuilt-v8 != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NIMBUS_PREBUILT_V8_VARIANT: ${{ inputs.consume-prebuilt-v8 }}
      run: |
        set -euo pipefail
        runbook="pin-bump runbook: a maintainer must dispatch nimbus/rusty_v8 release.yml (or push the fork tag); assets are bot-published; the pin PR updates .cargo/rusty-v8-digests.toml."

        case "${NIMBUS_PREBUILT_V8_VARIANT}" in
          release|ptrcomp)
            ;;
          *)
            echo "::error::unsupported consume-prebuilt-v8 value '${NIMBUS_PREBUILT_V8_VARIANT}' (expected false|release|ptrcomp)."
            exit 64
            ;;
        esac

        target="$(rustc -vV | sed -n 's/^host: //p')"
        if [[ "${target}" != "x86_64-unknown-linux-gnu" ]]; then
          echo "::error::prebuilt rusty_v8 consumption is only published for x86_64-unknown-linux-gnu in this batch (got ${target}). ${runbook}"
          exit 64
        fi

        if [[ -z "${GH_TOKEN:-}" ]]; then
          echo "::error::github-token input is required when consume-prebuilt-v8=${NIMBUS_PREBUILT_V8_VARIANT}. ${runbook}"
          exit 64
        fi
        if [[ "${V8_FROM_SOURCE+x}" == "x" ]]; then
          echo "::error::V8_FROM_SOURCE must be unset for fail-closed prebuilt rusty_v8 consumption."
          exit 64
        fi

        python3 - <<'PY' > "${RUNNER_TEMP}/prebuilt-v8-pins.env"
        import re
        import sys
        import tomllib
        from pathlib import Path

        config = tomllib.loads(Path(".cargo/config.toml").read_text())
        cargo = tomllib.loads(Path("Cargo.toml").read_text())
        digests = tomllib.loads(Path(".cargo/rusty-v8-digests.toml").read_text())

        try:
            config_version = config["env"]["RUSTY_V8_VERSION"]
        except KeyError:
            raise SystemExit(".cargo/config.toml is missing [env].RUSTY_V8_VERSION")

        if not re.fullmatch(r"[0-9][0-9A-Za-z.+-]*", config_version):
            raise SystemExit(f"RUSTY_V8_VERSION is not a version-like pin: {config_version!r}")

        patches = cargo.get("patch", {}).get("crates-io", {})
        v8_patch = patches.get("v8")
        if not isinstance(v8_patch, dict):
            raise SystemExit("Cargo.toml [patch.crates-io].v8 must be a table")
        v8_tag = v8_patch.get("tag")
        v8_git = v8_patch.get("git")
        expected_v8_tag = f"v{config_version}"
        if v8_git != "https://github.com/nimbus/rusty_v8":
            raise SystemExit(f"Cargo.toml v8 patch points at {v8_git!r}, expected nimbus/rusty_v8")
        if v8_tag != expected_v8_tag:
            raise SystemExit(
                "rusty_v8 pin disagreement: .cargo/config.toml "
                f"RUSTY_V8_VERSION={config_version!r} implies tag {expected_v8_tag!r}, "
                f"but Cargo.toml patches v8 to {v8_tag!r}"
            )

        deno_tags = {
            table["tag"]
            for table in patches.values()
            if isinstance(table, dict)
            and table.get("git") == "https://github.com/nimbus/deno"
            and "tag" in table
        }
        if len(deno_tags) != 1:
            raise SystemExit(f"expected exactly one nimbus/deno patch tag, got {sorted(deno_tags)!r}")
        deno_tag = next(iter(deno_tags))
        # Shell-safety shape gate: this value is `source`d by the calling shell,
        # so enforce a strict tag shape before it can reach an env file.
        if not re.fullmatch(r"v[0-9A-Za-z][0-9A-Za-z.+-]*", deno_tag):
            raise SystemExit(f"nimbus/deno tag has unsafe shape: {deno_tag!r}")

        release = digests.get("release")
        if not isinstance(release, dict):
            raise SystemExit(".cargo/rusty-v8-digests.toml is missing [release]")
        release_repo = release.get("repo")
        release_tag = release.get("tag")
        if release_repo != "nimbus/rusty_v8":
            raise SystemExit(
                ".cargo/rusty-v8-digests.toml release.repo "
                f"{release_repo!r} != 'nimbus/rusty_v8'"
            )
        if release_tag != expected_v8_tag:
            raise SystemExit(
                ".cargo/rusty-v8-digests.toml release.tag "
                f"{release_tag!r} != expected {expected_v8_tag!r} from RUSTY_V8_VERSION"
            )
        assets = digests.get("assets")
        if not isinstance(assets, dict) or not assets:
            raise SystemExit(".cargo/rusty-v8-digests.toml is missing non-empty [assets]")

        print(f"RUSTY_V8_VERSION_PIN={config_version}")
        print(f"RUSTY_V8_TAG={expected_v8_tag}")
        print(f"RUSTY_V8_RELEASE_TAG={release_tag}")
        print(f"DENO_TAG={deno_tag}")
        PY
        # shellcheck disable=SC1090
        source "${RUNNER_TEMP}/prebuilt-v8-pins.env"

        {
          echo "version=${RUSTY_V8_VERSION_PIN}"
          echo "rusty-v8-tag=${RUSTY_V8_TAG}"
          echo "release-tag=${RUSTY_V8_RELEASE_TAG}"
          echo "deno-tag=${DENO_TAG}"
          echo "target=${target}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore prebuilt V8 payload cache
      id: restore-prebuilt-v8-cache
      if: inputs.consume-prebuilt-v8 != 'false'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/rusty_v8
        key: prebuilt-v8-${{ steps.resolve-prebuilt-v8.outputs.release-tag }}-${{ inputs.consume-prebuilt-v8 }}-${{ steps.resolve-prebuilt-v8.outputs.target }}-${{ hashFiles('.cargo/rusty-v8-digests.toml') }}

    - name: Download and verify prebuilt V8 payloads
      id: consume-prebuilt-v8
      if: inputs.consume-prebuilt-v8 != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NIMBUS_PREBUILT_V8_VARIANT: ${{ inputs.consume-prebuilt-v8 }}
        NIMBUS_PREBUILT_V8_RELEASE_TAG: ${{ steps.resolve-prebuilt-v8.outputs.release-tag }}
        NIMBUS_PREBUILT_V8_RELEASE_REPO: nimbus/rusty_v8
        NIMBUS_PREBUILT_V8_TARGET: ${{ steps.resolve-prebuilt-v8.outputs.target }}
        NIMBUS_PREBUILT_V8_CACHE_HIT: ${{ steps.restore-prebuilt-v8-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        runbook="pin-bump runbook: a maintainer must dispatch nimbus/rusty_v8 release.yml (or push the fork tag); assets are bot-published; the pin PR updates .cargo/rusty-v8-digests.toml."
        fail() {
          echo "::error::$1 ${runbook}"
          exit 1
        }
        trap 'fail "failed to download or verify rusty_v8 ${NIMBUS_PREBUILT_V8_VARIANT} payloads from ${NIMBUS_PREBUILT_V8_RELEASE_REPO}@${NIMBUS_PREBUILT_V8_RELEASE_TAG}."' ERR

        repo_dir="${NIMBUS_PREBUILT_V8_RELEASE_REPO//\//-}"
        mirror_dir="${HOME}/.cache/rusty_v8/${repo_dir}/${NIMBUS_PREBUILT_V8_RELEASE_TAG}/${NIMBUS_PREBUILT_V8_VARIANT}/${NIMBUS_PREBUILT_V8_TARGET}"
        mkdir -p "${mirror_dir}"

        python3 - ".cargo/rusty-v8-digests.toml" "${NIMBUS_PREBUILT_V8_VARIANT}" "${NIMBUS_PREBUILT_V8_TARGET}" "${mirror_dir}" <<'PY' > "${RUNNER_TEMP}/prebuilt-v8-payload.env"
        import re
        import sys
        import tomllib
        from pathlib import Path

        digests_path = Path(sys.argv[1])
        variant_name = sys.argv[2]
        target = sys.argv[3]
        mirror_dir = Path(sys.argv[4])

        digests = tomllib.loads(digests_path.read_text())
        assets = digests.get("assets")
        if not isinstance(assets, dict):
            raise SystemExit(".cargo/rusty-v8-digests.toml is missing [assets]")

        selected_assets = {
            "release": (
                f"librusty_v8_simdutf_release_{target}.a.gz",
                f"src_binding_simdutf_release_{target}.rs",
            ),
            "ptrcomp": (
                f"librusty_v8_ptrcomp_simdutf_release_{target}.a.gz",
                f"src_binding_ptrcomp_simdutf_release_{target}.rs",
            ),
        }
        if variant_name not in selected_assets:
            raise SystemExit(f"unsupported variant {variant_name!r}")
        archive_gz_name, binding_name = selected_assets[variant_name]
        missing = [name for name in (archive_gz_name, binding_name) if name not in assets]
        if missing:
            raise SystemExit(f".cargo/rusty-v8-digests.toml missing selected assets: {missing!r}")

        archive_gz_sha = assets[archive_gz_name]
        binding_sha = assets[binding_name]
        digest_re = re.compile(r"[0-9a-f]{64}")
        for name, digest in ((archive_gz_name, archive_gz_sha), (binding_name, binding_sha)):
            if not isinstance(digest, str) or not digest_re.fullmatch(digest):
                raise SystemExit(f"{name}: digest is not 64 lowercase hex")
        for value in (archive_gz_name, binding_name, archive_gz_sha, binding_sha):
            if "\n" in value or "\r" in value:
                raise SystemExit(".cargo/rusty-v8-digests.toml contains a newline in a shell-exported field")

        archive_name = archive_gz_name[:-3]
        print(f"ARCHIVE_GZ_NAME={archive_gz_name}")
        print(f"BINDING_NAME={binding_name}")
        print(f"ARCHIVE_GZ_SHA={archive_gz_sha}")
        print(f"BINDING_SHA={binding_sha}")
        print(f"ARCHIVE_GZ_PATH={mirror_dir / archive_gz_name}")
        print(f"ARCHIVE_PATH={mirror_dir / archive_name}")
        print(f"BINDING_PATH={mirror_dir / binding_name}")
        PY
        # shellcheck disable=SC1090
        source "${RUNNER_TEMP}/prebuilt-v8-payload.env"

        verify_downloaded_assets() {
          python3 - "${ARCHIVE_GZ_PATH}" "${ARCHIVE_GZ_SHA}" "${BINDING_PATH}" "${BINDING_SHA}" <<'PY'
        import hashlib
        import sys
        from pathlib import Path

        archive_gz_path = Path(sys.argv[1])
        archive_gz_sha = sys.argv[2]
        binding_path = Path(sys.argv[3])
        binding_sha = sys.argv[4]

        def digest(path: Path) -> str:
            h = hashlib.sha256()
            with open(path, "rb") as fh:
                for chunk in iter(lambda: fh.read(1 << 20), b""):
                    h.update(chunk)
            return h.hexdigest()

        for path, expected in ((archive_gz_path, archive_gz_sha), (binding_path, binding_sha)):
            if not path.is_file():
                raise SystemExit(f"missing payload {path}")
            if path.stat().st_size == 0:
                raise SystemExit(f"empty payload {path}")
            actual = digest(path)
            if actual != expected:
                raise SystemExit(f"committed digest mismatch for {path.name}: {actual} != {expected}")
        PY
        }

        if ! verify_downloaded_assets; then
          if [[ "${NIMBUS_PREBUILT_V8_CACHE_HIT}" == "true" ]]; then
            fail "restored rusty_v8 payload cache does not match .cargo/rusty-v8-digests.toml for ${NIMBUS_PREBUILT_V8_RELEASE_REPO}@${NIMBUS_PREBUILT_V8_RELEASE_TAG}/${NIMBUS_PREBUILT_V8_VARIANT}."
          fi
          rm -f \
            "${mirror_dir}/${ARCHIVE_GZ_NAME}" \
            "${mirror_dir}/${ARCHIVE_NAME}" \
            "${mirror_dir}/${BINDING_NAME}"
          gh release download "${NIMBUS_PREBUILT_V8_RELEASE_TAG}" \
            --repo "${NIMBUS_PREBUILT_V8_RELEASE_REPO}" \
            --dir "${mirror_dir}" \
            --clobber \
            --pattern "${ARCHIVE_GZ_NAME}" \
            --pattern "${BINDING_NAME}"
          verify_downloaded_assets
        fi

        rm -f "${ARCHIVE_PATH}.tmp"
        gzip -dc "${ARCHIVE_GZ_PATH}" > "${ARCHIVE_PATH}.tmp"
        test -s "${ARCHIVE_PATH}.tmp"
        mv "${ARCHIVE_PATH}.tmp" "${ARCHIVE_PATH}"

        {
          echo "RUSTY_V8_ARCHIVE=${ARCHIVE_PATH}"
          echo "RUSTY_V8_MIRROR=${mirror_dir}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${BINDING_PATH}"
        } >> "${GITHUB_ENV}"
        {
          echo "archive-path=${ARCHIVE_PATH}"
          echo "binding-path=${BINDING_PATH}"
          echo "mirror-dir=${mirror_dir}"
        } >> "${GITHUB_OUTPUT}"

    - name: Save prebuilt V8 payload cache
      if: inputs.consume-prebuilt-v8 != 'false' && github.ref == 'refs/heads/main' && steps.restore-prebuilt-v8-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/rusty_v8
        key: ${{ steps.restore-prebuilt-v8-cache.outputs.cache-primary-key }}

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        cache-directories: |
          ~/.cargo/.rusty_v8
          ~/.cargo/git/checkouts
        cache-on-failure: "true"
        cache-bin: ${{ inputs.cache-bin }}
        save-if: ${{ inputs.save-cache == 'always' || (inputs.save-cache == 'auto' && github.ref == 'refs/heads/main') }}


    - name: Seed prebuilt V8 into target link-search paths
      if: inputs.consume-prebuilt-v8 != 'false'
      shell: bash
      env:
        NIMBUS_PREBUILT_V8_ARCHIVE_PATH: ${{ steps.consume-prebuilt-v8.outputs.archive-path }}
      run: |
        set -euo pipefail
        # A restored cargo cache can carry a FRESH v8 build-script fingerprint
        # whose recorded -L points at target/<profile>/gn_out/obj while the
        # restored tree lacks the static lib (cache pruning) — the v8 crate
        # then fails with 'could not find native static library rusty_v8'
        # without ever re-running its build script. Seed the verified archive
        # at the exact locations a build-script (re)run would populate; the
        # copy is byte-identical to build.rs's own RUSTY_V8_ARCHIVE copy, so
        # this is idempotent with every other path.
        target_root="${CARGO_TARGET_DIR:-target}"
        for profile_dir in debug ci-archive; do
          obj_dir="${target_root}/${profile_dir}/gn_out/obj"
          mkdir -p "${obj_dir}"
          cp -f "${NIMBUS_PREBUILT_V8_ARCHIVE_PATH}" "${obj_dir}/librusty_v8.a"
        done
        echo "seeded librusty_v8.a into ${target_root}/{debug,ci-archive}/gn_out/obj"
