# Trust anchor for canonical rusty_v8 fork assets. Digests are sha256 of the
# DOWNLOADED release asset (shasum -a 256 <file>). The tag below must equal
# v<RUSTY_V8_VERSION> from .cargo/config.toml (the composite verifies this).
# Pin-bump runbook: dispatch nimbus/rusty_v8's release workflow (or push the
# fork tag; assets are bot-published), then update tag + digests here in the
# same pin PR.
[release]
repo = "nimbus/rusty_v8"
tag = "v150.4.0-nimbus.2"
# The fork commit this tag must resolve to (moved-tag guard): the composite
# fails unless Cargo.lock's v8 package source is exactly
# git+https://github.com/<repo>?tag=<tag>#<commit>.
commit = "a90dfd667605057d648521e36791ef65eb275a9d"

[assets]
