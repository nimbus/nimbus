# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

[traversal-excludes]
# Keep architecture-invariant crates out of Hakari dependency management:
# nimbus-core remains zero-I/O, nimbus-runtime must have zero workspace
# dependencies, the nimbus facade should not grow a workspace-hack edge in its
# public embedder surface, and nimbus-storage's provider feature gates must not
# be defeated by workspace feature unification -- a workspace-hack edge would
# pull the HTTP/TLS transport stack back into a `--no-default-features` build
# and silently undo the `postgres`/`mysql`/`libsql` opt-in.
#
# `nimbus-crypto` is listed for the storage reason, not one of its own: it is
# the only other workspace crate beneath `nimbus-storage`, so a workspace-hack
# edge on it reaches storage transitively and reintroduces `hyper`, `reqwest`
# and `tower-service` into a provider-free build. Excluding storage alone is
# not sufficient; the exclusion has to cover everything below the gate.
workspace-members = [
    "nimbus-core",
    "nimbus-crypto",
    "nimbus-runtime",
    "nimbus",
    "nimbus-storage",
]
