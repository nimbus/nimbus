nextest-version = { required = "0.9.138" }

[test-groups]
serial-fixed-port = { max-threads = 1 }
external-provider = { max-threads = 1 }
harness-corpus = { max-threads = 1 }
runtime-v8-global = { max-threads = 1 }

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "45s", terminate-after = 3 }
# A loaded workspace can delay the test process exit after libtest reports its
# result. Allow that bounded exit window, but fail the gate if captured output
# handles remain open after it.
leak-timeout = { period = "5s", result = "fail" }

[[profile.default.overrides]]
filter = 'test(/listener_rejects_non_loopback_bind/)'
test-group = 'serial-fixed-port'

[[profile.default.overrides]]
filter = 'test(/^(tests::)?(postgres|mysql|libsql)_/) or test(/^(tests::)?(postgres_provider|mysql_provider|libsql_replica_provider)::/)'
test-group = 'external-provider'

[[profile.default.overrides]]
filter = 'test(/verification_harness_(required|nightly)_/)'
test-group = 'harness-corpus'
slow-timeout = { period = "15m", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(nimbus-runtime) and test(/backends::v8::|runtime::tests::pool_reuse::isol_|runtime::tests::verification_harness::|runtime::tests::snapshot_lifecycle::|runtime::tests::warm_pool::/)'
test-group = 'runtime-v8-global'

# This test enforces wall-clock budgets for embedded storage operations. Give
# it the runner while it measures so unrelated CPU and I/O load cannot decide
# whether the regression gate passes.
[[profile.default.overrides]]
filter = 'package(nimbus-storage) and test(redb_storage_engine_quality_performance_budget_covers_latest_historical_cdc_pitr_and_gc)'
threads-required = "num-test-threads"

# These tests measure bounded failure and lock ordering with real wall-clock
# deadlines. Give each the runner so unrelated workspace load cannot consume
# its deadline or delay the in-process PEP shutdown beyond Nextest's leak gate.
[[profile.default.overrides]]
filter = 'test(exact_guest_teardown_accept_fails_within_its_deadline_when_a_call_is_missing) or test(krun_network_inspect_is_byte_stable_and_cannot_cross_older_execute)'
threads-required = "num-test-threads"

# These matrices launch synchronized child-process fleets. Each test also
# recovers durable state. Run each without unrelated workspace load so its
# semantic checkpoint bounds remain meaningful.
[[profile.default.overrides]]
filter = 'test(/fresh_process_network_teardown_(?:container|krun)_recovers_every_durable_checkpoint|fresh_process_(?:container|krun)_network_contenders_publish_one_result_per_operation|fresh_process_reopens_engine_and_plans_every_workload_saga_phase_without_snapshot_handoff|fresh_process_restart_reopens_engine/)'
threads-required = "num-test-threads"

[profile.ci-pr]
inherits = "default"
# BEGIN GENERATED: test-taxonomy exclusions
default-filter = 'all()'
# END GENERATED: test-taxonomy exclusions

[profile.ci-nightly]
inherits = "default"
retries = { backoff = "fixed", count = 2, delay = "1s" }
flaky-result = "fail"

[profile.ci-nightly.junit]
# Flake detection reads only JUnit <flakyFailure>/<flakyError> elements.
# These elements are the documented stable markers for a failed first attempt
# that passes on retry. The libtest JSON flaky fields are experimental.
path = "junit.xml"

[profile.ci-runtime]
inherits = "default"
default-filter = 'package(nimbus-runtime) and not test(/runtime::tests::node_compat::/) and not test(/runtime::tests::pool_reuse::isol_/)'

[profile.ci-harness-required]
inherits = "default"
default-filter = 'test(/verification_harness_required_generated_history_seed_corpus_matches_model/) or test(/verification_harness_required_transport_liveness_campaigns/) or test(/verification_harness_required_runtime_liveness_and_integrity_cases/)'
slow-timeout = { period = "15m", terminate-after = 2 }

[profile.ci-harness-nightly]
inherits = "default"
default-filter = 'test(/verification_harness_nightly_generated_history_seed_corpus_matches_model/) or test(/verification_harness_nightly_transport_liveness_campaigns/) or test(/verification_harness_nightly_runtime_liveness_and_integrity_cases/)'
slow-timeout = { period = "20m", terminate-after = 2 }

[profile.ci-ppsc-seed-farm]
inherits = "default"
default-filter = 'package(nimbus-engine) and test(/^tests::ppsc::seed_farm::ppsc_seed_farm_executes_selected_redb_scenarios$/)'
slow-timeout = { period = "30m", terminate-after = 1 }

[profile.coverage]
inherits = "default"
# LLVM instrumentation makes coverage binaries slower than default binaries.
# The default profile uses a 45-second bound. Keep the same termination count,
# but allow 180 seconds for instrumentation. This profile still terminates a
# test that does not make progress.
slow-timeout = { period = "180s", terminate-after = 3 }
