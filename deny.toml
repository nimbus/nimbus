# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# zbus_systemd is pinned exact at `=0.26000.0` in Cargo.toml: its version
# tracks the systemd D-Bus interface revision it was generated against
# (0.26000.x == systemd 260), not semver, so it intentionally sits still for
# long stretches between bumps. It needs no [bans] carve-out below — the
# zbus/zvariant subtree it pulls adds no duplicate-version entries and its
# licenses are all MIT/Apache (already in the allow list).

[graph]
all-features = true

[advisories]
# Lint level for crates that have been marked as unmaintained
unmaintained = "workspace"
# Lint level for crates with unsound API
unsound = "all"
# Lint level for crates that have been yanked.
yanked = "warn"
ignore = [
  # Requires `rand`'s `log` + `thread_rng` features plus a custom `log` logger
  # path. The remaining transitive `rand 0.8.5` lane in this workspace does
  # not enable `log`, and Nimbus uses `tracing_subscriber`.
  { id = "RUSTSEC-2026-0097", reason = "deno_crypto and other crates in the current nimbus/deno fork tag pin rand =0.8.5. This advisory requires rand log + thread_rng features and a custom log::Log path. Nimbus does not enable rand log and uses tracing_subscriber. Re-check 2026-10-23." },
  { id = "RUSTSEC-2023-0071", reason = "deno_crypto and deno_node_crypto carry rsa 0.9.10, which has no safe fixed release. Exposure is limited to user-authored Deno/Node crypto operations. Keep the audit visible until upstream replaces the implementation. Re-check 2026-10-23." },
  { id = "RUSTSEC-2026-0118", reason = "deno_net in the current nimbus/deno fork tag requires hickory-proto ^0.25.2. hickory-resolver 0.25.2 also requires hickory-proto ^0.25. Keep visible until the Deno fork moves DNSSEC validation off the affected 0.25 API. Re-check 2026-10-23." },
  { id = "RUSTSEC-2026-0119", reason = "deno_net in the current nimbus/deno fork tag requires hickory-proto ^0.25.2. hickory-resolver 0.25.2 also requires hickory-proto ^0.25. These requirements exclude the fixed hickory-proto >=0.26.1 release. Re-check 2026-10-23." },
  { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.40 TLS 1.3 handshake-level check (fixed in 0.23.45). deno_tls in the pinned nimbus/deno tag and upstream Deno main pin rustls =0.23.40, so this workspace cannot move it. Remove when the Deno fork carries rustls >=0.23.45 (tracked for the next v2.9.7-nimbus tag, 2026-10-01). Re-check 2026-10-23." },
  { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch 0.9.20 (the advisory's fix release) deterministically SIGABRTs the nimbus-server test binary on macOS (libc++ hardening: vector[] OOB; A/B/A-bisected 2026-07-08), so we hold 0.9.18 — banned below. The advisory itself is unsound fmt::Pointer/Display of invalid Atomic/Shared pointers, which no Nimbus path formats. Revisit on crossbeam-epoch >0.9.20. Re-check 2026-10-09." },
]

[licenses]
version = 2
# Confidence threshold for license detection
confidence-threshold = 0.8
exceptions = [
  { crate = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
  { crate = "winx", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
# Workspace crates use the Nimbus Community License (custom, not SPDX)
private = { ignore = true }
# All licenses are denied unless explicitly in the allow list
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "libuv-sys-lite"
version = "1.48.3"
expression = "MIT AND BSD-2-Clause AND ISC"
license-files = [{ path = "LICENSE", hash = 0xc2efc575 }]

[bans]
# Keep duplicate detection active for enterprise-trust visibility. The current
# workspace still contains a handful of intentional parallel upstream stacks,
# so we carve those out explicitly below instead of globally allowing all
# duplicate versions.
multiple-versions = "deny"
wildcards = "allow"
deny = [
    # 0.9.20 (published 2026-07-08 as the RUSTSEC-2026-0204 fix) deterministically
    # SIGABRTs the nimbus-server test binary on macOS (libc++ hardening assertion:
    # vector[] index out of bounds; isolated by A/B/A lockfile bisect with
    # serial_test held constant). Enforce the 0.9.18 hold so a routine
    # `cargo update` cannot silently re-bump it; the advisory is ignored with
    # justification in [advisories] above. Lift both when a later release lands
    # clean against the full nimbus-server suite.
    { crate = "crossbeam-epoch:>0.9.18, <0.10", reason = "Versions newer than the validated 0.9.18 hold are not approved; 0.9.20 aborts the nimbus-server test binary on macOS (see RUSTSEC-2026-0204 ignore)." },
]
skip = [
    { crate = "base16ct@1.0.0", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "bindgen@0.70.1", reason = "Deno N-API's libuv binding build uses bindgen 0.70 while the Deno Node nghttp2 build uses bindgen 0.71." },
    { crate = "blake2@0.10.6", reason = "The pinned Deno Node crypto stack still carries blake2 0.10 while Deno argon2 has moved to the RustCrypto 0.11 prerelease lane." },
    { crate = "blake2@0.11.0-rc.6", reason = "Deno crypto carries the Argon2 prerelease blake2 lane alongside deno_node_crypto's stable blake2 lane." },
    { crate = "brotli@3.5.0", reason = "Pingora 0.9.0's HTTP compression support carries brotli 3 alongside the existing Deno brotli 6 and async-compression brotli 8 lanes." },
    { crate = "brotli@6.0.0", reason = "The pinned Deno HTTP/web stack carries brotli 6 while async-compression carries brotli 8." },
    { crate = "brotli-decompressor@2.5.1", reason = "Pingora 0.9.0's brotli 3 lane carries brotli-decompressor 2 alongside the existing Deno and async-compression decompressor lanes." },
    { crate = "brotli-decompressor@4.0.3", reason = "The pinned Deno HTTP/web stack carries brotli-decompressor 4 while async-compression carries brotli-decompressor 5." },
    { crate = "compact_str@0.7.1", reason = "The pinned Deno SWC codegen stack carries compact_str 0.7 while the OXC code-index stack carries compact_str 0.9." },
    { crate = "crypto-bigint@0.7.5", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "der@0.8.2", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "elliptic-curve@0.14.0-rc.28", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "fixedbitset@0.4.2", reason = "Wasmtime wasm-compose carries petgraph 0.6/fixedbitset 0.4 while daggy (Pingora-core 0.9.0) and prost-build 0.14 carry fixedbitset 0.5." },
    { crate = "hashbrown@0.12.3", reason = "Pingora-cache 0.9.0 carries indexmap 1.9/hashbrown 0.12 alongside the workspace's newer hashbrown lanes." },
    { crate = "hashbrown@0.14.5", reason = "dashmap 5 (Deno resolver, Pingora-pool 0.9.0), SWC, and rowan carry hashbrown 0.14 alongside the workspace's newer hashbrown lanes." },
    { crate = "hashbrown@0.15.5", reason = "The pinned rusqlite/imara-diff lanes still carry hashbrown 0.15 while indexmap and OXC carry newer hashbrown lanes." },
    { crate = "hashbrown@0.17.1", reason = "The OXC code-index stack carries hashbrown 0.17 while the broader indexmap stack carries hashbrown 0.16." },
    { crate = "io-lifetimes@2.0.4", reason = "cap-std 4.0.2 pulls fs-set-times on io-lifetimes 2 while cap-std/io-extras use io-lifetimes 3; keep the duplicate visible until cap-std aligns upstream." },
    { crate = "keccak@0.2.0", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "itertools@0.12.1", reason = "The Deno v2.9.x line spreads transitive itertools across 0.12-0.15 lanes; collapse as upstreams converge." },
    { crate = "itertools@0.13.0", reason = "The Deno v2.9.x line spreads transitive itertools across 0.12-0.15 lanes; collapse as upstreams converge." },
    { crate = "itertools@0.14.0", reason = "The Deno v2.9.x line spreads transitive itertools across 0.12-0.15 lanes; collapse as upstreams converge." },
    { crate = "nom@7.1.3", reason = "s3s 0.17 uses nom 8 while pinned Deno support crates still carry nom 7." },
    { crate = "nix@0.30.1", reason = "The pinned Deno filesystem and permission stack still carries nix 0.30 while newer workspace stacks use nix 0.31." },
    { crate = "object@0.36.7", reason = "The pinned Deno N-API stack carries object 0.36 while the SWC/stacker support lane carries object 0.37." },
    { crate = "object@0.39.1", reason = "Wasmtime JIT/unwinder support carries object 0.39 while the SWC/stacker support lane carries object 0.37." },
    { crate = "petgraph@0.6.5", reason = "Wasmtime wasm-compose pins petgraph 0.6 while daggy (Pingora-core 0.9.0) carries petgraph 0.7 and prost-build 0.14 carries petgraph 0.8." },
    { crate = "petgraph@0.7.1", reason = "2026-10-01: daggy 0.8.1 (Pingora-core 0.9.0) pins petgraph 0.7 while prost-build 0.14 (tonic-prost-build) carries petgraph 0.8." },
    { crate = "pkcs8@0.11.0-rc.11", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "quick-xml@0.41.0", reason = "object_store 0.14.2 requires quick-xml 0.41 while s3s 0.17 requires quick-xml 0.42; both lanes meet the RUSTSEC-2026-0194 floor." },
    { crate = "redox_users@0.4.6", reason = "Wasmtime internal cache's directories-next stack uses redox_users 0.4 while rust-embed's dirs stack uses redox_users 0.5." },
    { crate = "sec1@0.8.1", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "sha3@0.11.0", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "spki@0.8.0", reason = "Deno crypto currently carries ed448-goldilocks on the RustCrypto 0.14 prerelease lane alongside the stable RustCrypto 0.13 lane." },
    { crate = "wasm-encoder@0.260.0", reason = "Wasmtime component tooling carries wasm-encoder 0.254 directly and wat/wast 0.260 transitively." },
    { crate = "webpki-roots@1.0.8", reason = "Nimbus-proxy's K11P upstream TLS verifier uses current webpki-roots while the pinned Deno TLS stack still carries webpki-roots 0.26." },
    { crate = "toml@0.9.12+spec-1.1.0", reason = "2026-10-01: wasmtime-internal-cache 48.0.3 pins toml 0.9 while the workspace TOML users moved to toml 1.1." },
    { crate = "which@6.0.3", reason = "The rusty_v8 build stack carries which 6 while the current Deno permission stack uses which 8." },
    { crate = "winnow@0.6.26", reason = "The pinned Deno resolver YAML parser still carries winnow 0.6 while the workspace TOML parser uses winnow 0.7." },
    { crate = "yasna@0.6.0", reason = "Rcgen 0.14 for K11P leaf/CA certificate generation carries yasna 0.6 alongside the pinned Deno Node crypto yasna 0.5 lane." },
]
skip-tree = [
    { crate = "aws-config@1.8.16", reason = "AWS SDK transport crates intentionally carry a parallel HTTP and crypto stack." },
    { crate = "oci-client@0.16.1", reason = "OCI registry interactions currently pin their own reqwest/rustls lane." },
    { crate = "libsql@0.9.30", reason = "libsql remote support currently carries an independent HTTP and prost lane." },
    { crate = "mysql_async@0.37.1", reason = "The MySQL provider stack carries distinct protocol and crypto support crates." },
    { crate = "tokio-postgres@0.7.18", reason = "The Postgres provider stack carries a distinct protocol and crypto support lane." },
    { crate = "bson@3.1.0", reason = "The MongoDB adapter stack currently carries its own BSON/rand support lane." },
    { crate = "deno_core@0.412.0", reason = "The embedded V8 runtime stack carries its own support-ecosystem crates." },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
  "https://github.com/nimbus/deno",
  "https://github.com/nimbus/rusty_v8",
  # DynamoDB adapter: extenddb-core (Apache-2.0) consumed by nimbus-dynamodb via
  # a pinned git rev. See docs/private/plans/archive/dynamodb-adapter-plan.md (Upstream Crate Reuse).
  "https://github.com/ExtendDB/extenddb",
]
