[workspace]
members = [
    "crates/nimbus",
    "crates/nimbus-adapters",
    "crates/nimbus-artifacts",
    "crates/nimbus-assets",
    "crates/nimbus-auth",
    "crates/nimbus-bin",
    "crates/nimbus-bridge",
    "crates/nimbus-cloud-functions",
    "crates/nimbus-convex",
    "crates/nimbus-dynamodb",
    "crates/nimbus-firebase",
    "crates/nimbus-license",
    "crates/nimbus-machine",
    "crates/nimbus-mongodb",
    "crates/nimbus-node",
    "crates/nimbus-operator",
    "crates/nimbus-provenance",
    "crates/nimbus-services",
    "crates/nimbus-system",
    "crates/nimbus-tenant",
    "crates/nimbus-runtime",
    "crates/nimbus-sandbox",
    "crates/nimbus-core",
    "crates/nimbus-engine",
    "crates/nimbus-server",
    "crates/nimbus-storage",
    "crates/nimbus-testing",
]
resolver = "2"

[workspace.package]
version = "0.1.33"
edition = "2024"
publish = false
repository = "https://github.com/nimbus/nimbus"
license-file = "LICENSE"

[workspace.lints.rust]
unused = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
aes-gcm-siv = "0.11"
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-sdk-kms = { version = "1.105.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
# Official AWS Rust SDK for DynamoDB — dev-only, used by the dynamodb_spec
# parity runner to prove every operation through an official SDK client against
# an endpoint override. Same HTTP/runtime feature flags as aws-sdk-kms so it
# reuses the already-vetted aws-smithy/hyper/aws-lc stack (no new dup versions).
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# Official DynamoDB Streams SDK — dev-only, drives the streams data-plane parity
# proof (DescribeStream/GetShardIterator/GetRecords/ListStreams) against the
# same in-process listener. Same feature flags as aws-sdk-dynamodb.
aws-sdk-dynamodbstreams = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bson = { version = "3.1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
deadpool-postgres = "0.14"
deno_ast = { version = "=0.53.2", features = ["transpiling"] }
deno_core = { version = "0.403.0", features = ["unsafe_use_unprotected_platform"] }
deno_crypto = "0.264.0"
deno_error = "=0.7.1"
deno_fetch = "0.274.0"
deno_fs = { version = "0.160.0", features = ["sync_fs"] }
deno_http = "0.248.0"
deno_io = "0.160.0"
deno_napi = "0.181.0"
deno_net = "0.242.0"
deno_node = { version = "0.188.0", default-features = false, features = ["sync_fs"] }
deno_node_sqlite = "0.20.0"
deno_node_crypto = "0.20.0"
deno_os = "0.67.0"
deno_package_json = "0.52.0"
deno_permissions = "0.109.0"
deno_process = "0.65.0"
deno_resolver = { version = "=0.81.0", features = ["deno_ast", "sync"] }
deno_semver = "=0.10.0"
deno_telemetry = "0.72.0"
deno_tls = "0.237.0"
deno_web = "0.281.0"
deno_webidl = "0.250.0"
deno_websocket = "0.255.0"
node_resolver = { version = "0.88.0", features = ["sync"] }
crc32c = "0.6"
crc32fast = "1"
extenddb-core = { git = "https://github.com/ExtendDB/extenddb", rev = "0448ca066c86bddf2eb465092b8b6854923665ee" }
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
indicatif = "0.18"
hyper = "0.14.32"
http = "1"
signal-hook-registry = "1"
libsql = { version = "0.9.30", default-features = false, features = ["remote"] }
libc = "0.2"
libloading = "0.8"
mysql_async = "0.36"
native-tls = { version = "0.2", features = ["vendored"] }
parking_lot = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
redb = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls-vendored"] }
ring = "0.17"
rmp = "0.8"
rmp-serde = "1"
# Keep the bundled SQLCipher lane self-contained on Windows release builds:
# upstream `bundled-sqlcipher` requires OPENSSL_DIR there unless we also opt
# into vendored OpenSSL, which would otherwise make the GitHub runner
# environment part of the release contract. Nimbus also consumes the
# `node:sqlite` surface via `deno_node_sqlite`, so keep the broader Deno
# runtime feature set enabled on the shared workspace dependency.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "unlock_notify", "session", "modern_sqlite", "limits", "backup"] }
serial_test = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
shell-words = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
testcontainers-modules = "0.15"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.28"
tower-service = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
time = "0.3"
toml = "0.9"
twox-hash = "2"
ulid = { version = "1", features = ["serde"] }
sys_traits = "0.1.28"
url = "2"
v8 = "149.0.0"
# Direct zbus is required for the session/system test-bus utilities and any
# hand-rolled `#[proxy]` escape hatch; pin the latest 5.x (the line
# `zbus_systemd 0.26000.0` selects via its own `zbus = "5.3"` floor) so the
# generated bindings and our direct usage share one resolved crate.
# `zbus-async-tokio` on `zbus_systemd` enables `zbus/tokio`, so the async
# runtime feature is unified across both.
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
# Pinned exact: zbus_systemd's version tracks the systemd interface revision it
# was generated against (0.26000.x == systemd 260). Bump deliberately on an LTS
# systemd, an upstream patch, or an advisory. See deny.toml and
# docs/private/plans/research/systemd-dbus-binding-rust-2026.md.
zbus_systemd = { version = "=0.26000.0", default-features = false, features = ["systemd1", "zbus-async-tokio"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# ── Nimbus fork overrides ────────────────────────────────────────────
# Keep the public dependency surface aligned with upstream crate versions while
# selecting the fork implementation immutably at the workspace root.
[patch.crates-io]
deno_core = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_crypto = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_crypto_provider = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_dotenv = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_features = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_fetch = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_fs = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_http = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_inspector_server = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_io = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_maybe_sync = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_napi = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_net = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_node = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_node_crypto = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_node_sqlite = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_ops = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_os = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_package_json = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_permissions = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_process = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_resolver = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_signals = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_subprocess_windows = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_telemetry = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_tls = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_web = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_webidl = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
deno_websocket = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
node_resolver = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
node_shim = { git = "https://github.com/nimbus/deno", tag = "v2.8.2-nimbus.33" }
