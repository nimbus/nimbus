[package]
name = "nimbus-engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gates test-only surface (`#[cfg(any(test, feature = "test-hooks"))]` in
# tenant/mutation, engine/queries, engine/subscriptions) that integration
# tests in other crates need to reach. Every workspace consumer enables it
# only under [dev-dependencies] (see nimbus-mongodb, nimbus-firebase,
# nimbus-server), never under [dependencies], so a plain `cargo build
# --release -p nimbus-bin` never activates it: Cargo only compiles a crate's
# dev-dependencies (and their features) when building that crate's own
# tests/benches, not when the crate is used as a library by another crate's
# release build (DS4).
test-hooks = []
aws-kms = ["nimbus-crypto/aws-kms", "nimbus-storage/aws-kms"]

[dependencies]
arc-swap.workspace = true
base64.workspace = true
futures.workspace = true
nimbus-core = { path = "../nimbus-core" }
nimbus-crypto = { path = "../nimbus-crypto" }
nimbus-storage = { path = "../nimbus-storage" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
hkdf.workspace = true
imbl.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
hyper.workspace = true
libsql.workspace = true
loom = "0.7"
mysql_async.workspace = true
nimbus-testing = { path = "../nimbus-testing" }
proptest = "1"
serial_test.workspace = true
tempfile.workspace = true
testcontainers-modules = { workspace = true, features = ["blocking", "mysql", "postgres"] }

[[bench]]
name = "embedded-provider-benchmarks"
harness = false

[[bench]]
name = "concurrent-write-throughput"
harness = false

[[bench]]
name = "postgres-provider-benchmarks"
harness = false

[[bench]]
name = "mysql-provider-benchmarks"
harness = false

[[bench]]
name = "libsql-replica-provider-benchmarks"
harness = false

[[bench]]
name = "materialized-surface-evaluation"
harness = false
