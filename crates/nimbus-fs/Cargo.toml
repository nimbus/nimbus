[package]
name = "nimbus-fs"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Scaffolding only: no code in this crate is gated on `fuse` yet (no
# `cfg(feature = "fuse")` sites), no CI workflow builds or tests it, and it
# does not compile on a machine without libfuse/pkg-config installed
# (`fuser`'s build.rs shells out to `pkg-config --libs --cflags fuse`). Wires
# the optional `fuser` dependency ahead of a real host-FUSE backend; treat as
# dormant, not dead, until that backend lands (DS4).
fuse = ["dep:fuser"]

[dependencies]
nimbus-blob = { path = "../nimbus-blob" }
nimbus-core = { path = "../nimbus-core" }
nimbus-runtime = { path = "../nimbus-runtime" }
nimbus-storage = { path = "../nimbus-storage" }
async-trait.workspace = true
bytes.workspace = true
cap-std = "4.0.2"
deno_core.workspace = true
deno_fs.workspace = true
deno_io.workspace = true
deno_permissions.workspace = true
fuser = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
deno_subprocess_windows.workspace = true

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
