[package]
name = "nimbus-cloudflare"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

# Cloudflare-compatible logic without transport: wrangler bindings, Workers KV
# policy, the Worker KV host bridge, and the Durable Object substrate.
# nimbus-server owns the KV REST router.
[dependencies]
base64.workspace = true
nimbus-core = { path = "../nimbus-core" }
nimbus-dynamodb = { path = "../nimbus-dynamodb" }
nimbus-engine = { path = "../nimbus-engine", default-features = false }
nimbus-runtime = { path = "../nimbus-runtime" }
nimbus-services = { path = "../nimbus-services" }
nimbus-storage = { path = "../nimbus-storage", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
nimbus-testing = { path = "../nimbus-testing", default-features = false }
tempfile.workspace = true
