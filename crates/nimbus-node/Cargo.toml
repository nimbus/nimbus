[package]
name = "nimbus-node"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
nimbus-core = { path = "../nimbus-core" }
nimbus-tenant = { path = "../nimbus-tenant" }
serde.workspace = true
sha2.workspace = true
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, optional = true }
zbus_systemd = { workspace = true, optional = true }

[features]
# NDB7: `systemd-dbus` is ON by default so the live binding compiles in
# production builds and `SystemdTransientUnitBackend::linux_systemd_default()`
# is available without opt-in. On Linux the default backend is the live
# `ZbusSystemdClient`; other platforms keep the fail-closed
# `UnavailableSystemdDbusClient` path.
#
# `systemd-dbus` pulls the live zbus binding deps. `systemd-dbus-test-bus`
# layers the in-process test-bus shapes used by the classifier/property unit
# tests. `systemd-dbus-integration-tests` is the explicit opt-in that NDB5's
# Linux-gated `systemctl --user` tests require — it never turns on implicitly.
default = ["systemd-dbus"]
systemd-dbus = ["dep:zbus", "dep:zbus_systemd", "dep:futures", "dep:tokio"]
systemd-dbus-test-bus = ["systemd-dbus"]
systemd-dbus-integration-tests = ["systemd-dbus"]

[dev-dependencies]
nimbus-runtime = { path = "../nimbus-runtime" }
nimbus-sandbox = { path = "../nimbus-sandbox" }
serde_json.workspace = true
tokio.workspace = true
