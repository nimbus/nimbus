[package]
name = "nimbus-sandbox-host"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gates deterministic cross-crate fixture construction. The feature is used
# only by upper-crate dev-dependencies and adds no production provider path.
test-hooks = ["nimbus-sandbox/test-hooks"]

[dependencies]
cap-std = "4.0.2"
flate2 = "1"
libc.workspace = true
nimbus-core = { path = "../nimbus-core" }
nimbus-durable-record = { path = "../nimbus-durable-record" }
nimbus-egress = { path = "../nimbus-egress" }
nimbus-network = { path = "../nimbus-network" }
nimbus-proxy = { path = "../nimbus-proxy" }
nimbus-sandbox = { path = "../nimbus-sandbox" }
oci-client = "0.16"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
tar = "0.4"
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
zstd = "0.13"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
nimbus-process-harness = { path = "../nimbus-process-harness" }
nimbus-sandbox = { path = "../nimbus-sandbox", features = ["test-hooks"] }
proptest = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
