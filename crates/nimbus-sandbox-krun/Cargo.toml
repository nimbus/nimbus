[package]
name = "nimbus-sandbox-krun"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gates deterministic cross-crate fixture construction. The feature is used
# only by upper-crate dev-dependencies and adds no production provider path.
test-hooks = ["nimbus-sandbox/test-hooks", "nimbus-sandbox-container/test-hooks"]

[dependencies]
nimbus-core = { path = "../nimbus-core" }
nimbus-durable-record = { path = "../nimbus-durable-record" }
nimbus-egress = { path = "../nimbus-egress" }
nimbus-network = { path = "../nimbus-network" }
nimbus-sandbox = { path = "../nimbus-sandbox" }
nimbus-sandbox-container = { path = "../nimbus-sandbox-container" }
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
flate2 = "1"
futures.workspace = true
libc.workspace = true
nimbus-process-harness = { path = "../nimbus-process-harness" }
nimbus-proxy = { path = "../nimbus-proxy" }
nimbus-sandbox = { path = "../nimbus-sandbox", features = ["test-hooks"] }
nimbus-sandbox-container = { path = "../nimbus-sandbox-container", features = ["test-hooks"] }
sha2.workspace = true
tar = "0.4"
tempfile.workspace = true
