[package]
name = "nimbus-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
bun-jsc-linked-adapter = ["nimbus-runtime/bun-jsc-linked-adapter"]
# Build the V8 runtime under the single pointer-compression cage, exactly as release binaries ship.
# Lets server-level tests exercise the cross-profile cage (NodeFull anchor + WebStandard workload)
# and the embedded-snapshot anchor on the real serving path.
v8-pointer-compression = ["nimbus-runtime/v8-pointer-compression"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bson.workspace = true
bytes.workspace = true
crc32c.workspace = true
nimbus-artifacts = { path = "../nimbus-artifacts" }
nimbus-assets = { path = "../nimbus-assets", features = ["ui"] }
nimbus-auth = { path = "../nimbus-auth" }
nimbus-blob = { path = "../nimbus-blob" }
nimbus-bridge = { path = "../nimbus-bridge" }
nimbus-cloud-functions = { path = "../nimbus-cloud-functions" }
nimbus-code-index = { path = "../nimbus-code-index" }
nimbus-convex = { path = "../nimbus-convex" }
nimbus-dynamodb = { path = "../nimbus-dynamodb" }
nimbus-egress = { path = "../nimbus-egress" }
nimbus-license = { path = "../nimbus-license" }
nimbus-mongodb = { path = "../nimbus-mongodb" }
nimbus-provenance = { path = "../nimbus-provenance" }
nimbus-runtime = { path = "../nimbus-runtime" }
nimbus-s3 = { path = "../nimbus-s3" }
nimbus-sandbox = { path = "../nimbus-sandbox" }
nimbus-services = { path = "../nimbus-services" }
nimbus-storage = { path = "../nimbus-storage" }
nimbus-machine = { path = "../nimbus-machine" }
nimbus-node = { path = "../nimbus-node" }
nimbus-object-storage = { path = "../nimbus-object-storage" }
nimbus-operator = { path = "../nimbus-operator" }
nimbus-system = { path = "../nimbus-system" }
nimbus-tenant = { path = "../nimbus-tenant" }
nimbus-core = { path = "../nimbus-core" }
nimbus-engine = { path = "../nimbus-engine" }
nimbus-firebase = { path = "../nimbus-firebase" }
nimbus-fs = { path = "../nimbus-fs" }
futures.workspace = true
fs2.workspace = true
hmac.workspace = true
http.workspace = true
libc.workspace = true
pbkdf2.workspace = true
prost = "0.13.1"
prost-types = "0.13.1"
reqwest.workspace = true
ring.workspace = true
s3s.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
toml.workspace = true
tonic = "0.13.0"
tonic-web = "0.13.0"
tower = "0.5"
# TLS termination for the main HTTP listener (LR8). Versions match the
# already-locked transitive stack (rustls 0.23 via tokio-rustls 0.26).
# ring, not aws-lc: the AWS SDK stack already links aws-lc, and the
# vendored-OpenSSL test binaries cannot tolerate a second crypto archive
# carrying the same assembly symbols (lld drops one copy ->
# `undefined symbol: bn_sqrx8x_internal`). ring is already in the graph.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower-http.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Official AWS Rust SDK — drives the dynamodb_spec parity runner against an
# in-process listener via endpoint override (dev/test only; not shipped).
aws-credential-types = "1.2.14"
aws-sdk-dynamodb = { workspace = true }
aws-sdk-dynamodbstreams = { workspace = true }
aws-sigv4 = "=1.4.3"
nimbus-engine = { path = "../nimbus-engine", features = ["test-hooks"] }
nimbus-testing = { path = "../nimbus-testing" }
serde_yaml.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
wiremock = "0.6"
