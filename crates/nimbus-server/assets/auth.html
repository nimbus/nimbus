<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nimbus &middot; Sign in</title>
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/ui/{{ JETBRAINS_MONO_400 }}") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("/ui/{{ JETBRAINS_MONO_500 }}") format("woff2");
}

:root {
  color-scheme: light;
  --color-bg: oklch(96.5% 0.008 248);
  --color-surface: oklch(100% 0 0);
  --color-surface-2: oklch(96% 0.008 248);
  --color-border: oklch(91% 0.013 252);
  --color-border-strong: oklch(82% 0.020 250);
  --color-text: oklch(20% 0.035 263);
  --color-muted: oklch(48% 0.028 255);
  --color-brand: oklch(62% 0.20 258);
  --color-link: oklch(54% 0.22 264);
  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04),
                 0 8px 24px rgba(15, 23, 42, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-bg: oklch(13% 0.026 263);
    --color-surface: oklch(19% 0.030 258);
    --color-surface-2: oklch(24% 0.030 258);
    --color-border: oklch(32% 0.030 258);
    --color-border-strong: oklch(40% 0.030 258);
    --color-text: oklch(91% 0.014 252);
    --color-muted: oklch(67% 0.026 248);
    --color-brand: oklch(72% 0.17 248);
    --color-link: oklch(82% 0.11 247);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4),
                   0 8px 24px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

main {
  width: 100%;
  max-width: 380px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 32px 28px 28px;
  box-shadow: var(--shadow-card);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  display: block;
  color: var(--color-brand);
}

.brand-wordmark {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--color-text);
}

h1 {
  font-size: 20px;
  font-weight: 500;
  line-height: 1.3;
  margin: 0 0 6px;
  color: var(--color-text);
}

.lede {
  color: var(--color-muted);
  font-size: 13px;
  margin: 0 0 20px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-muted);
}

input[type="password"] {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  letter-spacing: 0.01em;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

input[type="password"]:focus {
  border-color: var(--color-brand);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-brand) 22%, transparent);
}

button[type="submit"] {
  margin-top: 6px;
  background: var(--color-brand);
  color: var(--color-surface);
  border: 1px solid var(--color-brand);
  border-radius: 8px;
  padding: 9px 14px;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: filter 120ms ease, box-shadow 120ms ease;
}

button[type="submit"]:hover {
  filter: brightness(1.04);
}

button[type="submit"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-brand) 35%, transparent);
}

.hint {
  margin: 22px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  font-size: 12px;
  color: var(--color-muted);
  line-height: 1.5;
}

.hint code {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 1px 6px;
}

footer {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px;
  color: var(--color-muted);
  letter-spacing: 0.04em;
}

footer .wordmark {
  text-transform: lowercase;
  color: var(--color-text);
}
</style>
</head>
<body>
<main aria-labelledby="auth-title">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20c0-6 4-10 10-10s10 4 10 10" />
      <path d="M8 20c0-3.5 2.7-6 6-6s6 2.5 6 6" />
      <circle cx="14" cy="20" r="2" fill="currentColor" stroke="none" />
    </svg>
    <span class="brand-wordmark">nimbus</span>
  </div>
  <h1 id="auth-title">Sign in</h1>
  <p class="lede">Paste the local admin token to open the operator console.</p>
  <form method="post" action="/ui/auth/session" aria-label="Local admin sign in">
    <label for="local-admin-token">
      <span>Local admin token</span>
      <input id="local-admin-token" type="password" name="token" autocomplete="off" autofocus required spellcheck="false" />
    </label>
    <button type="submit">Continue</button>
  </form>
  <p class="hint">
    Or run <code>nimbus dev --open</code> next time &mdash; the CLI opens the console already signed in.
  </p>
  <footer>
    <span class="wordmark">nimbus</span>
    <span aria-label="Version">v{{ NIMBUS_VERSION }}</span>
  </footer>
</main>
</body>
</html>
