<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nimbus &middot; Sign in</title>
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/ui/{{ JETBRAINS_MONO_400 }}") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("/ui/{{ JETBRAINS_MONO_500 }}") format("woff2");
}

:root {
  color-scheme: light;
  /* Lucide-family copy + check icons. Inlined via mask-image so the glyph
     inherits `currentColor` from the host button — keeps the icon in sync
     with text color, hover state, and data-copied state without re-encoding
     the SVG per theme. Source: lucide.dev (MIT) — `Copy` and `Check`. */
  --icon-copy: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='14' height='14' x='8' y='8' rx='2'/><path d='M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2'/></svg>");
  --icon-check: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>");
  --color-bg: oklch(96.5% 0.008 248);
  --color-surface: oklch(100% 0 0);
  --color-surface-2: oklch(96% 0.008 248);
  --color-border: oklch(91% 0.013 252);
  --color-border-strong: oklch(82% 0.020 250);
  --color-text: oklch(20% 0.035 263);
  --color-muted: oklch(48% 0.028 255);
  --color-link: oklch(54% 0.22 264);
  --color-danger: oklch(54% 0.20 27);
  --color-danger-soft: oklch(96% 0.04 27);
  /* Brand-tier blue. Locked to the Cool Blue primary from DESIGN.md
     §Brand Palette / Two-Tier Bridge; never swaps with operator-console
     palette (mono / warm) because /ui/auth is a first-contact surface. */
  --brand-blue: oklch(62% 0.20 258);
  --brand-blue-soft: oklch(85% 0.10 197);
  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04),
                 0 8px 24px rgba(15, 23, 42, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-bg: oklch(13% 0.026 263);
    --color-surface: oklch(19% 0.030 258);
    --color-surface-2: oklch(24% 0.030 258);
    --color-border: oklch(32% 0.030 258);
    --color-border-strong: oklch(40% 0.030 258);
    --color-text: oklch(91% 0.014 252);
    --color-muted: oklch(67% 0.026 248);
    --color-link: oklch(82% 0.11 247);
    --color-danger: oklch(70% 0.18 24);
    --color-danger-soft: oklch(28% 0.08 24);
    --brand-blue: oklch(72% 0.17 248);
    --brand-blue-soft: oklch(70% 0.13 207);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4),
                   0 8px 24px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

main {
  width: 100%;
  max-width: 380px;
  /* Positioning context for the absolute `.brand-version` chip in the
     upper-right corner. The hero brand block underneath stays centered
     without having to share an axis with the version metadata. */
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 32px 28px 28px;
  box-shadow: var(--shadow-card);
}

/* Hero brand block. Stacked vertically and centered so the cloud mark sits
   above the wordmark as a single identity unit — gives the first-contact
   surface clear brand presence without resorting to marketing-tier
   decoration. The version chip moves out of this row entirely and lives
   in the footer alongside the trust-scope readout. */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.brand-mark {
  width: 52px;
  height: auto;
  aspect-ratio: 322 / 201;
  display: block;
  /* Two-Tier Bridge: brand-tier blue, NOT chrome-tier --color-brand,
     so the mark never swaps with the operator-console palette. The mark
     reads as outline-only — `--logo-fill` stays transparent so the cloud
     body does not flatten into a heavy silhouette next to the wordmark. */
  --logo-stroke: var(--brand-blue);
  --logo-fill: transparent;
  color: var(--brand-blue);
}

.brand-wordmark {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 500;
  font-size: 19px;
  letter-spacing: 0.02em;
  /* Same brand-tier blue as the logo outline so the mark + wordmark read as
     one brand block on this first-contact surface. */
  color: var(--brand-blue);
}

/* Version chip — pinned to the card's upper-right corner. Floats over the
   hero so the centered brand block stays on-axis. Treatment matches the
   pre-hero chip (mono, surface-2 fill, hairline border, muted text) so it
   reads as quiet metadata, not a CTA. Rendered as a button so the value
   is one click from the clipboard; trailing icon stays permanently
   visible (at low opacity) so the affordance is discoverable without
   needing to hover the upper-right corner. */
.brand-version {
  position: absolute;
  top: 16px;
  right: 16px;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--color-muted);
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease;
}

.brand-version:hover {
  border-color: color-mix(in oklch, var(--brand-blue) 45%, var(--color-border));
  color: var(--color-text);
}

.brand-version:focus-visible {
  outline: none;
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

.brand-version[data-copied="true"] {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
}

/* Trailing affordance — kept permanently visible at low opacity so the
   copy gesture is discoverable without having to hover the upper-right
   corner first. Bumps to fuller opacity on hover/focus, swaps to the
   check glyph on success. */
.brand-version::after {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-left: 5px;
  vertical-align: -1px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0.5;
  transition: opacity 120ms ease;
}

.brand-version:hover::after,
.brand-version:focus-visible::after {
  opacity: 0.85;
}

.brand-version[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}

/* Copyable command — interactive sibling of <code>. Click to copy; the
   pseudo-element animates in a check on success. Mirrors the React
   `CopyChip` component from packages/nimbus-ui/src/components/copy-chip.tsx
   so the auth surface honours the DESIGN.md "Copy-to-Clipboard Chip" rule
   for every machine-readable value. */
.copyable {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  font-weight: 400;
  line-height: inherit;
  letter-spacing: 0.01em;
  display: inline-block;
  color: var(--color-text);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 2px 8px;
  margin: 0;
  text-align: left;
  cursor: pointer;
  word-break: break-all;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.copyable:hover {
  border-color: color-mix(in oklch, var(--brand-blue) 55%, var(--color-border));
  color: var(--color-text);
}

.copyable:focus-visible {
  outline: none;
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

.copyable[data-copied="true"] {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
}

/* Trailing copy glyph — 11px lucide mark masked from the button's
   currentColor so it tracks text color, hover, and data-copied transitions
   without a per-state SVG swap. Placed *after* the value because the chip
   IS the value (Pattern B in DESIGN.md §Copy-to-Clipboard Chip terms) —
   trailing matches Stripe, Vercel, Convex, Firebase, and Linear's chip
   conventions and keeps every value left-anchored regardless of length.
   CSP-clean: no inline `<img>`, no external request. */
.copyable::after {
  content: "";
  display: inline-block;
  width: 13px;
  height: 13px;
  margin-left: 6px;
  vertical-align: -2px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0.55;
  transition: opacity 120ms ease;
}

.copyable:hover::after,
.copyable:focus-visible::after {
  opacity: 0.85;
}

.copyable[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}

form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  /* Compensates for the removed h1 spacer — keeps the LOCAL ADMIN TOKEN
     label clear of the wordmark without resurrecting a heading. */
  margin-top: 4px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-muted);
}

input[type="password"] {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px;
  letter-spacing: 0.01em;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

input[type="password"]:focus {
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

input[type="password"][aria-invalid="true"] {
  border-color: var(--color-danger);
}

input[type="password"][aria-invalid="true"]:focus {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-danger) 25%, transparent);
}

.error-message {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 4px;
  padding: 9px 11px;
  background: var(--color-danger-soft);
  border: 1px solid color-mix(in oklch, var(--color-danger) 45%, transparent);
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--color-danger);
}

.error-message .error-icon {
  flex: 0 0 auto;
  margin-top: 1px;
  font-weight: 600;
}

button[type="submit"] {
  margin-top: 6px;
  background: var(--brand-blue);
  color: var(--color-surface);
  border: 1px solid var(--brand-blue);
  border-radius: 8px;
  padding: 11px 14px;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: filter 120ms ease, box-shadow 120ms ease;
}

button[type="submit"]:hover {
  filter: brightness(1.04);
}

button[type="submit"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 35%, transparent);
}

.hint {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  font-size: 14.5px;
  color: var(--color-muted);
  line-height: 1.5;
}

.hint p {
  margin: 0;
  text-align: center;
}

/* The hint surface is itself surface-2, so its embedded copyables pop
   against the page (--color-bg) rather than blending into the panel. */
.hint .copyable {
  background: var(--color-bg);
}

/* M3 — token-file disclosure. Demoted to a collapsed details/summary so
   the recommended `nimbus auth url` path stays the primary CTA. */
.other-ways {
  margin: 14px 0 0;
  font-size: 14px;
  color: var(--color-muted);
}

.other-ways summary {
  cursor: pointer;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-muted);
  outline: none;
  list-style: none;
  padding: 6px 0;
}

.other-ways summary::-webkit-details-marker { display: none; }

.other-ways summary::before {
  content: "›";
  display: inline-block;
  width: 12px;
  margin-right: 2px;
  transition: transform 120ms ease;
  color: var(--color-muted);
}

.other-ways[open] summary::before {
  transform: rotate(90deg);
}

.other-ways summary:focus-visible {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
  border-radius: 4px;
}

.other-ways-body {
  padding: 10px 2px 2px;
  line-height: 1.5;
}

/* Each "Other ways" entry is a section, not a definition-list row. The
   eyebrow title sits *above* its body so the body gets the full card
   width — long token paths fit on one line, and the layout mirrors how
   the LOCAL ADMIN TOKEN label sits above its input. */
.other-section + .other-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--color-border);
}

.other-section-title {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-muted);
  margin: 0 0 8px;
}

.other-section-body {
  margin: 0 0 10px;
  color: var(--color-muted);
}

.other-section-body:last-child {
  margin-bottom: 0;
}

.local-only {
  margin: 20px 0 0;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--color-muted);
  text-align: center;
}

.local-only .dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand-blue);
  margin: 0 6px 1px;
  vertical-align: middle;
}

/* Trust-scope host readout. Inline copy button without chip chrome so it
   sits flush against the "Local-only" prefix; the underline-on-hover is
   the discoverability cue, not a border. Brand-blue + check-icon swap on
   data-copied state mirror the full chip variant. */
.local-host {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  text-decoration: underline dotted color-mix(in oklch, var(--color-muted) 60%, transparent);
  text-underline-offset: 3px;
  transition: color 120ms ease, text-decoration-color 120ms ease;
}

.local-host:hover,
.local-host:focus-visible {
  outline: none;
  color: var(--color-text);
  text-decoration-color: var(--brand-blue);
}

.local-host[data-copied="true"] {
  color: var(--brand-blue);
  text-decoration-color: var(--brand-blue);
}

/* Hover-revealed trailing affordance — same DESIGN.md §923 ghost pattern
   as `.brand-version`. The dotted underline is the always-visible
   "interactive" cue; the icon is the secondary "what kind of action"
   cue, revealed on intent so the trust-scope line reads as a quiet
   footer at rest. */
.local-host::after {
  content: "";
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-left: 5px;
  vertical-align: -1px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0;
  transition: opacity 120ms ease;
}

.local-host:hover::after,
.local-host:focus-visible::after {
  opacity: 0.75;
}

.local-host[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}
</style>
</head>
<body>
<main aria-label="Sign in to Nimbus">
  <button type="button" class="brand-version" data-copy="v{{ NIMBUS_VERSION }}" aria-label="Copy version v{{ NIMBUS_VERSION }}" title="v{{ NIMBUS_VERSION }}">v{{ NIMBUS_VERSION }}</button>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 322 201" role="img" aria-label="Nimbus">
      <title>Nimbus</title>
      <g transform="translate(-30,231) scale(0.1,-0.1)">
        <path fill="var(--logo-fill, transparent)" d="M1447 2194 c-196 -47 -457 -291 -457 -425 0 -16 -8 -19 -45 -19 -155 0 -320 -89 -425 -228 -259 -345 -71 -840 323 -848 l97 -2 40 -51 c194 -245 610 -293 880 -101 27 19 29 19 66 3 140 -62 369 -1 497 133 l43 44 38 -20 c131 -66 304 -39 413 66 35 33 58 45 111 58 189 46 340 179 382 334 23 88 -11 115 -99 77 -133 -55 -228 -22 -326 115 -94 132 -196 196 -331 207 l-62 6 -4 56 c-15 204 -211 367 -431 359 l-79 -2 -34 46 c-116 160 -380 245 -597 192z" />
        <path fill="var(--logo-stroke, currentColor)" d="M1447 2194 c-196 -47 -457 -291 -457 -425 0 -16 -8 -19 -45 -19 -155 0 -320 -89 -425 -228 -259 -345 -71 -840 323 -848 l97 -2 40 -51 c194 -245 610 -293 880 -101 27 19 29 19 66 3 140 -62 369 -1 497 133 l43 44 38 -20 c131 -66 304 -39 413 66 35 33 58 45 111 58 189 46 340 179 382 334 23 88 -11 115 -99 77 -133 -55 -228 -22 -326 115 -94 132 -196 196 -331 207 l-62 6 -4 56 c-15 204 -211 367 -431 359 l-79 -2 -34 46 c-116 160 -380 245 -597 192z m296 -81 c119 -35 217 -108 269 -200 23 -41 35 -52 47 -47 259 107 536 -166 435 -430 -5 -14 0 -13 37 4 82 37 196 20 287 -42 40 -27 71 -63 148 -170 65 -90 210 -138 317 -105 54 17 53 19 26 -35 -52 -101 -194 -196 -326 -217 -54 -9 -66 -15 -99 -51 -184 -203 -557 -49 -439 180 46 89 206 72 193 -20 -4 -24 -2 -27 9 -19 43 36 -20 147 -85 150 -164 7 -259 -157 -179 -310 l26 -51 -49 -50 c-107 -110 -292 -152 -427 -98 l-60 24 -29 -24 c-222 -185 -605 -160 -791 53 l-43 48 46 40 c172 151 121 432 -82 463 -144 21 -258 -194 -122 -229 20 -6 20 -5 -2 18 -82 87 70 201 169 127 180 -133 12 -416 -221 -372 -516 97 -360 950 167 917 l83 -5 5 45 c31 278 396 493 690 406z" />
        <path fill="var(--logo-stroke, currentColor)" d="M1574 1556 c-119 -56 -171 -187 -110 -281 34 -52 108 -74 153 -45 16 10 14 10 -9 5 -71 -14 -137 56 -124 130 36 192 336 194 441 4 125 -226 -99 -523 -375 -496 l-55 6 35 -17 c163 -75 410 42 481 229 109 287 -173 588 -437 465z" />
      </g>
    </svg>
    <span class="brand-wordmark">nimbus</span>
  </div>
  <form method="post" action="/ui/auth/session" aria-label="Local admin sign in">
    {{ ERROR_BLOCK }}
    <label for="local-admin-token">
      <span>Local admin token</span>
      <input id="local-admin-token" type="password" name="token" autocomplete="off" autofocus required spellcheck="false"{{ ARIA_INVALID }} />
    </label>
    <button type="submit">Continue</button>
  </form>
  <div class="hint">
    <p>Copy Token: <button type="button" class="copyable" data-copy="nimbus auth token --copy" aria-label="Copy: nimbus auth token --copy">nimbus auth token --copy</button></p>
  </div>
  <details class="other-ways">
    <summary>Other ways to login</summary>
    <div class="other-ways-body">
      <section class="other-section">
        <h2 class="other-section-title">Auto Login</h2>
        <p class="other-section-body">Run <button type="button" class="copyable" data-copy="nimbus auth url --open" aria-label="Copy: nimbus auth url --open">nimbus auth url --open</button> to open a single-use launch URL in your browser.</p>
      </section>
      <section class="other-section">
        <h2 class="other-section-title">Copy URL</h2>
        <p class="other-section-body">Run <button type="button" class="copyable" data-copy="nimbus auth url --copy" aria-label="Copy: nimbus auth url --copy">nimbus auth url --copy</button> and paste the printed URL in the address bar.</p>
      </section>
    </div>
  </details>
  <p class="local-only" aria-label="Trust scope">
    Local-only<span class="dot" aria-hidden="true"></span><button type="button" class="local-host" data-copy="127.0.0.1" aria-label="Copy host 127.0.0.1" title="127.0.0.1">127.0.0.1</button>
  </p>
</main>
<script src="/ui/auth.js" defer></script>
</body>
</html>
