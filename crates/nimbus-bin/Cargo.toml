[package]
name = "nimbus-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Self-hosted JavaScript backend runtime with V8"
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[features]
# Remote storage providers. Each is opt-in at the bottom of the chain
# (nimbus-storage defaults to no provider) and forwarded upward one crate at a
# time, exactly like `v8-pointer-compression`. The binary-facing crates default
# them on, so `cargo build -p nimbus-bin --no-default-features` is the single
# switch that drops the PostgreSQL, MySQL and libSQL driver stacks. Every
# intra-chain dependency below sets `default-features = false` so that switch
# is not silently re-enabled by a sibling edge.
default = ["libsql", "mysql", "postgres"]
libsql = ["nimbus-cli/libsql"]
mysql = ["nimbus-cli/mysql"]
postgres = ["nimbus-cli/postgres"]
bun-jsc-linked-adapter = ["nimbus-cli/bun-jsc-linked-adapter"]
v8-pointer-compression = ["nimbus-cli/v8-pointer-compression"]

[[bin]]
name = "nimbus"
path = "src/main.rs"

[dependencies]
nimbus-cli = { path = "../nimbus-cli", default-features = false }
tokio.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
libc.workspace = true
