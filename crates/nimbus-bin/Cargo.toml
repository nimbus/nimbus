[package]
name = "nimbus-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Self-hosted JavaScript backend runtime with V8"
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[features]
# LR12: opt-in lane for the live hidden node workload executor integration
# test against session systemd (mirrors nimbus-node's systemd-dbus-integration-tests).
node-workload-executor-integration-tests = [
    "nimbus-cli/node-workload-executor-integration-tests",
]
bun-jsc-linked-adapter = ["nimbus-cli/bun-jsc-linked-adapter"]
v8-pointer-compression = ["nimbus-cli/v8-pointer-compression"]

[[bin]]
name = "nimbus"
path = "src/main.rs"

[dependencies]
nimbus-cli = { path = "../nimbus-cli" }
tokio.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }
