[package]
name = "nimbus-testing"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Remote storage providers. Each is opt-in at the bottom of the chain
# (nimbus-storage defaults to no provider) and forwarded upward one crate at a
# time, exactly like `v8-pointer-compression`. The binary-facing crates default
# them on, so `cargo build -p nimbus-bin --no-default-features` is the single
# switch that drops the PostgreSQL, MySQL and libSQL driver stacks. Every
# intra-chain dependency below sets `default-features = false` so that switch
# is not silently re-enabled by a sibling edge.
default = ["libsql", "mysql", "postgres"]
libsql = ["nimbus-storage/libsql"]
mysql = ["nimbus-storage/mysql"]
postgres = ["nimbus-storage/postgres"]

[dependencies]
axum.workspace = true
nimbus-core = { path = "../nimbus-core" }
nimbus-runtime = { path = "../nimbus-runtime" }
# Shared deterministic harness fixtures intentionally depend on real storage
# providers so replay/drill lanes can exercise provider-backed tenant stores
# without pulling engine/server ownership backedges into this crate.
nimbus-storage = { path = "../nimbus-storage", default-features = false }
nimbus-tenant = { path = "../nimbus-tenant" }
nimbus-workloads = { path = "../nimbus-workloads" }
futures.workspace = true
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
nimbus-network = { path = "../nimbus-network", features = ["test-support"] }
