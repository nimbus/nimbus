<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nimbus &middot; Sign in</title>
<style>
@font-face {
  font-family: "Geist Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/ui/fonts/GeistMono-Regular.woff2") format("woff2");
}
@font-face {
  font-family: "Geist Mono";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("/ui/fonts/GeistMono-Medium.woff2") format("woff2");
}

:root {
  color-scheme: light;
  /* Lucide-family copy + check icons. Inlined via mask-image so the glyph
     inherits `currentColor` from the host button — keeps the icon in sync
     with text color, hover state, and data-copied state without re-encoding
     the SVG per theme. Source: lucide.dev (MIT) — `Copy` and `Check`. */
  --icon-copy: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='14' height='14' x='8' y='8' rx='2'/><path d='M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2'/></svg>");
  --icon-check: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>");
  --color-bg: oklch(96.5% 0.008 248);
  --color-surface: oklch(100% 0 0);
  --color-surface-2: oklch(96% 0.008 248);
  --color-border: oklch(91% 0.013 252);
  --color-border-strong: oklch(82% 0.020 250);
  --color-text: oklch(20% 0.035 263);
  --color-muted: oklch(48% 0.028 255);
  --color-link: oklch(54% 0.22 264);
  --color-danger: oklch(54% 0.20 27);
  --color-danger-soft: oklch(96% 0.04 27);
  /* Brand-tier blue. Locked to the Cool Blue primary from DESIGN.md
     §Brand Palette / Two-Tier Bridge; never swaps with operator-console
     palette (mono / warm) because /ui/auth is a first-contact surface. */
  --brand-blue: oklch(62% 0.20 258);
  --brand-blue-soft: oklch(85% 0.10 197);
  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04),
                 0 8px 24px rgba(15, 23, 42, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-bg: oklch(13% 0.026 263);
    --color-surface: oklch(19% 0.030 258);
    --color-surface-2: oklch(24% 0.030 258);
    --color-border: oklch(32% 0.030 258);
    --color-border-strong: oklch(40% 0.030 258);
    --color-text: oklch(91% 0.014 252);
    --color-muted: oklch(67% 0.026 248);
    --color-link: oklch(82% 0.11 247);
    --color-danger: oklch(70% 0.18 24);
    --color-danger-soft: oklch(28% 0.08 24);
    --brand-blue: oklch(72% 0.17 248);
    --brand-blue-soft: oklch(70% 0.13 207);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4),
                   0 8px 24px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

main {
  width: 100%;
  max-width: 380px;
  /* Positioning context for the absolute `.brand-version` chip in the
     upper-right corner. The hero brand block underneath stays centered
     without having to share an axis with the version metadata. */
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 32px 28px 28px;
  box-shadow: var(--shadow-card);
}

/* Hero brand block. Stacked vertically and centered so the cloud mark sits
   above the wordmark as a single identity unit — gives the first-contact
   surface clear brand presence without resorting to marketing-tier
   decoration. The version chip moves out of this row entirely and lives
   in the footer alongside the trust-scope readout. */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.brand-mark {
  width: 56px;
  height: auto;
  aspect-ratio: 120 / 92;
  display: block;
  /* The solid mascot is the sticker: fixed amber body and ink face in
     both schemes, the same drawing as the favicon and the app icon. */
}

.brand-wordmark {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 500;
  font-size: 19px;
  letter-spacing: 0.02em;
  /* Same brand-tier blue as the logo outline so the mark + wordmark read as
     one brand block on this first-contact surface. */
  color: var(--brand-blue);
}

/* Version chip — pinned to the card's upper-right corner. Floats over the
   hero so the centered brand block stays on-axis. Treatment matches the
   pre-hero chip (mono, surface-2 fill, hairline border, muted text) so it
   reads as quiet metadata, not a CTA. Rendered as a button so the value
   is one click from the clipboard; trailing icon stays permanently
   visible (at low opacity) so the affordance is discoverable without
   needing to hover the upper-right corner. */
.brand-version {
  position: absolute;
  top: 16px;
  right: 16px;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--color-muted);
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease;
}

.brand-version:hover {
  border-color: color-mix(in oklch, var(--brand-blue) 45%, var(--color-border));
  color: var(--color-text);
}

.brand-version:focus-visible {
  outline: none;
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

.brand-version[data-copied="true"] {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
}

/* Trailing affordance — kept permanently visible at low opacity so the
   copy gesture is discoverable without having to hover the upper-right
   corner first. Bumps to fuller opacity on hover/focus, swaps to the
   check glyph on success. */
.brand-version::after {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-left: 5px;
  vertical-align: -1px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0.5;
  transition: opacity 120ms ease;
}

.brand-version:hover::after,
.brand-version:focus-visible::after {
  opacity: 0.85;
}

.brand-version[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}

/* Copyable command — interactive sibling of <code>. Click to copy; the
   pseudo-element animates in a check on success. Mirrors the React
   `CopyChip` component from packages/nimbus-ui/src/components/copy-chip.tsx
   so the auth surface honours the DESIGN.md "Copy-to-Clipboard Chip" rule
   for every machine-readable value. */
.copyable {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  font-weight: 400;
  line-height: inherit;
  letter-spacing: 0.01em;
  display: inline-block;
  color: var(--color-text);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 2px 8px;
  margin: 0;
  text-align: left;
  cursor: pointer;
  word-break: break-all;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.copyable:hover {
  border-color: color-mix(in oklch, var(--brand-blue) 55%, var(--color-border));
  color: var(--color-text);
}

.copyable:focus-visible {
  outline: none;
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

.copyable[data-copied="true"] {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
}

/* Trailing copy glyph — 11px lucide mark masked from the button's
   currentColor so it tracks text color, hover, and data-copied transitions
   without a per-state SVG swap. Placed *after* the value because the chip
   IS the value (Pattern B in DESIGN.md §Copy-to-Clipboard Chip terms) —
   trailing matches Stripe, Vercel, Convex, Firebase, and Linear's chip
   conventions and keeps every value left-anchored regardless of length.
   CSP-clean: no inline `<img>`, no external request. */
.copyable::after {
  content: "";
  display: inline-block;
  width: 13px;
  height: 13px;
  margin-left: 6px;
  vertical-align: -2px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0.55;
  transition: opacity 120ms ease;
}

.copyable:hover::after,
.copyable:focus-visible::after {
  opacity: 0.85;
}

.copyable[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}

form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  /* Compensates for the removed h1 spacer — keeps the ENTER AUTH TOKEN
     label clear of the wordmark without resurrecting a heading. */
  margin-top: 4px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-muted);
}

input[type="password"] {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px;
  letter-spacing: 0.01em;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

input[type="password"]:focus {
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

input[type="password"][aria-invalid="true"] {
  border-color: var(--color-danger);
}

input[type="password"][aria-invalid="true"]:focus {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-danger) 25%, transparent);
}

.error-message {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 4px;
  padding: 9px 11px;
  background: var(--color-danger-soft);
  border: 1px solid color-mix(in oklch, var(--color-danger) 45%, transparent);
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--color-danger);
}

.error-message .error-icon {
  flex: 0 0 auto;
  margin-top: 1px;
  font-weight: 600;
}

button[type="submit"] {
  margin-top: 6px;
  background: var(--brand-blue);
  color: var(--color-surface);
  border: 1px solid var(--brand-blue);
  border-radius: 8px;
  padding: 11px 14px;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: filter 120ms ease, box-shadow 120ms ease;
}

button[type="submit"]:hover {
  filter: brightness(1.04);
}

button[type="submit"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 35%, transparent);
}

/* `How to login` disclosure. Catalogs every recovery path (Token + the
   two URL flows) behind a collapsed details/summary so the form's
   CONTINUE button and the hero `.shell-block` recovery surface stay the
   primary CTAs. Class name kept as `.other-ways` so the existing
   summary/body chrome rules don't need to fork. */
.other-ways {
  margin: 14px 0 0;
  font-size: 14px;
  color: var(--color-muted);
}

.other-ways summary {
  cursor: pointer;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-muted);
  outline: none;
  list-style: none;
  padding: 6px 0;
}

.other-ways summary::-webkit-details-marker { display: none; }

.other-ways summary::before {
  content: "›";
  display: inline-block;
  width: 12px;
  margin-right: 2px;
  transition: transform 120ms ease;
  color: var(--color-muted);
}

.other-ways[open] summary::before {
  transform: rotate(90deg);
}

.other-ways summary:focus-visible {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
  border-radius: 4px;
}

.other-ways-body {
  padding: 10px 2px 2px;
  line-height: 1.5;
}

/* Eyebrow-titled section block. Used by the entries inside the
   `How to login` disclosure (Token + the two URL flows). The eyebrow
   title sits *above* its body so the body gets the full card width —
   long shell snippets and URLs fit on one line, and the layout mirrors
   how the ENTER AUTH TOKEN label sits above its input. */
.other-section + .other-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--color-border);
}

.other-section-title {
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-muted);
  margin: 0 0 8px;
}

.other-section-body {
  margin: 0 0 10px;
  color: var(--color-muted);
}

.other-section-body:last-child {
  margin-bottom: 0;
}

/* Shell-snippet block — full-width recovery surface that sits between
   the form's CONTINUE button and the `How to login` disclosure. Mirrors
   DESIGN.md §Code Block (surface-2 fill, hairline border, 12px padding,
   header strip with language label on the left and the copy affordance
   on the right) and specializes it for a single shell command. The
   entire block is a button so a click anywhere copies the value,
   matching Stripe / Vercel / Convex prior art for shell-snippet copy
   blocks. Full-width so the recovery surface reads as a peer of the
   CONTINUE button above. */
.shell-block {
  display: block;
  width: 100%;
  margin: 16px 0 0;
  padding: 0;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  text-align: left;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--color-text);
  cursor: pointer;
  overflow: hidden;
  transition: border-color 120ms ease, color 120ms ease;
}

.shell-block:hover {
  border-color: color-mix(in oklch, var(--brand-blue) 55%, var(--color-border));
}

.shell-block:focus-visible {
  outline: none;
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand-blue) 22%, transparent);
}

.shell-block[data-copied="true"] {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
}

.shell-block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  background: color-mix(in oklch, var(--color-surface-2) 55%, var(--color-bg));
  border-bottom: 1px solid var(--color-border);
}

.shell-block-lang {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-muted);
}

/* Trailing copy/check glyph — pinned to the header strip's right edge so
   the affordance sits in the canonical Code-Block position from DESIGN.md
   §Code Block. Currentcolor-driven via mask so hover and data-copied
   state stay in sync without a per-state SVG swap. */
.shell-block-head::after {
  content: "";
  display: inline-block;
  width: 13px;
  height: 13px;
  background-color: var(--color-muted);
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0.75;
  transition: opacity 120ms ease, background-color 120ms ease,
              -webkit-mask-image 120ms ease, mask-image 120ms ease;
}

.shell-block:hover .shell-block-head::after,
.shell-block:focus-visible .shell-block-head::after {
  opacity: 1;
  background-color: var(--color-text);
}

.shell-block[data-copied="true"] .shell-block-head::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  background-color: var(--brand-blue);
  opacity: 1;
}

.shell-block-body {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.5;
}

.shell-block-prompt {
  color: var(--brand-blue);
  user-select: none;
}

.shell-block-cmd {
  color: var(--color-text);
  word-break: break-all;
}

.shell-block[data-copied="true"] .shell-block-cmd {
  color: var(--brand-blue);
}

.local-only {
  margin: 20px 0 0;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--color-muted);
  text-align: center;
}

.local-only .dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand-blue);
  margin: 0 6px 1px;
  vertical-align: middle;
}

/* Trust-scope host readout. Inline copy button without chip chrome so it
   sits flush against the "Local-only" prefix; the underline-on-hover is
   the discoverability cue, not a border. Brand-blue + check-icon swap on
   data-copied state mirror the full chip variant. */
.local-host {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  text-decoration: underline dotted color-mix(in oklch, var(--color-muted) 60%, transparent);
  text-underline-offset: 3px;
  transition: color 120ms ease, text-decoration-color 120ms ease;
}

.local-host:hover,
.local-host:focus-visible {
  outline: none;
  color: var(--color-text);
  text-decoration-color: var(--brand-blue);
}

.local-host[data-copied="true"] {
  color: var(--brand-blue);
  text-decoration-color: var(--brand-blue);
}

/* Hover-revealed trailing affordance — same DESIGN.md §923 ghost pattern
   as `.brand-version`. The dotted underline is the always-visible
   "interactive" cue; the icon is the secondary "what kind of action"
   cue, revealed on intent so the trust-scope line reads as a quiet
   footer at rest. */
.local-host::after {
  content: "";
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-left: 5px;
  vertical-align: -1px;
  background-color: currentColor;
  -webkit-mask: var(--icon-copy) center/contain no-repeat;
          mask: var(--icon-copy) center/contain no-repeat;
  opacity: 0;
  transition: opacity 120ms ease;
}

.local-host:hover::after,
.local-host:focus-visible::after {
  opacity: 0.75;
}

.local-host[data-copied="true"]::after {
  -webkit-mask-image: var(--icon-check);
          mask-image: var(--icon-check);
  opacity: 1;
}
</style>
</head>
<body>
<main aria-label="Sign in to Nimbus">
  <button type="button" class="brand-version" data-copy="v{{ NIMBUS_VERSION }}" aria-label="Copy version v{{ NIMBUS_VERSION }}" title="v{{ NIMBUS_VERSION }}">v{{ NIMBUS_VERSION }}</button>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 120 92" role="img" aria-label="Nimbus">
      <title>Nimbus</title>
      <g fill="#f0b23e"><circle cx="36" cy="50" r="20"/><circle cx="60" cy="40" r="28"/><circle cx="84" cy="50" r="20"/><rect x="14" y="50" width="92" height="34" rx="17"/></g>
      <g fill="#1a1204"><circle cx="48" cy="52" r="3.8"/><circle cx="72" cy="52" r="3.8"/></g>
      <path d="M52 62 q8 8 16 0" fill="none" stroke="#1a1204" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="brand-wordmark">nimbus</span>
  </div>
  <form method="post" action="/ui/auth/session" aria-label="Auth token sign in">
    {{ ERROR_BLOCK }}
    <label for="auth-token">
      <span>Enter auth token</span>
      <input id="auth-token" type="password" name="token" autocomplete="off" autofocus required spellcheck="false"{{ ARIA_INVALID }} />
    </label>
    <button type="submit">Continue</button>
  </form>
  <button type="button" class="shell-block" data-copy="nimbus auth token --copy" aria-label="Copy: nimbus auth token --copy">
    <span class="shell-block-head">
      <span class="shell-block-lang">terminal</span>
    </span>
    <span class="shell-block-body"><span class="shell-block-prompt" aria-hidden="true">$</span><span class="shell-block-cmd">nimbus auth token --copy</span></span>
  </button>
  <details class="other-ways">
    <summary>How to login</summary>
    <div class="other-ways-body">
      <section class="other-section">
        <h2 class="other-section-title">Copy Token</h2>
        <p class="other-section-body">Run <button type="button" class="copyable" data-copy="nimbus auth token --copy" aria-label="Copy: nimbus auth token --copy">nimbus auth token --copy</button>, then paste the token into the field above.</p>
      </section>
      <section class="other-section">
        <h2 class="other-section-title">Open URL</h2>
        <p class="other-section-body">Run <button type="button" class="copyable" data-copy="nimbus auth url --open" aria-label="Copy: nimbus auth url --open">nimbus auth url --open</button> to open a single-use sign-in URL in your browser.</p>
      </section>
      <section class="other-section">
        <h2 class="other-section-title">Copy URL</h2>
        <p class="other-section-body">Run <button type="button" class="copyable" data-copy="nimbus auth url --copy" aria-label="Copy: nimbus auth url --copy">nimbus auth url --copy</button>, then paste the URL into your browser's address bar.</p>
      </section>
    </div>
  </details>
