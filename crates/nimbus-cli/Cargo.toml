[package]
name = "nimbus-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Nimbus CLI application library"
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[features]
# LR12: opt-in lane for the live hidden node workload executor integration
# test against session systemd (mirrors nimbus-node's systemd-dbus-integration-tests).
node-workload-executor-integration-tests = []
bun-jsc-linked-adapter = [
    "nimbus/bun-jsc-linked-adapter",
    "nimbus-server/bun-jsc-linked-adapter",
]
v8-pointer-compression = ["nimbus/v8-pointer-compression"]

[dependencies]
aes-gcm-siv.workspace = true
axum.workspace = true
clap.workspace = true
comfy-table.workspace = true
fs2.workspace = true
hyper = { workspace = true, features = ["client", "http1", "runtime"] }
indicatif.workspace = true
libc.workspace = true
nimbus = { path = "../nimbus", features = ["aws-kms"] }
nimbus-assets = { path = "../nimbus-assets", features = ["js-packages", "templates"] }
nimbus-convex = { path = "../nimbus-convex" }
nimbus-core = { path = "../nimbus-core" }
nimbus-crypto = { path = "../nimbus-crypto" }
nimbus-fs = { path = "../nimbus-fs" }
nimbus-kv = { path = "../nimbus-kv" }
nimbus-machine = { path = "../nimbus-machine" }
nimbus-node = { path = "../nimbus-node" }
nimbus-operator = { path = "../nimbus-operator" }
nimbus-server = { path = "../nimbus-server" }
nimbus-services = { path = "../nimbus-services" }
nimbus-sandbox = { path = "../nimbus-sandbox" }
nimbus-system = { path = "../nimbus-system" }
nimbus-tenant = { path = "../nimbus-tenant" }
nimbus-workloads = { path = "../nimbus-workloads" }
open = "5.3"
rand.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
signal-hook-registry.workspace = true
shell-words.workspace = true
tar.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true
flate2 = "1"
oci-client = "0.16"
zstd = "0.13"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
nimbus-engine = { path = "../nimbus-engine", features = ["test-hooks"] }
nimbus-testing = { path = "../nimbus-testing" }
serial_test.workspace = true
tempfile.workspace = true
