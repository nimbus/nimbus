[package]
name = "nimbus-blob"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
# Floor for native trait upcasting (`Arc<dyn ReplicatingBlobStore>` ->
# `Arc<dyn BlobStore>`, spec §17 D2). Upcasting stabilized in Rust 1.86.
rust-version = "1.86"

[lints]
workspace = true

[features]
# The cluster leg (`ReplicatingBlobStore` + `BlobTicket` + `PeerAddr`) is gated
# off by default; it lands fully when `nimbus-cluster` (iroh substrate) lands.
cluster = []

[dependencies]
nimbus-crypto = { path = "../nimbus-crypto" }
nimbus-core = { path = "../nimbus-core" }
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
# Advisory root lock (flock). fs2 is the workspace's established locking
# crate (cli, crypto, sandbox, server, operator); a repo-wide fs2->fs4
# refresh is an enterprise-crate-adoption question, not this crate's.
fs2.workspace = true
object_store.workspace = true
reed-solomon-simd = "=3.1.0"
# The durable-write recipe (src/disk.rs) writes commit-point files through a
# same-directory temp file persisted into place.
tempfile.workspace = true
tokio = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
futures.workspace = true
